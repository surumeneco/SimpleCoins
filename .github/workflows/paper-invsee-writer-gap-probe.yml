name: A02 real Paper InvSee++ offline playerdata writer gap
on:
  pull_request:
    branches: [develop]
    paths:
      - 'tests/paper-invsee-writer-probe/**'
      - 'Lifecycle/Works/simplecoins.a02.paper-invsee-actual-offline-writer.md'
      - '.github/workflows/paper-invsee-writer-gap-probe.yml'
permissions:
  contents: read
jobs:
  actual-invsee-offline-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate issue Work only, never imply CAT normative approval
        run: |
          set -euo pipefail
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.paper-invsee-actual-offline-writer.md
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/MineCraftXPlayServer
          ref: 90aa2d0e0a5ea80c705fd67d717f463decaf2a32
          path: pinned-server
          sparse-checkout: |
            plugins/InvSee++.jar
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Pin actual distributed InvSee++ bytes, not upstream source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-server rev-parse HEAD)" = \
            "90aa2d0e0a5ea80c705fd67d717f463decaf2a32"
          test -s 'pinned-server/plugins/InvSee++.jar'
          echo '01f3e053a814f76d46513ebf65a38747df11df81c577d12bed108b353d7775f9  pinned-server/plugins/InvSee++.jar' | sha256sum -c -
          unzip -p pinned-server/plugins/InvSee++.jar plugin.yml |
            grep -E '^name: InvSeePlusPlus$|^main: com.janboerman.invsee.spigot.InvseePlusPlus$'
          javap -classpath pinned-server/plugins/InvSee++.jar \
            -p com.janboerman.invsee.paper.impl_26_2.InvseeImpl |
            grep -F 'saveInventory('
          echo 'PINNED_INVSEE_PLUSPLUS_PAPER_26_2_METHOD_CONFIRMED'
      - name: Build product guard and isolated observer from real distributed API JAR
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon test :admission-guard:test jar :admission-guard:jar
          gradle --no-daemon -p tests/paper-invsee-writer-probe jar
          python3 tools/simplecoins_preflight.py admission-guard/build/libs/admission-guard-1.0.0.jar build/libs/SimpleCoins-1.0.0.jar
          unzip -p tests/paper-invsee-writer-probe/build/libs/SimpleCoinsInvseeWriterProbe.jar plugin.yml |
            grep -F 'name: SimpleCoinsInvseeWriterProbe'
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fq 'InvseeWriterProbe.class'; then
            echo 'CI observer leaked into product JAR' >&2
            exit 1
          fi
      - name: Download official Paper 26.2 build 134 with verified SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-A02-InvSee-Probe/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' -o smoke/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke/paper.jar
          printf '%s  %s\n' "$sha" smoke/paper.jar | sha256sum -c -
      - name: Run isolated Paper+product+admission guard+InvSee++ and real saved-data change
        shell: bash
        run: |
          set -euo pipefail
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke/plugins/SimpleCoins.jar
          cp pinned-server/plugins/InvSee++.jar smoke/plugins/InvSeePlusPlus.jar
          cp tests/paper-invsee-writer-probe/build/libs/SimpleCoinsInvseeWriterProbe.jar smoke/plugins/InvseeWriterProbe.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25587\n' > smoke/server.properties
          cd smoke
          set +e
          timeout --signal=TERM --kill-after=10s 190s \
            java -Xms256M -Xmx1024M -jar paper.jar nogui \
              </dev/null > paper-a02-invsee.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "Paper+InvSee++ experiment exit code $code" >&2
            tail -200 paper-a02-invsee.log
            exit 1
          fi
          if grep -Fq 'PAPER_A02_INVSEE_PROBE_FAILED' paper-a02-invsee.log; then
            tail -200 paper-a02-invsee.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-invsee.log
          grep -F 'PAPER_A02_INVSEE_REAL_SAVED_COIN_RECEIPT_PROOF_PASSED' paper-a02-invsee.log
          grep -F 'PAPER_A02_INVSEE_REAL_OFFLINE_INVENTORY_CAPTURE_PASSED' paper-a02-invsee.log
          grep -F 'PAPER_A02_INVSEE_ACTUAL_OFFLINE_SAVED_COIN_REMOVAL_RECEIPT_RETAINED' paper-a02-invsee.log
          grep -F 'PAPER_A02_INVSEE_FRESH_READBACK_REFUSED_STALE_PROOF_PASSED' paper-a02-invsee.log
          grep -F 'PAPER_A02_INVSEE_ACTUAL_PLUGIN_POST_PROOF_FALSE_ACK_REPRODUCED' paper-a02-invsee.log
          grep -F 'PAPER_A02_INVSEE_NO_CLIENT_NO_PRODUCTION_ISSUANCE' paper-a02-invsee.log
          echo 'PAPER_A02_PINNED_INVSEE_OFFLINE_WRITER_GAP_COUNTEREXAMPLE_PASSED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-a02-actual-invsee-offline-writer-log
          path: smoke/paper-a02-invsee.log
          if-no-files-found: ignore
          retention-days: 14
