name: A02 real InvSee++ save bypasses UUID.dat advisory lock
on:
  pull_request:
    branches: [develop]
    paths:
      - 'tests/paper-invsee-writer-probe/**'
      - 'Lifecycle/Works/simplecoins.a02.advisory-playerdata-lock-invsee.md'
      - '.github/workflows/paper-a02-invsee-filelock-bypass.yml'
permissions:
  contents: read
jobs:
  sync-and-abrupt-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate issue-only Work structure without normative CAT approval
        shell: bash
        run: |
          set -euo pipefail
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.advisory-playerdata-lock-invsee.md
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/MineCraftXPlayServer
          ref: 90aa2d0e0a5ea80c705fd67d717f463decaf2a32
          path: pinned-server
          sparse-checkout: |
            plugins/InvSee++.jar
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Confirm the actual pinned InvSee++ test API JAR
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-server rev-parse HEAD)" = "90aa2d0e0a5ea80c705fd67d717f463decaf2a32"
          echo '01f3e053a814f76d46513ebf65a38747df11df81c577d12bed108b353d7775f9  pinned-server/plugins/InvSee++.jar' | sha256sum -c -
      - name: Build isolated Paper observer and hardened product+independent guard
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :test :admission-guard:test jar :admission-guard:jar
          gradle --no-daemon -p tests/paper-invsee-writer-probe jar
          python3 tools/simplecoins_preflight.py admission-guard/build/libs/admission-guard-1.0.0.jar build/libs/SimpleCoins-1.0.0.jar
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fq 'InvseeWriterProbe.class'; then
            echo 'test-only probe class leaked into product JAR' >&2
            exit 1
          fi
      - name: Download SHA256-verified official Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-advisory-lock/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-A02-Durability-Probe/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' -o smoke-advisory-lock/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke-advisory-lock/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke-advisory-lock/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke-advisory-lock/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke-advisory-lock/paper.jar
          printf '%s  %s\n' "$sha" smoke-advisory-lock/paper.jar | sha256sum -c -
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke-advisory-lock/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke-advisory-lock/plugins/SimpleCoins.jar
          cp pinned-server/plugins/InvSee++.jar smoke-advisory-lock/plugins/InvSeePlusPlus.jar
          cp tests/paper-invsee-writer-probe/build/libs/SimpleCoinsInvseeWriterProbe.jar smoke-advisory-lock/plugins/InvseeWriterProbe.jar
          printf 'eula=true\n' > smoke-advisory-lock/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25592\n' > smoke-advisory-lock/server.properties
      - name: Real Paper InvSee++ save attempts while original UUID.dat is locked
        shell: bash
        run: |
          set -euo pipefail
          cd smoke-advisory-lock
          set +e
          timeout --signal=TERM --kill-after=10s 190s \
            java -Da02.invsee.lockHeldDuringSave=true -Xms256M -Xmx1024M -jar paper.jar nogui \
              </dev/null > paper-a02-first-fsync-halt.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "Unexpected first Paper JVM exit: $code (wanted expected normal 0)" >&2
            tail -200 paper-a02-first-fsync-halt.log
            exit 1
          fi
          if grep -Fq 'PAPER_A02_INVSEE_PROBE_FAILED' paper-a02-first-fsync-halt.log; then
            tail -200 paper-a02-first-fsync-halt.log
            exit 1
          fi

          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-first-fsync-halt.log
          grep -F 'PAPER_A02_INVSEE_REAL_SAVED_COIN_RECEIPT_PROOF_PASSED' paper-a02-first-fsync-halt.log
          grep -F 'PAPER_A02_ACTUAL_UUID_DAT_OS_ADVISORY_EXCLUSIVE_LOCK_HELD' paper-a02-first-fsync-halt.log
          grep -F 'PAPER_A02_OS_LOCK_REMAINED_VALID_AFTER_INVSEE_SAVE' paper-a02-first-fsync-halt.log
          grep -F 'PAPER_A02_INVSEE_WRITER_OVERWROTE_SAVED_COIN_DESPITE_OLD_FILE_LOCK' paper-a02-first-fsync-halt.log
          grep -F 'PAPER_A02_ADVISORY_UUID_DAT_LOCK_NOT_SUFFICIENT_WRITER_FENCE' paper-a02-first-fsync-halt.log
          grep -F 'PAPER_A02_ADVISORY_LOCK_TEST_LEDGER_STILL_PENDING_NO_ACK' paper-a02-first-fsync-halt.log
          if grep -Fq 'PAPER_A02_INVSEE_PROBE_FAILED' paper-a02-first-fsync-halt.log; then exit 1; fi
          if grep -Fq 'PAPER_A02_INVSEE_ACTUAL_PLUGIN_POST_PROOF_FALSE_ACK_REPRODUCED' paper-a02-first-fsync-halt.log; then exit 1; fi
          echo 'PAPER_A02_REAL_ADVISORY_LOCK_BYPASS_PROVED_NOT_WRITER_FENCE'
      - name: Upload read-only real Paper writer-lock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a02-paper-invsee-old-inode-lock-bypass
          path: |
            smoke-advisory-lock/paper-a02-first-fsync-halt.log
          retention-days: 14
          if-no-files-found: ignore
