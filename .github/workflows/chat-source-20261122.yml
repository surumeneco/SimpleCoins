name: Chat source snapshot 20261122 (temporary)
on:
  push:
    branches:
      - infra/chat-source-20261122-g0
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          ref: 1c694844399f66c3ab54c30ce037b3447d13e003
          fetch-depth: 1
          persist-credentials: false
      - name: Archive immutable sources with identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1c694844399f66c3ab54c30ce037b3447d13e003"
          mkdir -p snapshot
          git archive --format=tar HEAD | gzip -n > snapshot/repository.tar.gz
          printf 'repository=%s\ncommit=%s\ntree=%s\n' 'surumeneco/SimpleCoins' "1c694844399f66c3ab54c30ce037b3447d13e003" "$(git rev-parse HEAD^{tree})" > snapshot/identity.txt
          (cd snapshot && sha256sum repository.tar.gz > archive.sha256)
      - name: Transfer read-only snapshot
        uses: actions/upload-artifact@v4
        with:
          name: immutable-simplecoins-source-20261122
          path: snapshot/
          if-no-files-found: error
          retention-days: 1
