name: G0 in-process startup publication and journal monitor gate JUnit
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.g0.startup-publication-monitor-oracle.md'
      - 'src/test/java/co/surumene/simplecoins/domain/SettlementStartupPublicationBoundaryIntegrationTest.java'
      - '.github/workflows/g0-startup-publication-monitor-oracle.yml'
permissions:
  contents: read
jobs:
  startup-publication-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate scoped Draft Work structurally, not normative CAT Gate
        shell: bash
        run: |
          set -euo pipefail
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.g0.startup-publication-monitor-oracle.md
      - name: Execute actual root JUnit scenario queue for settlement publication
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :test \
            --tests co.surumene.simplecoins.domain.SettlementStartupPublicationBoundaryIntegrationTest
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path('build/test-results/test').glob(
              'TEST-*SettlementStartupPublicationBoundaryIntegrationTest.xml'))
          assert len(files)==1,files
          suite=ET.parse(files[0]).getroot()
          assert int(suite.get('tests',0))>=6,suite.attrib
          assert all(suite.get(k)=='0' for k in ['failures','errors','skipped']),suite.attrib
          print('G0_MODEL_ONLY_PUBLICATION_ATOMICITY_AND_JOURNAL_REVOKE_SIX_CASES_PASSED')
          print('G0_NOT_REAL_PAPER_OR_FULL_WORLD_WRITER_EPOCH')
          PY
      - name: Preserve JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-startup-publication-monitor-junit
          path: build/test-results/test/*.xml
          retention-days: 14
          if-no-files-found: ignore
