          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.live-equipment-mirror-once.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance \
            --work Lifecycle/Works/simplecoins.a05.live-equipment-mirror-once.md --kind process-closure
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py compile \
            --work Lifecycle/Works/simplecoins.a05.live-equipment-mirror-once.md --kind model
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance \
