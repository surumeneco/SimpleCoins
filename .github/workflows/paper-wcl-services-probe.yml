name: Paper 26.2 pinned WCL WWC WWW multi-provider registration smoke
on:
  pull_request:
    branches: [develop]
    paths:
      - 'tests/paper-wcl-services-probe/**'
      - '.github/workflows/paper-wcl-services-probe.yml'
      - 'src/main/resources/plugin.yml'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperWonderfulReaderRegistry.java'
      - 'src/main/java/co/surumene/simplecoins/SimpleCoinsPlugin.java'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperWonderfulLoadedEvidence.java'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperWonderfulSnapshotAssets.java'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperWonderfulSavedPdc.java'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperWonderfulSavedChunkCandidates.java'
      - 'Lifecycle/Works/simplecoins.a05.saved-chunk-wcl-candidates.md'
      - 'Lifecycle/Works/simplecoins.a05.live-tame-owner-proof.md'
      - 'Lifecycle/Works/simplecoins.a05.single-read-live-wcl-candidate.md'
      - 'Lifecycle/Works/simplecoins.a05.live-wcl-hybrid-stage.md'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperCapturedHybridSettlement.java'
      - 'src/main/java/co/surumene/simplecoins/domain/WclHybridLiveOverlay.java'
      - 'src/test/java/co/surumene/simplecoins/domain/WclHybridLiveOverlayTest.java'
      - 'src/test/java/co/surumene/simplecoins/paper/PaperCapturedHybridSettlementWclTest.java'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperWonderfulLiveCandidates.java'
      - 'src/test/java/co/surumene/simplecoins/paper/PaperWonderfulLiveCandidateTest.java'
      - 'src/main/java/co/surumene/simplecoins/domain/WclLiveTameObservation.java'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperWonderfulLiveOwnerEvidence.java'
      - 'src/test/java/co/surumene/simplecoins/domain/WclLiveTameObservationTest.java'
      - 'Lifecycle/Works/simplecoins.a05.wcl-shared-wallet-identities.md'
      - 'Lifecycle/Works/simplecoins.a05.wcl-physical-slot-collisions.md'
      - 'Lifecycle/Works/simplecoins.a05.wwc-complete-slots.md'
      - 'Lifecycle/Works/simplecoins.a05.wwc-display-proxy-collision.md'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperWwcDisplayPhysicalAlias.java'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperLoadedChunkAssets.java'
      - 'src/main/java/co/surumene/simplecoins/domain/SettlementAccumulator.java'
      - 'src/test/java/co/surumene/simplecoins/domain/LiveWclPhysicalAliasTest.java'
      - 'src/main/java/co/surumene/simplecoins/domain/WclPhysicalSlotIdentity.java'
      - 'src/test/java/co/surumene/simplecoins/domain/WclPhysicalSlotIdentityTest.java'
      - 'Lifecycle/Works/simplecoins.a05.saved-pdc-reconstruction.md'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperLiveItemValue.java'
      - 'Lifecycle/Works/simplecoins.a05.wcl-serialized-currency.md'
      - 'Lifecycle/Works/simplecoins.a05.live-loaded-reader.md'
      - 'Lifecycle/Works/simplecoins.a05.current-distribution-compat.md'
      - 'Lifecycle/Works/simplecoins.a05.stored-reader.md'
      - 'Lifecycle/Works/simplecoins.a05.softdepend-distributed-plugin-names.md'
      - 'Lifecycle/Works/simplecoins.a05.live-multiple-provider-registration.md'
      - 'Lifecycle/Works/simplecoins.a05.paper-stored-currency-providers.md'
      - 'Lifecycle/Works/simplecoins.a05.wwc-paper-entity-save-reload.md'
      - 'Lifecycle/Works/simplecoins.a05.wwc-offline-entity-anvil-proof.md'
      - 'Lifecycle/Works/simplecoins.a05.www-offline-entity-anvil-proof.md'
      - 'Lifecycle/Works/simplecoins.a05.unloaded-stored-provider-readback.md'
      - 'Lifecycle/Works/simplecoins.a05.wcl-verified-traversal-paper.md'
      - 'Lifecycle/Works/simplecoins.a05.paper-discovered-source-closure-proof.md'
permissions:
  contents: read

jobs:
  real-paper-storage-services:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate A05 work and bounded Confirmed Process/Model gates
        run: |
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.live-multiple-provider-registration.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.live-loaded-reader.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.current-distribution-compat.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.stored-reader.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.paper-stored-currency-providers.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.wwc-paper-entity-save-reload.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.wwc-offline-entity-anvil-proof.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.www-offline-entity-anvil-proof.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.unloaded-stored-provider-readback.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.wcl-verified-traversal-paper.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.paper-discovered-source-closure-proof.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.softdepend-distributed-plugin-names.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.wcl-serialized-currency.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.saved-pdc-reconstruction.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.saved-chunk-wcl-candidates.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.wcl-shared-wallet-identities.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.wcl-physical-slot-collisions.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.wwc-complete-slots.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.wwc-display-proxy-collision.md
          # The Confirmed source here is A05 s0-s7, not a global G0/G3 gate.
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.live-tame-owner-proof.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance \
            --work Lifecycle/Works/simplecoins.a05.live-tame-owner-proof.md --kind process-closure
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py compile \
            --work Lifecycle/Works/simplecoins.a05.live-tame-owner-proof.md --kind model
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance \
            --work Lifecycle/Works/simplecoins.a05.live-tame-owner-proof.md --kind model-conformance
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.single-read-live-wcl-candidate.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance \
            --work Lifecycle/Works/simplecoins.a05.single-read-live-wcl-candidate.md --kind process-closure
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py compile \
            --work Lifecycle/Works/simplecoins.a05.single-read-live-wcl-candidate.md --kind model
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance \
            --work Lifecycle/Works/simplecoins.a05.single-read-live-wcl-candidate.md --kind model-conformance
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a05.live-wcl-hybrid-stage.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance \
            --work Lifecycle/Works/simplecoins.a05.live-wcl-hybrid-stage.md --kind process-closure
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py compile \
            --work Lifecycle/Works/simplecoins.a05.live-wcl-hybrid-stage.md --kind model
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance \
            --work Lifecycle/Works/simplecoins.a05.live-wcl-hybrid-stage.md --kind model-conformance
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/MineCraftXPlayServer
          ref: 79e4afdbc530c9f8151c44bb390d06f7ff8fcf6e
          path: server-snapshot
          sparse-checkout: |
            plugins/WonderfulGenomeLib-1.0.1.jar
            plugins/WonderfulCoreLibrary-0.1.0.jar
            plugins/WhatAWonderfulChicken-2.1.1.jar
            plugins/WhatAWonderfulWolf-1.1.2.jar
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify packaged dependency blobs and build separate listener
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C server-snapshot rev-parse HEAD)" = '79e4afdbc530c9f8151c44bb390d06f7ff8fcf6e'
          declare -A hashes=(
            [WonderfulGenomeLib-1.0.1.jar]='09acaf08b42cad7343de92de262518da2edec3f1'
            [WonderfulCoreLibrary-0.1.0.jar]='64ab60fc7f8b2ef07c4712d410c3f4d10f022698'
            [WhatAWonderfulChicken-2.1.1.jar]='77831eafab4d0fa55ae76d03e4249f69f472d1cf'
            [WhatAWonderfulWolf-1.1.2.jar]='27c137123ef99c2c11867e957671a65ac6170db8'
          )
          for jar in "${!hashes[@]}"; do
            file="server-snapshot/plugins/$jar"
            test "$(git hash-object "$file")" = "${hashes[$jar]}"
            unzip -tqq "$file"
          done
          gradle --no-daemon test :admission-guard:test jar :admission-guard:jar
          gradle --no-daemon -p tests/paper-wcl-services-probe jar
          python3 tools/simplecoins_preflight.py admission-guard/build/libs/admission-guard-1.0.0.jar build/libs/SimpleCoins-1.0.0.jar
          unzip -p tests/paper-wcl-services-probe/build/libs/SimpleCoinsWclServicesProbe.jar plugin.yml |
            grep -F 'name: SimpleCoinsWclServicesProbe'
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fq 'WclServicesProbe.class'; then
            echo 'Test-only WCL probe included in production JAR' >&2
            exit 1
          fi
          echo 'A05_REAL_PAPER_DEPENDENCY_BLOBS_VERIFIED'
      - name: Require real packaged provider IDs in optional softdepend list
        shell: bash
        run: |
          set -euo pipefail
          for jar in WonderfulCoreLibrary-0.1.0.jar WhatAWonderfulChicken-2.1.1.jar WhatAWonderfulWolf-1.1.2.jar; do
            path="server-snapshot/plugins/$jar"
            actual=$(unzip -p "$path" plugin.yml | awk '$1 == "name:" {print $2; exit}' | tr -d "'\"\r")
            if [[ ! "$actual" =~ ^[A-Za-z][A-Za-z0-9_-]*$ ]]; then
              echo "Unrecognized actual packaged Paper plugin name: $jar -> $actual" >&2
              exit 1
            fi
            if ! grep -Fxq "  - $actual" src/main/resources/plugin.yml; then
              echo "A05_RED_SOFTDEPEND_NAME_MISMATCH packaged=$jar pluginName=$actual" >&2
              exit 1
            fi
            unzip -p build/libs/SimpleCoins-1.0.0.jar plugin.yml |
              grep -Fx "  - $actual"
            echo "PAPER_A05_REAL_SOFTDEPEND_NAME_PASSED name=$actual"
          done
      - name: Download hash-verified official Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-A05-Probe/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' -o smoke/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke/paper.jar
          printf '%s  %s\n' "$sha" smoke/paper.jar | sha256sum -c -
      - name: Boot independent default-deny Paper with all four distributed dependency plugins
        shell: bash
        run: |
          set -euo pipefail
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke/plugins/SimpleCoins.jar
          cp server-snapshot/plugins/WonderfulGenomeLib-1.0.1.jar smoke/plugins/WonderfulGenomeLib.jar
          cp server-snapshot/plugins/WonderfulCoreLibrary-0.1.0.jar smoke/plugins/WonderfulCoreLibrary.jar
          cp server-snapshot/plugins/WhatAWonderfulChicken-2.1.1.jar smoke/plugins/WhatAWonderfulChicken.jar
          cp server-snapshot/plugins/WhatAWonderfulWolf-1.1.2.jar smoke/plugins/WhatAWonderfulWolf.jar
          cp tests/paper-wcl-services-probe/build/libs/SimpleCoinsWclServicesProbe.jar smoke/plugins/StorageProbe.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25595\n' > smoke/server.properties
          cd smoke
          set +e
          timeout --signal=TERM --kill-after=5s 180s \
            java -Xms256M -Xmx1024M -jar paper.jar nogui </dev/null > paper-a05.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Paper storage provider smoke exit $status" >&2
            tail -160 paper-a05.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a05.log
          grep -F 'SIMPLECOINS_WCL_REGISTRATION_OBSERVED status=PRESENT reason=two-registration-sources-present' paper-a05.log
          grep -F 'PAPER_A05_BOTH_PACKAGED_STORAGE_SERVICES_REGISTERED_PASSED' paper-a05.log
          grep -F 'PAPER_A05_BOTH_PACKAGED_STORAGE_READERS_EMPTY_ENTITY_PASSED' paper-a05.log
          grep -F 'PAPER_A05_WWC_LIVE_STORED_SHULKER_COIN_PASSED' paper-a05.log
          grep -F 'PAPER_A05_PRODUCT_LOADED_WWC_SOURCE_PROOF_PASSED' paper-a05.log
          grep -F 'PAPER_A05_PRODUCT_LOADED_WWC_SHULKER_VALUE_10000_PASSED' paper-a05.log
          grep -F 'PAPER_A05_PRODUCT_WCL_VALUE_ZERO_AND_MALFORMED_REJECTION_PASSED' paper-a05.log
          grep -F 'PAPER_A05_PRODUCT_CROSS_WCL_CLONED_WALLET_REJECTED_PASSED' paper-a05.log
          grep -F 'PAPER_A05_WWW_STORED_OWNER_COMMANDER_CURRENCY_PASSED' paper-a05.log
          grep -F 'PAPER_A05_BOTH_STORED_SCHEMA_FAILURES_FAIL_CLOSED_PASSED' paper-a05.log
          grep -F 'PAPER_A05_PRODUCT_STORED_FAILURES_NOT_ADOPTED_PASSED' paper-a05.log
          if grep -Fq 'PAPER_A05_SERVICES_PROBE_FAILED' paper-a05.log; then exit 1; fi
          echo 'PAPER_A05_PINNED_MULTI_PROVIDER_REAL_PAPER_PASSED'
      - name: Verify world saved real WWC entity persists across a second Paper process
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          for phase in persist reload; do
            set +e
            timeout --signal=TERM --kill-after=5s 180s \
              java -Da05.probe.phase="$phase" -Xms256M -Xmx1024M -jar paper.jar nogui \
              </dev/null > "paper-a05-$phase.log" 2>&1
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "Paper A05 persisted entity phase=$phase exit=$status" >&2
              tail -180 "paper-a05-$phase.log"
              exit 1
            fi
            grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' "paper-a05-$phase.log"
            grep -F 'SIMPLECOINS_WCL_REGISTRATION_OBSERVED status=PRESENT reason=two-registration-sources-present' "paper-a05-$phase.log"
            grep -F 'PAPER_A05_BOTH_PACKAGED_STORAGE_READERS_EMPTY_ENTITY_PASSED' "paper-a05-$phase.log"
            grep -F 'PAPER_A05_WWC_LIVE_STORED_SHULKER_COIN_PASSED' "paper-a05-$phase.log"
            grep -F 'PAPER_A05_PRODUCT_LOADED_WWC_SOURCE_PROOF_PASSED' "paper-a05-$phase.log"
            grep -F 'PAPER_A05_PRODUCT_LOADED_WWC_SHULKER_VALUE_10000_PASSED' "paper-a05-$phase.log"
            grep -F 'PAPER_A05_PRODUCT_WCL_VALUE_ZERO_AND_MALFORMED_REJECTION_PASSED' "paper-a05-$phase.log"
            grep -F 'PAPER_A05_PRODUCT_CROSS_WCL_CLONED_WALLET_REJECTED_PASSED' "paper-a05-$phase.log"
            grep -F 'PAPER_A05_WWW_STORED_OWNER_COMMANDER_CURRENCY_PASSED' "paper-a05-$phase.log"
            grep -F 'PAPER_A05_PRODUCT_STORED_FAILURES_NOT_ADOPTED_PASSED' "paper-a05-$phase.log"
            if grep -Fq 'PAPER_A05_SERVICES_PROBE_FAILED' "paper-a05-$phase.log"; then
              tail -180 "paper-a05-$phase.log"
              exit 1
            fi
            case "$phase" in
              persist)
                grep -F 'PAPER_A05_WWC_ENTITY_PERSISTED_BEFORE_RESTART_PASSED' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_WWW_ENTITY_PERSISTED_BEFORE_RESTART_PASSED' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_FAR_TWO_STORED_PROVIDER_FIXTURES_SAVED_PASSED' "paper-a05-$phase.log"
                if ! find world -type f -path '*/entities/r.0.0.mca' -size +0c | grep -q .; then
                  echo 'Actual Paper Entity Anvil region file was not created' >&2
                  find world -name '*.mca' -print
                  exit 1
                fi
                if ! find world -type f -path '*/entities/r.1.1.mca' -size +0c | grep -q .; then
                  echo 'Far unloaded saved Entity Anvil source missing' >&2
                  find world -name '*.mca' -print
                  exit 1
                fi
                # The first Paper JVM is fully stopped. Inspect its actual
                # Entity Anvil file with our EXISTING production read-only
                # Anvil parser in a standalone non-Bukkit Java process.
                # This must not load chunks or reconstruct an Entity via Paper.
                java -cp "../tests/paper-wcl-services-probe/build/libs/SimpleCoinsWclServicesProbe.jar:../build/libs/SimpleCoins-1.0.0.jar" \
                  co.surumene.simplecoins.a05probe.OfflineEntityRegionProbe \
                  "world/dimensions/minecraft/overworld/entities/r.0.0.mca" \
                  "plugins/SimpleCoinsWclServicesProbe/wwc-physical-entity-uuid.txt" \
                  "plugins/SimpleCoinsWclServicesProbe/wwc-shulker-coins.b64" \
                  "plugins/SimpleCoinsWclServicesProbe/www-physical-entity-uuid.txt" \
                  "plugins/SimpleCoinsWclServicesProbe/www-runtime-state.b64" \
                  | tee paper-a05-offline-mca.log
                grep -F 'PAPER_A05_OFFLINE_MCA_WWC_MONEY_PHYSICAL_SOURCE_PASSED' paper-a05-offline-mca.log
                grep -F 'PAPER_A05_OFFLINE_MCA_WWW_MONEY_OWNER_PHYSICAL_SOURCE_PASSED' paper-a05-offline-mca.log
                grep -F 'PAPER_A05_OFFLINE_MCA_TWO_PROVIDERS_DISTINCT_SOURCES_PASSED' paper-a05-offline-mca.log
                grep -F 'PAPER_A05_OFFLINE_MCA_SCAN_NO_CHUNK_LOAD_PASSED' paper-a05-offline-mca.log ;;
              reload)
                grep -F 'PAPER_A05_WWC_REAL_ENTITY_RELOAD_COIN_SHULKER_PASSED' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_WWW_REAL_ENTITY_RELOAD_OWNER_CURRENCY_PASSED' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_PRODUCT_STORED_WWC_WWW_SOURCE_PROOF_PASSED' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_PRODUCT_SAVED_WWC_SHULKER_VALUE_10000_PASSED' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_PRODUCT_SAVED_WWW_WEAPON_CARGO_VALUE_15000_PASSED' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_PRODUCT_SAVED_ANVIL_PDC_RECONSTRUCTION_PASSED provider=wwc' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_PRODUCT_SAVED_ANVIL_PDC_RECONSTRUCTION_PASSED provider=www' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_PRODUCT_DISCOVERED_SAVED_WCL_CANDIDATES_25000_PASSED' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_SAVED_WCL_SLOT_ALIASES_MAPPED_PASSED' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_REAL_WWC_THREE_SLOTS_HEAD_ALIAS_PASSED total=15000' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_WWC_DISPLAY_PROXY_COLLISION_PASSED value=10000' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_PRODUCT_SAVED_WCL_DUPLICATE_ENTITY_REJECTED_PASSED' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_PRODUCT_SAVED_WCL_UNKNOWN_OR_CONTRADICTORY_REJECTED_PASSED' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_PRODUCT_SYNTHETIC_CURRENT_PDC_SCHEMA_PASSED provider=wwc' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_PRODUCT_SYNTHETIC_CURRENT_PDC_SCHEMA_PASSED provider=www' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_UNLOADED_WWC_WWW_SAVED_NBT_TO_REAL_WCL_PASSED' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_VERIFIED_SAVED_TRAVERSAL_TWO_WCL_PROVIDERS_PASSED' "paper-a05-$phase.log"
                grep -F 'PAPER_A05_REAL_PAPER_WORLDFOLDER_DISCOVERY_CLOSURE_PASSED' "paper-a05-$phase.log" ;;
            esac
          done
          echo 'PAPER_A05_REAL_SAVED_ENTITY_CURRENCY_CROSS_RESTART_PASSED'
      - name: Upload integration diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-a05-multi-provider-log
          path: smoke/*.log
          if-no-files-found: ignore
          retention-days: 7
