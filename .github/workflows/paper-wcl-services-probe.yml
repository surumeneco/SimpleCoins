            esac
          done
          echo 'PAPER_A05_REAL_SAVED_ENTITY_CURRENCY_CROSS_RESTART_PASSED'
      - name: Verify same real Paper saved generation with distributed BlockLocker, WWC and WWW
        shell: bash
        run: |
          set -euo pipefail
          # A second *independent* world; never mutate the old three-phase
          # WCL fixture and never call the source scan against a live server.
          mkdir -p smoke-blocklocker/plugins
          cp smoke/paper.jar smoke-blocklocker/paper.jar
          for jar in SimpleCoinsGuard.jar SimpleCoins.jar WonderfulGenomeLib.jar \
              WonderfulCoreLibrary.jar WhatAWonderfulChicken.jar \
              WhatAWonderfulWolf.jar StorageProbe.jar; do
            cp "smoke/plugins/$jar" "smoke-blocklocker/plugins/$jar"
          done
          curl -fLsS --retry 3 \
            'https://github.com/rutgerkok/BlockLocker/releases/download/v1.15/blocklocker-1.15.jar' \
            -o smoke-blocklocker/plugins/blocklocker-1.15.jar
          echo '8e21655ce029c2fe17b62568b2fefbe24e90b98543dfe54990777529edc0b962  smoke-blocklocker/plugins/blocklocker-1.15.jar' | sha256sum -c -
          printf 'eula=true\n' > smoke-blocklocker/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25596\n' \
            > smoke-blocklocker/server.properties
          # This is the independent BlockLocker+WCL world ONLY. The old
          # 55,000C fixture remains without a synthetic BANNED account.
          # Persist genuine Paper profile and IP ban lists before both JVMs.
          cat > smoke-blocklocker/banned-players.json <<'BANNED_PROFILE'
          [
            {
              "uuid": "00000000-0000-0000-0000-00000000a053",
              "name": "A06WolfCommander",
              "created": "2026-11-14 00:00:00 +0000",
              "source": "SimpleCoins isolated A06 Paper fixture",
              "expires": "forever",
              "reason": "Real Paper profile BAN evidence in unpublished saved candidate"
            }
          ]
          BANNED_PROFILE
          cat > smoke-blocklocker/banned-ips.json <<'BANNED_IP'
          [
            {
              "ip": "203.0.113.42",
              "created": "2026-11-14 00:00:00 +0000",
              "source": "SimpleCoins isolated A06 Paper fixture",
              "expires": "forever",
              "reason": "IP-only BAN with no authenticated UUID association"
            }
          ]
          BANNED_IP
          cd smoke-blocklocker
          for phase in persist reload-saved reload; do
            set +e
            timeout --signal=TERM --kill-after=5s 180s \
              java -Da05.probe.phase="$phase" -Da05.probe.blocklocker=true \
                -Xms256M -Xmx1024M -jar paper.jar nogui \
              </dev/null > "paper-a04-a05-$phase.log" 2>&1
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "Combined BlockLocker/WCL Paper phase=$phase exit=$status" >&2
              tail -180 "paper-a04-a05-$phase.log"
              exit 1
            fi
            grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' \
              "paper-a04-a05-$phase.log"
            grep -F 'SIMPLECOINS_WCL_REGISTRATION_OBSERVED status=PRESENT reason=two-registration-sources-present' \
              "paper-a04-a05-$phase.log"
            grep -F 'PAPER_A05_BOTH_PACKAGED_STORAGE_SERVICES_REGISTERED_PASSED' \
              "paper-a04-a05-$phase.log"
            if grep -Fq 'PAPER_A05_SERVICES_PROBE_FAILED' "paper-a04-a05-$phase.log"; then
              tail -180 "paper-a04-a05-$phase.log"
              exit 1
            fi
            if [ "$phase" = persist ]; then
              grep -F 'PAPER_A04_A05_REAL_BLOCKLOCKER_BOTH_PHYSICAL_SIGNS_SEEDED_PASSED' \
                "paper-a04-a05-$phase.log"
              test -s world/dimensions/minecraft/overworld/region/r.1.1.mca
              test -s world/dimensions/minecraft/overworld/entities/r.1.1.mca
              for uuid in 00000000-0000-0000-0000-00000000a055 00000000-0000-0000-0000-00000000a053; do
                test -s "world/players/data/${uuid}.dat"
                grep -F 'PAPER_A06_ACTUAL_PAPER_OFFLINE_OWNERDATA_SAVED_PASSED id=' "paper-a04-a05-$phase.log" | grep -F "$uuid"
              done
            elif [ "$phase" = reload-saved ]; then
              grep -F 'PAPER_A05_REAL_PAPER_WORLDFOLDER_DISCOVERY_CLOSURE_PASSED' \
                "paper-a04-a05-$phase.log"
              grep -F 'PAPER_A05_UNLOADED_WWC_WWW_SAVED_NBT_TO_REAL_WCL_PASSED' \
                "paper-a04-a05-$phase.log"
              grep -F 'PAPER_A06_REAL_PROFILE_BANNED_AND_CLEAR_OWNERS_PASSED' \
                "paper-a04-a05-$phase.log"
              grep -F 'PAPER_A06_REAL_IP_BAN_UNKNOWN_UUID_MAPPING_HOLD_PASSED' \
                "paper-a04-a05-$phase.log"
              grep -F 'PAPER_A06_REAL_PLAYERDATA_BAN_P25000_D30000_F1000_PASSED' \
                "paper-a04-a05-$phase.log"
              grep -F 'PAPER_A04_A05_REAL_BLOCKLOCKER_WCL_FULL_SAVED_56000_PRIVATE_PERSONAL_EVERYONE_FREE_PASSED' \
                "paper-a04-a05-$phase.log"
              grep -F 'PAPER_A05_FULL_HYBRID_MISSING_OWNER_BAN_REJECTED_PASSED' \
                "paper-a04-a05-$phase.log"
              grep -F 'PAPER_A04_A05_UNKNOWN_CHEST_PROOF_FAIL_CLOSED_PASSED' \
                "paper-a04-a05-$phase.log"
            else
              grep -F 'PAPER_A05_WWC_REAL_ENTITY_RELOAD_COIN_SHULKER_PASSED' \
                "paper-a04-a05-$phase.log"
              grep -F 'PAPER_A05_WWW_REAL_ENTITY_RELOAD_OWNER_CURRENCY_PASSED' \
                "paper-a04-a05-$phase.log"
            fi
          done
          echo 'PAPER_A04_A05_REAL_DISTRIBUTED_BLOCKLOCKER_WCL_SAVED_GENERATION_PASSED'
      - name: Upload integration diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-a05-multi-provider-log
          path: |
            smoke/*.log
            smoke-blocklocker/*.log
            smoke-pdc-negative/*.log
            smoke-equipment-negative/*.log
            smoke-inventory-negative/*.log
            smoke-live-owner/*.log
          if-no-files-found: ignore
          retention-days: 7
