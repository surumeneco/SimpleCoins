name: One-shot A04 scoped test patch application
on:
  push:
    branches: [feature/a04-saved-owner-pd-regression-20261121]
    paths: ['.github/workflows/a04-apply-scoped-patch-temp.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'chore(infra): stage scoped A04 test patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify baseline and apply exact reviewed patch to test-only path
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "006279c8e30e4241909fe396c4122a3a609a68cc"
          test "$(git rev-parse 'HEAD^:src/test/java/co/surumene/simplecoins/domain/SavedBlockLockerTerrainObservationsTest.java')" = "95977efe93bfe10bbcc9db72dd78f88a9c5e0896"
          cat >/tmp/patch.b64 <<'B64'
          
          B64
          base64 -d /tmp/patch.b64 | gzip -d >/tmp/a04.patch
          echo '4f7747d7d96698c162b340cfe405c1dd799ce8a539a51cbbda0132967aea879f  /tmp/a04.patch' | sha256sum -c -
          git apply --check /tmp/a04.patch
          git apply /tmp/a04.patch
          git diff --check
          test "$(git diff --name-only)" = 'src/test/java/co/surumene/simplecoins/domain/SavedBlockLockerTerrainObservationsTest.java'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/test/java/co/surumene/simplecoins/domain/SavedBlockLockerTerrainObservationsTest.java
          git commit -m 'test(a04): verify saved private chest P/D by BAN and playerdata'
          git push origin HEAD:refs/heads/feature/a04-saved-owner-pd-regression-20261121
