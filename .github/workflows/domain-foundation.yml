name: Domain foundation
on:
  push:
    branches: [develop, "feature/integrate-pack-url-validation-**"]
  pull_request:
    branches: [develop]
jobs:
  pure-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Test isolated URL validation domain
        run: gradle --no-daemon clean test jar
