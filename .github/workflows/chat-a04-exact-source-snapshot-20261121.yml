name: Chat isolated exact SimpleCoins source snapshot 20261121
on:
  push:
    branches: [infra/chat-a04-source-snapshot-20261121]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1d6c7f546200458b8a916eb09d27390e25793c46
          persist-credentials: false
      - name: Verify pinned HEAD and archive without project execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1d6c7f546200458b8a916eb09d27390e25793c46"
          git archive --format=tar --prefix=project/ HEAD | gzip -9 > project-source.tar.gz
          python3 - <<'PY'
          import hashlib,json,subprocess
          data=open('project-source.tar.gz','rb').read()
          d={'repository':'surumeneco/SimpleCoins',
             'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
             'archive_sha256':hashlib.sha256(data).hexdigest(),
             'archive_bytes':len(data)}
          open('snapshot-manifest.json','w').write(json.dumps(d,indent=2)+'\n')
          print(d)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chat-a04-pinned-simplecoins-source
          path: |
            project-source.tar.gz
            snapshot-manifest.json
          retention-days: 2
          if-no-files-found: error
