name: Paper 26.2 disposable playerdata save and reload probe
on:
  pull_request:
    branches: [develop]
    paths:
      - 'tests/paper-grant-save-probe/**'
      - '.github/workflows/paper-grant-save-commit-probe.yml'
      - 'Lifecycle/Works/simplecoins.a02.paper-save-commit-verification.md'
      - 'Lifecycle/Works/simplecoins.a02.after-ack-crash-replay-verification.md'
      - 'Lifecycle/Works/simplecoins.a02.paper-real-plan-save-readback.md'
      - 'Lifecycle/Works/simplecoins.a02.real-paper-protected-saved-stages.md'
      - 'Lifecycle/Works/simplecoins.a02.final-partial-protected-ack.md'
      - 'Lifecycle/Works/simplecoins.a02.paper-saved-batch-product-coordinator.md'
      - 'Lifecycle/Works/simplecoins.a02.paper-main-worker-saved-commit.md'
      - 'Lifecycle/Works/simplecoins.a02.queued-amount-delivery.md'
      - 'Lifecycle/Works/simplecoins.a02.bounded-saved-commit-worker.md'
      - 'Lifecycle/Works/simplecoins.a02.protected-off-main-preflight.md'
      - 'src/main/java/co/surumene/simplecoins/domain/WriterEpochFence.java'
      - 'src/main/java/co/surumene/simplecoins/paper/SavedGrantReceiptNbt.java'
      - 'src/test/java/co/surumene/simplecoins/domain/ProtectedGrantPreflight*.java'
      - 'src/main/java/co/surumene/simplecoins/paper/SavedGrantCommitWorker.java'
      - 'src/test/java/co/surumene/simplecoins/paper/SavedGrantCommitWorker*.java'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperGrantSavedBatchCoordinator.java'
      - 'src/main/java/co/surumene/simplecoins/paper/SavedGrantProtectedAckStage.java'
      - 'src/test/java/co/surumene/simplecoins/paper/SavedGrantProtectedAckStageTest.java'
      - 'Lifecycle/Works/simplecoins.a02.paper-partial-receipt-restart.md'
      - 'Lifecycle/Works/simplecoins.a02.paper-final-save-pre-ack-crash.md'
      - 'Lifecycle/Works/simplecoins.a02.paper-before-save-sigkill-recovery.md'
      - 'Lifecycle/Works/simplecoins.a01.real-paper-shared-playerdata-omission.md'
      - 'src/main/java/co/surumene/simplecoins/domain/GrantLedger.java'
      - 'src/main/java/co/surumene/simplecoins/domain/GrantReceiptState.java'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperGrantInventorySlotPlan.java'

jobs:
  real-paper-playerdata:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: d42557a7b8318925f172b401d4e2bf55c4d230c7
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate the new verification-only Work contract
        run: |
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.after-ack-crash-replay-verification.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.paper-real-plan-save-readback.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.real-paper-protected-saved-stages.md
          work=Lifecycle/Works/simplecoins.a02.final-partial-protected-ack.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate --work "$work"
          work=Lifecycle/Works/simplecoins.a02.paper-saved-batch-product-coordinator.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          work=Lifecycle/Works/simplecoins.a02.paper-main-worker-saved-commit.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          work=Lifecycle/Works/simplecoins.a02.bounded-saved-commit-worker.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          work=Lifecycle/Works/simplecoins.a02.protected-off-main-preflight.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py compile --kind vectors --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py compile --kind queue --work "$work"
          cache=Lifecycle/Works/.cat-flow/cache/a02-protected-preflight
          out=Lifecycle/Works/.cat-flow/generated/A02ProtectedPreflightDecisionGeneratedTest.java
          mkdir -p "$(dirname "$out")"
          python cat-tdd-fixed/.cat-system/scripts/cat_compile_v2.py tests "$cache-model.json" "$cache-vectors.json" tests/cat/a02-grant-delivery-junit-binding.json --queue "$cache-queue.json" --framework junit --process docs/cat/confirmed/a02-grant-delivery-process.md --pi docs/cat/confirmed/a02-grant-delivery-pi.md --tce docs/cat/confirmed/a02-grant-delivery-tce.md -o "$out"
          grep -F 'CAPABILITIES NOT VERIFIED' "$out"
          generated=$(sed -n 's/^final class \([^ ]*\) .*/\1/p' "$out")
          test -n "$generated"
          mkdir -p src/test/java/co/surumene/simplecoins/domain/generated
          cp "$out" "src/test/java/co/surumene/simplecoins/domain/generated/$generated.java"
          work=Lifecycle/Works/simplecoins.a02.queued-amount-delivery.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          work=Lifecycle/Works/simplecoins.a02.final-partial-protected-ack.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.paper-partial-receipt-restart.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.paper-final-save-pre-ack-crash.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.paper-before-save-sigkill-recovery.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a01.real-paper-shared-playerdata-omission.md
      - name: Build production guard and isolated probe
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon test :admission-guard:test jar :admission-guard:jar
          gradle --no-daemon -p tests/paper-grant-save-probe jar
          python3 tools/simplecoins_preflight.py admission-guard/build/libs/admission-guard-1.0.0.jar build/libs/SimpleCoins-1.0.0.jar
          unzip -p tests/paper-grant-save-probe/build/libs/SimpleCoinsPaperSaveProbe.jar plugin.yml |
            grep -F 'name: SimpleCoinsPaperSaveProbe'
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fq 'PaperSaveProbe.class'; then
            echo 'Disposable probe incorrectly packaged in SimpleCoins product JAR' >&2
            exit 1
          fi
      - name: Download and hash-verify official Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-A02-Probe/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' -o smoke/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) echo "Unexpected Paper URL" >&2; exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke/paper.jar
          printf '%s  %s\n' "$sha" smoke/paper.jar | sha256sum -c -
      - name: Install only disposable Paper plugins
        shell: bash
        run: |
          set -euo pipefail
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke/plugins/SimpleCoins.jar
          cp tests/paper-grant-save-probe/build/libs/SimpleCoinsPaperSaveProbe.jar smoke/plugins/SaveProbe.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25598\n' > smoke/server.properties
      - name: Save, inject a failed write, then SIGKILL before journal acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          java -Da02.probe.phase=save -Da02.probe.awaitSigkill=true \
            -Xms256M -Xmx1024M -jar paper.jar nogui \
            </dev/null > paper-a02-save.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill -KILL "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          crash_ready=0
          for _ in $(seq 1 180); do
            if grep -Fq 'PAPER_A02_PROBE_FAILED' paper-a02-save.log; then
              tail -150 paper-a02-save.log
              exit 1
            fi
            if grep -Fq 'PAPER_A02_UNACKED_CRASH_POINT_READY' paper-a02-save.log; then
              crash_ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Paper exited before crash injection' >&2
              tail -150 paper-a02-save.log
              exit 1
            fi
            sleep 1
          done
          if [ "$crash_ready" != 1 ]; then
            echo 'Timed out waiting for confirmed physical-save/ledger-pending boundary' >&2
            tail -150 paper-a02-save.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-save.log
          grep -F 'PAPER_A02_FULL_INVENTORY_NO_DELIVERY_PASSED' paper-a02-save.log
          grep -F 'PAPER_A02_SAVE_DISABLED_VOID_RETURN_PASSED' paper-a02-save.log
          grep -F 'PAPER_A02_REAL_SAVE_INVENTORY_RECEIPT_PAIR_PASSED' paper-a02-save.log
          grep -F 'PAPER_A02_REAL_COIN_RECEIPT_UNACKED_PASSED' paper-a02-save.log
          grep -F 'PAPER_A02_STALE_DISK_AFTER_VOID_SAVE_PASSED' paper-a02-save.log
          grep -F 'PAPER_A02_SAVE_EXCEPTION_SWALLOWED_NO_ACK_PASSED' paper-a02-save.log
          test -f world/players/data/00000000-0000-0000-0000-00000000a002.dat
          if grep -Fq 'Saving worlds' paper-a02-save.log; then
            echo 'Paper entered clean shutdown before SIGKILL' >&2
            exit 1
          fi
          kill -KILL "$server_pid"
          set +e
          wait "$server_pid"
          status=$?
          set -e
          trap - EXIT
          if [ "$status" -ne 137 ]; then
            echo "Expected signal 9 process termination (137), found $status" >&2
            exit 1
          fi
          echo 'PAPER_A02_SAVE_BEFORE_ACK_SIGKILL_INJECTED'
      - name: Restart Paper, recover pending grant, then SIGKILL immediately after durable ACK
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          java -Da02.probe.phase=reload -Da02.probe.awaitSigkill=true \
            -Xms256M -Xmx1024M -jar paper.jar nogui \
            </dev/null > paper-a02-reload.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill -KILL "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 180); do
            if grep -Fq 'PAPER_A02_PROBE_FAILED' paper-a02-reload.log; then
              tail -160 paper-a02-reload.log
              exit 1
            fi
            if grep -Fq 'PAPER_A02_ACKED_CRASH_POINT_READY' paper-a02-reload.log; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Paper process B exited before post-ACK SIGKILL injection' >&2
              tail -160 paper-a02-reload.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo 'Timed out waiting for durable ACK crash point' >&2
            tail -160 paper-a02-reload.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-reload.log
          grep -F 'PAPER_A02_RESTART_REAL_LOAD_PAIR_PASSED' paper-a02-reload.log
          grep -F 'PAPER_A02_EXISTING_STORAGE_RESTART_PRESERVED_PASSED' paper-a02-reload.log
          grep -F 'PAPER_A02_RESTART_RECOVER_ACK_PASSED' paper-a02-reload.log
          if grep -Fq 'Saving worlds' paper-a02-reload.log; then
            echo 'Paper B entered normal shutdown before forced crash' >&2
            exit 1
          fi
          kill -KILL "$server_pid"
          set +e
          wait "$server_pid"
          status=$?
          set -e
          trap - EXIT
          if [ "$status" -ne 137 ]; then
            echo "Expected process B signal-9 exit 137, got $status" >&2
            exit 1
          fi
          echo 'PAPER_A02_ACK_BEFORE_SECOND_SIGKILL_INJECTED'
      - name: Third independent Paper boot proves completed ACK never reissues physical currency
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          set +e
          timeout --signal=TERM --kill-after=10s 200s \
            java -Da02.probe.phase=acked-reload -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-acked-reload.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Third Paper process failed (exit=$status)" >&2
            tail -160 paper-a02-acked-reload.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-acked-reload.log
          grep -F 'PAPER_A02_THIRD_BOOT_DURABLE_ACK_NO_PENDING_PASSED' paper-a02-acked-reload.log
          grep -F 'PAPER_A02_THIRD_BOOT_COIN_RECEIPT_STORAGE_PASSED' paper-a02-acked-reload.log
          grep -F 'PAPER_A01_REAL_PLAYERDATA_DISCOVERY_BOUNDARY_OBSERVED' paper-a02-acked-reload.log
          grep -F 'PAPER_A01_REAL_SHARED_PLAYERDATA_INCLUDED_IN_MANIFEST' paper-a02-acked-reload.log
          grep -F 'PAPER_A02_THIRD_BOOT_REPEATED_ACK_IDEMPOTENT_PASSED' paper-a02-acked-reload.log
          if grep -Fq 'PAPER_A02_PROBE_FAILED' paper-a02-acked-reload.log; then exit 1; fi
          echo 'PAPER_A02_SAVE_CRASH_ACK_CRASH_THIRD_BOOT_NO_REISSUE_PASSED'
      - name: Actual Paper amount and ordered reservations through product worker ACK
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for case in queued amount; do
            root="smoke-product-${case}"
            cp -a smoke "$root" || exit 1
            (
              cd "$root" || exit 1
              timeout --signal=TERM --kill-after=10s 200s \
                java "-Da02.probe.phase=product-${case}-commit" -Xms256M -Xmx1024M \
                  -jar paper.jar nogui </dev/null > "paper-a02-${case}-commit.log" 2>&1
              status=$?
              if [ "$status" -ne 0 ]; then
                tail -180 "paper-a02-${case}-commit.log"
                exit 1
              fi
              if [ "$case" = queued ]; then
                grep -F 'PAPER_A02_PRODUCT_ORDERED_GRANT_ACK_PASSED seq=2 newValue=5000 physical=10000 pending=1' "paper-a02-${case}-commit.log" || exit 1
                grep -F 'PAPER_A02_PRODUCT_ORDERED_SAME_FENCE_RESUMED_PASSED' "paper-a02-${case}-commit.log" || exit 1
                expected='total=15200 grants=3 pending=0'
              else
                expected='total=10200 grants=2 pending=0'
              fi
              grep -F "PAPER_A02_PRODUCT_ORDERED_GRANTS_COMPLETE_PASSED $expected" "paper-a02-${case}-commit.log" || exit 1
              if grep -Fq 'PAPER_A02_PROBE_FAILED' "paper-a02-${case}-commit.log"; then exit 1; fi
              timeout --signal=TERM --kill-after=10s 200s \
                java "-Da02.probe.phase=product-${case}-reload" -Xms256M -Xmx1024M \
                  -jar paper.jar nogui </dev/null > "paper-a02-${case}-reload.log" 2>&1 || exit 1
              grep -F "PAPER_A02_PRODUCT_ORDERED_GRANTS_COLD_RESTART_PASSED $expected" "paper-a02-${case}-reload.log" || exit 1
              if grep -Fq 'PAPER_A02_PROBE_FAILED' "paper-a02-${case}-reload.log"; then exit 1; fi
            ) || { tail -140 "$root/paper-a02-${case}-commit.log"; failed=1; }
          done
          exit "$failed"
      - name: Alternate Paper JVM hands off product saved ACK from main to worker
        shell: bash
        run: |
          set -euo pipefail
          cp -a smoke smoke-product-async
          cd smoke-product-async
          set +e
          timeout --signal=TERM --kill-after=10s 200s \
            java -Da02.probe.phase=product-async-commit -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-async-commit.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Product async real Paper stage failed (exit=$status)" >&2
            tail -180 paper-a02-async-commit.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-async-commit.log
          grep -F 'PAPER_A02_PRODUCT_PROTECTED_OFF_MAIN_PREFLIGHT_PASSED' paper-a02-async-commit.log
          grep -F 'PAPER_A02_PRODUCT_ASYNC_MAIN_SAVED_BUT_PENDING_PASSED' paper-a02-async-commit.log
          grep -F 'PAPER_A02_PRODUCT_ASYNC_WORKER_FRESH_ACK_PASSED physical=10000 grants=2 pending=0 worker=product-owned' paper-a02-async-commit.log
          grep -F 'PAPER_A02_PRODUCT_ASYNC_REPEATED_FINISH_DENIED_PASSED' paper-a02-async-commit.log
          if grep -Fq 'PAPER_A02_PROBE_FAILED' paper-a02-async-commit.log; then exit 1; fi
          echo 'PAPER_A02_PRODUCT_MAIN_WORKER_REAL_SAVED_ACK_PASSED'
      - name: Independent Paper reboot verifies off-main ACK survived without reissue
        shell: bash
        run: |
          set -euo pipefail
          cd smoke-product-async
          set +e
          timeout --signal=TERM --kill-after=10s 200s \
            java -Da02.probe.phase=product-coordinator-acked-reload -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-async-reload.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Product off-main ACK cold reboot failed (exit=$status)" >&2
            tail -180 paper-a02-async-reload.log
            exit 1
          fi
          grep -F 'PAPER_A02_PRODUCT_COORDINATOR_REBOOT_NO_REISSUE_PASSED total=10000 grants=2 pending=0' paper-a02-async-reload.log
          if grep -Fq 'PAPER_A02_PROBE_FAILED' paper-a02-async-reload.log; then exit 1; fi
          echo 'PAPER_A02_PRODUCT_MAIN_WORKER_COLD_RESTART_PASSED'
      - name: Alternate fourth Paper JVM executes real product grant save to protected ACK
        shell: bash
        run: |
          set -euo pipefail
          cp -a smoke smoke-product-coordinator
          cd smoke-product-coordinator
          set +e
          timeout --signal=TERM --kill-after=10s 200s \
            java -Da02.probe.phase=product-coordinator-full -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-product-coordinator.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Product full save and protected ACK failed (exit=$status)" >&2
            tail -200 paper-a02-product-coordinator.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-product-coordinator.log
          grep -F 'PAPER_A02_PRODUCT_COORDINATOR_SAVED_ACK_PASSED physical=10000 completed=2 grants=2 pending=0 TEST_ONLY_FENCE' paper-a02-product-coordinator.log
          if grep -Fq 'PAPER_A02_PROBE_FAILED' paper-a02-product-coordinator.log; then exit 1; fi
          echo 'PAPER_A02_PRODUCT_REAL_SAVED_BATCH_TO_ACK_PASSED'
      - name: Alternate fifth Paper boot verifies independent durable ACK and no double issuance
        shell: bash
        run: |
          set -euo pipefail
          cd smoke-product-coordinator
          set +e
          timeout --signal=TERM --kill-after=10s 200s \
            java -Da02.probe.phase=product-coordinator-acked-reload -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-product-coordinator-reload.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Product coordinator cold restart failed (exit=$status)" >&2
            tail -200 paper-a02-product-coordinator-reload.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-product-coordinator-reload.log
          grep -F 'PAPER_A02_PRODUCT_COORDINATOR_REBOOT_NO_REISSUE_PASSED total=10000 grants=2 pending=0' paper-a02-product-coordinator-reload.log
          if grep -Fq 'PAPER_A02_PROBE_FAILED' paper-a02-product-coordinator-reload.log; then exit 1; fi
          echo 'PAPER_A02_PRODUCT_COORDINATOR_REAL_RESTART_PASSED'
      - name: Fourth Paper process composes real grant plan, saved-file proof and durable ACK
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          set +e
          timeout --signal=TERM --kill-after=10s 190s \
            java -Da02.probe.phase=verified-delivery -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-verified-delivery.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Fourth Paper process failed (exit=$status)" >&2
            tail -160 paper-a02-verified-delivery.log
            exit 1
          fi
