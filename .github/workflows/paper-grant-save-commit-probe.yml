name: Paper 26.2 disposable playerdata save and reload probe
on:
  pull_request:
    branches: [develop]
    paths:
      - 'tests/paper-grant-save-probe/**'
      - '.github/workflows/paper-grant-save-commit-probe.yml'
      - 'Lifecycle/Works/simplecoins.a02.paper-save-commit-verification.md'
      - 'Lifecycle/Works/simplecoins.a02.after-ack-crash-replay-verification.md'
      - 'Lifecycle/Works/simplecoins.a02.paper-real-plan-save-readback.md'
      - 'Lifecycle/Works/simplecoins.a02.paper-partial-receipt-restart.md'
      - 'Lifecycle/Works/simplecoins.a01.real-paper-shared-playerdata-omission.md'

jobs:
  real-paper-playerdata:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate the new verification-only Work contract
        run: |
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.after-ack-crash-replay-verification.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.paper-real-plan-save-readback.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.paper-partial-receipt-restart.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a01.real-paper-shared-playerdata-omission.md
      - name: Build production guard and isolated probe
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon test :admission-guard:test jar :admission-guard:jar
          gradle --no-daemon -p tests/paper-grant-save-probe jar
          python3 tools/simplecoins_preflight.py admission-guard/build/libs/admission-guard-1.0.0.jar build/libs/SimpleCoins-1.0.0.jar
          unzip -p tests/paper-grant-save-probe/build/libs/SimpleCoinsPaperSaveProbe.jar plugin.yml |
            grep -F 'name: SimpleCoinsPaperSaveProbe'
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fq 'PaperSaveProbe.class'; then
            echo 'Disposable probe incorrectly packaged in SimpleCoins product JAR' >&2
            exit 1
          fi
      - name: Download and hash-verify official Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-A02-Probe/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' -o smoke/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) echo "Unexpected Paper URL" >&2; exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke/paper.jar
          printf '%s  %s\n' "$sha" smoke/paper.jar | sha256sum -c -
      - name: Install only disposable Paper plugins
        shell: bash
        run: |
          set -euo pipefail
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke/plugins/SimpleCoins.jar
          cp tests/paper-grant-save-probe/build/libs/SimpleCoinsPaperSaveProbe.jar smoke/plugins/SaveProbe.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25598\n' > smoke/server.properties
      - name: Save, inject a failed write, then SIGKILL before journal acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          java -Da02.probe.phase=save -Da02.probe.awaitSigkill=true \
            -Xms256M -Xmx1024M -jar paper.jar nogui \
            </dev/null > paper-a02-save.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill -KILL "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          crash_ready=0
          for _ in $(seq 1 180); do
            if grep -Fq 'PAPER_A02_PROBE_FAILED' paper-a02-save.log; then
              tail -150 paper-a02-save.log
              exit 1
            fi
            if grep -Fq 'PAPER_A02_UNACKED_CRASH_POINT_READY' paper-a02-save.log; then
              crash_ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Paper exited before crash injection' >&2
              tail -150 paper-a02-save.log
              exit 1
            fi
            sleep 1
          done
          if [ "$crash_ready" != 1 ]; then
            echo 'Timed out waiting for confirmed physical-save/ledger-pending boundary' >&2
            tail -150 paper-a02-save.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-save.log
          grep -F 'PAPER_A02_FULL_INVENTORY_NO_DELIVERY_PASSED' paper-a02-save.log
          grep -F 'PAPER_A02_SAVE_DISABLED_VOID_RETURN_PASSED' paper-a02-save.log
          grep -F 'PAPER_A02_REAL_SAVE_INVENTORY_RECEIPT_PAIR_PASSED' paper-a02-save.log
          grep -F 'PAPER_A02_REAL_COIN_RECEIPT_UNACKED_PASSED' paper-a02-save.log
          grep -F 'PAPER_A02_STALE_DISK_AFTER_VOID_SAVE_PASSED' paper-a02-save.log
          grep -F 'PAPER_A02_SAVE_EXCEPTION_SWALLOWED_NO_ACK_PASSED' paper-a02-save.log
          test -f world/players/data/00000000-0000-0000-0000-00000000a002.dat
          if grep -Fq 'Saving worlds' paper-a02-save.log; then
            echo 'Paper entered clean shutdown before SIGKILL' >&2
            exit 1
          fi
          kill -KILL "$server_pid"
          set +e
          wait "$server_pid"
          status=$?
          set -e
          trap - EXIT
          if [ "$status" -ne 137 ]; then
            echo "Expected signal 9 process termination (137), found $status" >&2
            exit 1
          fi
          echo 'PAPER_A02_SAVE_BEFORE_ACK_SIGKILL_INJECTED'
      - name: Restart Paper, recover pending grant, then SIGKILL immediately after durable ACK
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          java -Da02.probe.phase=reload -Da02.probe.awaitSigkill=true \
            -Xms256M -Xmx1024M -jar paper.jar nogui \
            </dev/null > paper-a02-reload.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill -KILL "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 180); do
            if grep -Fq 'PAPER_A02_PROBE_FAILED' paper-a02-reload.log; then
              tail -160 paper-a02-reload.log
              exit 1
            fi
            if grep -Fq 'PAPER_A02_ACKED_CRASH_POINT_READY' paper-a02-reload.log; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Paper process B exited before post-ACK SIGKILL injection' >&2
              tail -160 paper-a02-reload.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo 'Timed out waiting for durable ACK crash point' >&2
            tail -160 paper-a02-reload.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-reload.log
          grep -F 'PAPER_A02_RESTART_REAL_LOAD_PAIR_PASSED' paper-a02-reload.log
          grep -F 'PAPER_A02_EXISTING_STORAGE_RESTART_PRESERVED_PASSED' paper-a02-reload.log
          grep -F 'PAPER_A02_RESTART_RECOVER_ACK_PASSED' paper-a02-reload.log
          if grep -Fq 'Saving worlds' paper-a02-reload.log; then
            echo 'Paper B entered normal shutdown before forced crash' >&2
            exit 1
          fi
          kill -KILL "$server_pid"
          set +e
          wait "$server_pid"
          status=$?
          set -e
          trap - EXIT
          if [ "$status" -ne 137 ]; then
            echo "Expected process B signal-9 exit 137, got $status" >&2
            exit 1
          fi
          echo 'PAPER_A02_ACK_BEFORE_SECOND_SIGKILL_INJECTED'
      - name: Third independent Paper boot proves completed ACK never reissues physical currency
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          set +e
          timeout --signal=TERM --kill-after=10s 200s \
            java -Da02.probe.phase=acked-reload -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-acked-reload.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Third Paper process failed (exit=$status)" >&2
            tail -160 paper-a02-acked-reload.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-acked-reload.log
          grep -F 'PAPER_A02_THIRD_BOOT_DURABLE_ACK_NO_PENDING_PASSED' paper-a02-acked-reload.log
          grep -F 'PAPER_A02_THIRD_BOOT_COIN_RECEIPT_STORAGE_PASSED' paper-a02-acked-reload.log
          grep -F 'PAPER_A01_REAL_PLAYERDATA_DISCOVERY_BOUNDARY_OBSERVED' paper-a02-acked-reload.log
          grep -F 'PAPER_A01_REAL_SHARED_PLAYERDATA_INCLUDED_IN_MANIFEST' paper-a02-acked-reload.log
          grep -F 'PAPER_A02_THIRD_BOOT_REPEATED_ACK_IDEMPOTENT_PASSED' paper-a02-acked-reload.log
          if grep -Fq 'PAPER_A02_PROBE_FAILED' paper-a02-acked-reload.log; then exit 1; fi
          echo 'PAPER_A02_SAVE_CRASH_ACK_CRASH_THIRD_BOOT_NO_REISSUE_PASSED'
      - name: Fourth Paper process composes real grant plan, saved-file proof and durable ACK
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          set +e
          timeout --signal=TERM --kill-after=10s 190s \
            java -Da02.probe.phase=verified-delivery -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-verified-delivery.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Fourth Paper process failed (exit=$status)" >&2
            tail -160 paper-a02-verified-delivery.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-verified-delivery.log
          grep -F 'PAPER_A02_UNSAVED_PLAN_FILE_READBACK_REJECTED_PASSED' paper-a02-verified-delivery.log
          grep -F 'PAPER_A02_REAL_PLAN_MATERIALIZER_SAVE_FILE_PROOF_PASSED' paper-a02-verified-delivery.log
          grep -F 'PAPER_A02_VERIFIED_FILE_PROOF_BEFORE_ACK_PASSED durableGrants=2 pending=0' paper-a02-verified-delivery.log
          if grep -Fq 'PAPER_A02_PROBE_FAILED' paper-a02-verified-delivery.log; then exit 1; fi
          echo 'PAPER_A02_REAL_PLAN_SAVE_PROOF_ACK_REAL_PAPER_PASSED'
      - name: Fifth Paper JVM persists incomplete grant, then SIGKILL before ACK
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          java -Da02.probe.phase=partial-save -Da02.probe.awaitSigkill=true \
            -Xms256M -Xmx1024M -jar paper.jar nogui \
            </dev/null > paper-a02-partial-save.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill -KILL "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 180); do
            if grep -Fq 'PAPER_A02_PROBE_FAILED' paper-a02-partial-save.log; then
              tail -180 paper-a02-partial-save.log
              exit 1
            fi
            if grep -Fq 'PAPER_A02_PARTIAL_SAVED_BEFORE_ACK_CRASH_POINT_READY' paper-a02-partial-save.log; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Partial-save Paper exited before forced crash' >&2
              tail -180 paper-a02-partial-save.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo 'Timed out awaiting actual partially saved receipt before ACK' >&2
            tail -180 paper-a02-partial-save.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-partial-save.log
          grep -F 'PAPER_A02_PARTIAL_640000_SAVED_NO_ACK_PASSED activeSequence=3 completed=2 slots=2' paper-a02-partial-save.log
          if grep -Fq 'Saving worlds' paper-a02-partial-save.log; then
            echo 'Paper began clean shutdown before partial-state SIGKILL' >&2
            exit 1
          fi
          test -f world/players/data/00000000-0000-0000-0000-00000000a002.dat
          kill -KILL "$server_pid"
          set +e
          wait "$server_pid"
          status=$?
          set -e
          trap - EXIT
          if [ "$status" -ne 137 ]; then
            echo "Expected partial-state SIGKILL exit 137, got $status" >&2
            exit 1
          fi
          echo 'PAPER_A02_PARTIAL_BEFORE_ACK_SIGKILL_INJECTED'
      - name: Sixth Paper JVM loads partial receipt, finishes saved grant, then ACKs
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          set +e
          timeout --signal=TERM --kill-after=10s 190s \
            java -Da02.probe.phase=partial-resume -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-partial-resume.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Partial-resume Paper process failed (exit=$status)" >&2
            tail -180 paper-a02-partial-resume.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-partial-resume.log
          grep -F 'PAPER_A02_PARTIAL_RESTART_FULL_STORAGE_NO_DUPLICATE_PASSED' paper-a02-partial-resume.log
          grep -F 'PAPER_A02_PARTIAL_RESTART_FINAL_SAVED_PROOF_PASSED newValue=10000 completed=3' paper-a02-partial-resume.log
          grep -F 'PAPER_A02_PARTIAL_TWO_JVM_EXACT_STACK_PREFIX_ACK_PASSED delivered=3 pending=0' paper-a02-partial-resume.log
          if grep -Fq 'PAPER_A02_PROBE_FAILED' paper-a02-partial-resume.log; then exit 1; fi
          echo 'PAPER_A02_PARTIAL_TWO_PAPER_RESTARTS_PASSED'
      - name: Upload scoped diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-a02-save-reload-logs
          path: smoke/*.log
          if-no-files-found: ignore
          retention-days: 7
