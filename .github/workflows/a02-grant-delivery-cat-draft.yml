name: A02 CAT grant save-commit Draft structural validation
on:
  pull_request:
    branches: [develop]
    paths:
      - 'docs/cat/drafts/a02-grant-delivery-*.md'
      - 'Lifecycle/Works/simplecoins.a02.grant-save-commit-cat-draft.md'
      - '.github/workflows/a02-grant-delivery-cat-draft.yml'
permissions:
  contents: read

jobs:
  lint-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate Work contract and only unapproved semantic Drafts
        shell: bash
        run: |
          set -euo pipefail
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.grant-save-commit-cat-draft.md
          python cat-tdd-fixed/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py \
            --files docs/cat/drafts/a02-grant-delivery-process.md \
                    docs/cat/drafts/a02-grant-delivery-pi.md \
                    docs/cat/drafts/a02-grant-delivery-tce.md
          echo 'A02_CAT_DRAFT_STRUCTURAL_LINT_ONLY_PASSED'
