name: Chat immutable SimpleCoins 20261122 followup source
on:
  push:
    branches: [infra/chat-source-20261122-followup]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d582d1d18732e531818f181b4e42422c24e56db9
          fetch-depth: 1
          persist-credentials: false
      - name: Archive
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d582d1d18732e531818f181b4e42422c24e56db9"
          mkdir -p snapshot
          git archive --format=tar HEAD | gzip -n > snapshot/repository.tar.gz
          printf 'repository=%s\ncommit=%s\ntree=%s\n' 'surumeneco/SimpleCoins' 'd582d1d18732e531818f181b4e42422c24e56db9' "$(git rev-parse HEAD^{tree})" > snapshot/identity.txt
          (cd snapshot && sha256sum repository.tar.gz > archive.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: simplecoins-followup-immutable-source
          path: snapshot/
          if-no-files-found: error
          retention-days: 1
