name: Phase5 excluded-world playerdata alias JDK25 regression

on:
  push:
    branches:
      - test/task003-excluded-playerdata-jdk25-20261104-queue-b
    paths:
      - '.github/workflows/task003-excluded-playerdata-jdk25.yml'
      - 'src/test/java/co/surumene/simplecoins/domain/WorldStorageExcludedWorldPlayerdataAliasTest.java'

permissions:
  contents: read

jobs:
  excluded-world-playerdata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run excluded-world playerdata physical alias JUnit tests
        run: gradle --no-daemon test --tests co.surumene.simplecoins.domain.WorldStorageExcludedWorldPlayerdataAliasTest
