name: Phase 7 rejected reservation source verification
on:
  push:
    branches:
      - feature/phase7-invalid-input-ci-20261103-queue-d
    paths:
      - .github/workflows/verify-phase7-invalid-input-queue-d.yml
      - docs/cat/phase7-grant-rejected-reservation-observation.md
permissions:
  contents: read
jobs:
  source-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Execute exact-source JUnit test
        run: gradle --no-daemon test --tests co.surumene.simplecoins.domain.GrantLedgerRejectedReservationAtomicityTest
  cat-draft-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: surumeneco/CAT-TDD
          ref: ee929dfa655d0dd738692990bebe7f5de77e4f31
          path: cat-tdd
          persist-credentials: false
      - name: Canonical CAT Draft syntax lint
        run: python3 cat-tdd/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py --files docs/cat/phase7-grant-rejected-reservation-observation.md
