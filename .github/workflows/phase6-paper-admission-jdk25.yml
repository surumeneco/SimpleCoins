name: Phase6 Paper admission adapter JDK25
on:
  push:
    branches:
      - "feature/phase6-paper-admission-listener-20261106-chatboost"
  pull_request:
    branches:
      - "feature/initial-domain-20261027"
permissions:
  contents: read
jobs:
  paper-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Compile Paper plugin and execute JUnit regression
        run: gradle --no-daemon clean test jar
      - name: Print JUnit summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob("build/test-results/test/TEST-*.xml")
          print("junit_xml_files",len(files))
          for path in files:
              root=ET.parse(path).getroot()
              if "AdmissionBarrierTest" in path:
                  print(path,root.get("tests"),root.get("failures"),root.get("errors"),root.get("skipped"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admission-junit-evidence
          path: build/test-results/test/TEST-*.xml
          if-no-files-found: warn
