name: A05 pinned read-only source archive
on:
  push:
    branches: ['infra/chat-a05-source-snapshot-20261118']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 83db03961dbe64f3f1813450ed9969d69f5e7350
          persist-credentials: false
      - name: Archive exact source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '83db03961dbe64f3f1813450ed9969d69f5e7350'
          printf '%s\n' 'surumeneco/SimpleCoins' '83db03961dbe64f3f1813450ed9969d69f5e7350' "$(git rev-parse HEAD^{tree})" > snapshot.manifest
          git archive --format=tar HEAD > source.tar
          sha256sum source.tar > source.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: a05-simplecoins-pinned-source
          path: |
            source.tar
            source.tar.sha256
            snapshot.manifest
          retention-days: 1
