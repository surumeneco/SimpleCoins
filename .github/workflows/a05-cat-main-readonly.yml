name: A05 isolated CAT released-main read-only diagnostics
on:
  push:
    branches: [infra/a05-cat-main-readonly-20261120]
    paths: ['.github/workflows/a05-cat-main-readonly.yml']
permissions:
  contents: read
jobs:
  source-derived-a05:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: acc7af23ed3d4c58f1a8d9215e5904a8364c6ff1
          path: product
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: c56b1e1f46867dfe2e5ac655907a62ebbe86b74c
          path: cat
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify immutable source identity
        run: |
          test "$(git -C product rev-parse HEAD)" = 'acc7af23ed3d4c58f1a8d9215e5904a8364c6ff1'
          test "$(git -C cat rev-parse HEAD)" = 'c56b1e1f46867dfe2e5ac655907a62ebbe86b74c'
          python cat/.cat-system/scripts/cat_flow.py --help
          python cat/.cat-system/scripts/cat_spec_test_sync.py --help
      - name: Execute CAT A05 source closure and generated-test preparation
        shell: bash
        run: |
          set -euo pipefail
          work=product/Lifecycle/Works/simplecoins.a05.wcl-consumer-verdict.md
          flow=cat/.cat-system/scripts/cat_flow.py
          python "$flow" validate --work "$work"
          python "$flow" conformance --work "$work" --kind process-closure
          python "$flow" compile --work "$work" --kind model
          python "$flow" conformance --work "$work" --kind model-conformance
          python "$flow" compile --work "$work" --kind vectors
          python "$flow" compile --work "$work" --kind queue
          # cat_flow's generic compile facade defaults to Vitest and has no
          # --framework switch. Use the canonical compiler's explicit JUnit
          # contract, with the same script-owned model/vectors/current Queue.
          root=product/Lifecycle/Works/.cat-flow/cache
          python cat/.cat-system/scripts/cat_compile_v2.py tests \
            "$root/a05-wcl-consumer-verdict-model.json" \
            "$root/a05-wcl-consumer-verdict-vectors.json" \
            product/tests/cat/a05-wcl-consumer-junit-binding.json \
            --queue "$root/a05-wcl-consumer-verdict-queue.json" \
            --framework junit \
            --process product/docs/cat/confirmed/a05-wcl-consumer-process.md \
            --pi product/docs/cat/confirmed/a05-wcl-consumer-pi.md \
            --tce product/docs/cat/confirmed/a05-wcl-consumer-tce.md \
            --allow-partial \
            -o product/Lifecycle/Works/.cat-flow/generated/A05WclEvidenceGeneratedTest.java
          grep -F 'GeneratedA05WclEvidence' product/Lifecycle/Works/.cat-flow/generated/A05WclEvidenceGeneratedTest.java
          find product/Lifecycle/Works/.cat-flow -type f | sort
      - name: Execute source-derived current-case JUnit on existing implementation
        shell: bash
        run: |
          set -euo pipefail
          source=product/Lifecycle/Works/.cat-flow/generated/A05WclEvidenceGeneratedTest.java
          class=$(grep -Eo 'final class GeneratedA05WclEvidenceCase[a-f0-9]+Test' "$source" | awk '{print $3}')
          [[ "$class" =~ ^GeneratedA05WclEvidenceCase[a-f0-9]+Test$ ]]
          target=product/src/test/java/co/surumene/simplecoins/domain/generated
          mkdir -p "$target"
          cp "$source" "$target/$class.java"
          cd product
          gradle --no-daemon :test --tests "co.surumene.simplecoins.domain.generated.$class"
          find build/test-results/test -name "TEST-*GeneratedA05WclEvidenceCase*Test.xml" -print
      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a05-cat-main-readonly-diagnostics
          path: |
            product/Lifecycle/Works/.cat-flow/
            product/build/test-results/test/TEST-*GeneratedA05WclEvidenceCase*Test.xml
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: ignore
