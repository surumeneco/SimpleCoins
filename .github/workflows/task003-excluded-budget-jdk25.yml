name: Phase5 excluded-world traversal budget JDK25 regression

on:
  push:
    branches:
      - test/phase5-excluded-budget-boundary-20261104-queue-c
    paths:
      - '.github/workflows/task003-excluded-budget-jdk25.yml'
      - 'src/test/java/co/surumene/simplecoins/domain/WorldStorageExcludedBudgetBoundaryTest.java'

permissions:
  contents: read

jobs:
  excluded-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run excluded-world budget regression
        run: gradle --no-daemon test --tests co.surumene.simplecoins.domain.WorldStorageExcludedBudgetBoundaryTest
