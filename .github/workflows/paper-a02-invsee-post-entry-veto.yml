name: A02 actual InvSee saved writer past late event-veto checkpoint
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.a02.invsee-event-checkpoint-writer-drain.md'
      - 'tests/paper-invsee-writer-probe/**'
      - '.github/workflows/paper-a02-invsee-post-entry-veto.yml'
permissions:
  contents: read
jobs:
  test-real-invsee-event-admitted-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate bounded issue-work structure only (not a CAT Gate)
        shell: bash
        run: |
          set -euo pipefail
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.invsee-event-checkpoint-writer-drain.md
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/MineCraftXPlayServer
          ref: 90aa2d0e0a5ea80c705fd67d717f463decaf2a32
          path: pinned-server
          sparse-checkout: |
            plugins/InvSee++.jar
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify the exact InvSee++ runtime distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-server rev-parse HEAD)" = '90aa2d0e0a5ea80c705fd67d717f463decaf2a32'
          printf '%s  %s\n' \
            '01f3e053a814f76d46513ebf65a38747df11df81c577d12bed108b353d7775f9' \
            'pinned-server/plugins/InvSee++.jar' | sha256sum -c -
      - name: Build product, guard and disposable InvSee event observer
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :test :admission-guard:test jar :admission-guard:jar
          gradle --no-daemon -p tests/paper-invsee-writer-probe jar
          python3 tools/simplecoins_preflight.py \
            admission-guard/build/libs/admission-guard-1.0.0.jar \
            build/libs/SimpleCoins-1.0.0.jar
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fq InvseeWriterProbe.class; then
            echo 'Test observer leaked into production plugin' >&2
            exit 1
          fi
      - name: Download official SHA256-verified Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-A02-InvSeeEventFence/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' -o smoke/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke/paper.jar
          printf '%s  %s\n' "$sha" smoke/paper.jar | sha256sum -c -
          cp build/libs/SimpleCoins-1.0.0.jar smoke/plugins/SimpleCoins.jar
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke/plugins/SimpleCoinsGuard.jar
          cp pinned-server/plugins/InvSee++.jar smoke/plugins/InvSeePlusPlus.jar
          cp tests/paper-invsee-writer-probe/build/libs/SimpleCoinsInvseeWriterProbe.jar smoke/plugins/InvseeProbe.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25594\n' > smoke/server.properties
      - name: Prove accepted first InvSee save completes despite newly closed event gate
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            java -Da02.invsee.probePastEventCheckpoint=true -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-invsee-past-gate.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "Unexpected actual Paper exit $code" >&2
            tail -160 paper-a02-invsee-past-gate.log
            exit 1
          fi
          if grep -Fq 'PAPER_A02_INVSEE_PROBE_FAILED' paper-a02-invsee-past-gate.log; then
            tail -160 paper-a02-invsee-past-gate.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-invsee-past-gate.log
          grep -F 'PAPER_A02_INVSEE_REAL_SAVED_COIN_RECEIPT_PROOF_PASSED' paper-a02-invsee-past-gate.log
          grep -F 'PAPER_A02_INVSEE_LATE_VETO_CLOSED_AFTER_FIRST_EVENT_ADMITTED' paper-a02-invsee-past-gate.log
          grep -F 'PAPER_A02_INVSEE_FIRST_ADMITTED_SAVE_COMPLETED_AFTER_LATE_FENCE' paper-a02-invsee-past-gate.log
          grep -F 'PAPER_A02_INVSEE_SAVED_COIN_REMOVED_RECEIPT_RETAINED_LEDGER_PENDING' paper-a02-invsee-past-gate.log
          grep -F 'PAPER_A02_INVSEE_SECOND_SAVE_EVENT_VETOED_AFTER_FENCE' paper-a02-invsee-past-gate.log
          grep -F 'PAPER_A02_INVSEE_FRESH_PROOF_REJECTS_LOST_MONEY_NO_ACK' paper-a02-invsee-past-gate.log
          grep -F 'PAPER_A02_INVSEE_POST_EVENT_VETO_NEEDS_IN_FLIGHT_DRAIN' paper-a02-invsee-past-gate.log
          echo 'A02_REAL_INVSEE_ACCEPTED_WRITER_CROSSES_LATE_VETO_NOT_A_G3_SAFETY_PROOF'
      - name: Preserve actual Paper technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a02-invsee-real-past-event-veto
          path: smoke/*.log
          retention-days: 14
          if-no-files-found: ignore
