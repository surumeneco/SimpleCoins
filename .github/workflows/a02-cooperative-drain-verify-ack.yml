name: A02 cooperative in-flight writer drain / durable grant ACK
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.a02.cooperative-drain-verify-ack.md'
      - 'src/test/java/co/surumene/simplecoins/paper/CooperativeWriterDrainReadbackTest.java'
      - '.github/workflows/a02-cooperative-drain-verify-ack.yml'
permissions:
  contents: read
jobs:
  verified-cooperative-writer-epoch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Verify issue-work structure with canonical CAT script (not normative Gate)
        shell: bash
        run: |
          set -euo pipefail
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.cooperative-drain-verify-ack.md
      - name: Assert standalone probe does not authorize production writer activity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          work = Path('Lifecycle/Works/simplecoins.a02.cooperative-drain-verify-ack.md').read_text()
          test = Path('src/test/java/co/surumene/simplecoins/paper/CooperativeWriterDrainReadbackTest.java').read_text()
          assert 'status: draft' in work and "decision_ref: ''" in work
          assert 'work_kind: verification' in work
          assert 'formal' not in test or 'outside this proof' in test
          for required in (
              'closeAndDrain', 'enterWriter', 'reopen', 'CountDownLatch',
              'SavedGrantDeliveryFileReadback.verify', 'acknowledge',
              'forceFileAndParent', 'GrantLedger reopened',
              'pendingWriterMustDrainBeforeAuthoritativeReadbackAck',
              'multipleInFlightMustDrainAndReopenOnlyAfterBarrierRelease',
          ):
              assert required in test, required
          assert 'private static final class ExperimentalWriterEpoch' in test
          assert 'src/main/java' not in work.split('## Repositories')[1].split('## Checks')[0]
          print('A02_COOPERATIVE_FENCE_TEST_ONLY_NO_PRODUCT_ADMISSION_AUTHORITY')
          PY
      - name: Run real compressed NBT and production grant ledger proof under cooperative drain
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :test \
            --tests co.surumene.simplecoins.paper.CooperativeWriterDrainReadbackTest
          report=build/test-results/test/TEST-co.surumene.simplecoins.paper.CooperativeWriterDrainReadbackTest.xml
          test -s "$report"
          python - "$report" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET
          root=ET.parse(Path(sys.argv[1])).getroot()
          cases={e.get('name') for e in root.findall('testcase')}
          required={
              'pendingWriterMustDrainBeforeAuthoritativeReadbackAck()',
              'multipleInFlightMustDrainAndReopenOnlyAfterBarrierRelease()',
          }
          assert required.issubset(cases), (required, cases)
          assert int(root.attrib.get('failures',-1)) == 0
          assert int(root.attrib.get('errors',-1)) == 0
          assert int(root.attrib.get('tests',0)) >= 2
          print('A02_COOPERATIVE_IN_FLIGHT_WRITERS_DRAIN_BEFORE_GENUINE_SAVED_GRANT_ACK')
          print('A02_NEW_WRITERS_DENIED_UNTIL_DURABLE_ACK_AND_EXPLICIT_REOPEN')
          print('A02_G3_ALL_WRITER_CLOSURE_AND_PAPER_SAVE_ARE_NOT_PROVEN')
          PY
      - name: Upload exact JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a02-cooperative-drain-ack-junit
          path: build/test-results/test/TEST-co.surumene.simplecoins.paper.CooperativeWriterDrainReadbackTest.xml
          if-no-files-found: ignore
          retention-days: 14
