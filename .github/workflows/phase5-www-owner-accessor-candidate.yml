name: Phase 5 WWW owner accessor Candidate verification

on:
  push:
    branches:
      - feature/phase5-www-commander-owner-read-failure-20261103-queue-a
    paths:
      - 'docs/cat/phase5-www-commander-owner-accessor-boundary.md'
      - 'src/test/java/co/surumene/simplecoins/PaperWonderfulWolfOwnerAccessorFailureTest.java'
      - '.github/workflows/phase5-www-owner-accessor-candidate.yml'

permissions:
  contents: read

jobs:
  candidate-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: surumeneco/CAT-TDD
          ref: ee929dfa655d0dd738692990bebe7f5de77e4f31
          path: cat-tdd
          persist-credentials: false
      - name: Lint Draft syntax only
        run: python3 cat-tdd/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py --files docs/cat/phase5-www-commander-owner-accessor-boundary.md
  junit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Execute full JUnit suite (two expected Red vectors)
        run: gradle --no-daemon clean test
