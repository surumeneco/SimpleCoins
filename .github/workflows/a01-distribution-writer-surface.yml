name: A01 packaged plugin writer entrypoint inventory
on:
  pull_request:
    branches: [develop]
    paths:
      - 'tools/audit_writer_surface.py'
      - 'tests/test_writer_surface_audit.py'
      - 'Lifecycle/Works/simplecoins.a01.packaged-writer-entrypoints.md'
      - '.github/workflows/a01-distribution-writer-surface.yml'
permissions:
  contents: read
jobs:
  inspect-distribution-writers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate scoped verification Work only (not a CAT Gate)
        shell: bash
        run: |
          set -euo pipefail
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a01.packaged-writer-entrypoints.md
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run deterministic classfile parsing and fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_writer_surface_audit.py
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/MineCraftXPlayServer
          ref: 90aa2d0e0a5ea80c705fd67d717f463decaf2a32
          path: pinned-server
          sparse-checkout: |
            plugins
          persist-credentials: false
      - name: Audit every packaged plugin JAR at fixed server revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-server rev-parse HEAD)" = \
            "90aa2d0e0a5ea80c705fd67d717f463decaf2a32"
          for item in \
            'WonderfulCoreLibrary-0.1.0.jar' \
            'WhatAWonderfulChicken-2.1.0.jar' \
            'WhatAWonderfulWolf-1.1.1.jar' \
            'blocklocker-1.15.jar'; do
            test -s "pinned-server/plugins/$item"
          done
          python tools/audit_writer_surface.py \
            --plugins pinned-server/plugins \
            --output writer-surface-report.json \
            --max-examples 20 \
            --require WonderfulCoreLibrary-0.1.0.jar \
            --require WhatAWonderfulChicken-2.1.0.jar \
            --require WhatAWonderfulWolf-1.1.1.jar \
            --require blocklocker-1.15.jar
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('writer-surface-report.json').read_text(encoding='utf-8'))
          assert report['kind'] == 'STATIC_CANDIDATE_CALL_REFERENCES_ONLY'
          assert len(report['jars']) >= 4
          groups = ['INVENTORY_WRITE','PDC_WRITE','WORLD_WRITE','STORED_FILE_WRITE',
                    'PLAYERDATA_SAVE','NMS_MUTATION','ASYNC_ENTRY','DYNAMIC_DISPATCH']
          for group in groups:
              print('SURFACE',group,'='.join(['',str(sum(j['categories'][group] for j in report['jars']))]))
          assert sum(j['classes'] for j in report['jars']) > 0
          # Focus on packaged code paths relevant to offline playerdata and
          # plugin-owned inventory changes. These are SYMBOLIC references.
          interesting = {'InvSee++.jar', 'WhatAWonderfulChicken-2.1.0.jar',
                         'WhatAWonderfulWolf-1.1.1.jar', 'blocklocker-1.15.jar'}
          for jar in report['jars']:
              if jar['jar'] not in interesting:
                  continue
              print('AUDIT_FOCUS', jar['jar'], 'sha256=', jar['sha256'])
              for cat in ['PLAYERDATA_SAVE', 'INVENTORY_WRITE', 'PDC_WRITE',
                          'STORED_FILE_WRITE', 'ASYNC_ENTRY']:
                  for ref in jar['examples'].get(cat, []):
                      print('AUDIT_CALLREF', jar['jar'], cat,
                            ref['class'], ref['owner'], ref['method'])
          print('PINNED_DISTRIBUTION_STATIC_WRITER_SURFACE_OBSERVED_NOT_CLOSED')
          PY
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: 047781068471658c2118d6b5b60b8bc88aac6e3d
          path: baseline-scanner
          persist-credentials: false
      - name: Quantify truly newly detected callrefs against unchanged pinned JAR bytes
        shell: bash
        run: |
          set -euo pipefail
          python baseline-scanner/tools/audit_writer_surface.py \
            --plugins pinned-server/plugins \
            --output writer-surface-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('writer-surface-baseline.json').read_text(encoding='utf-8'))
          after = json.loads(Path('writer-surface-report.json').read_text(encoding='utf-8'))
          old = {j['jar']:j for j in before['jars']}
          new = {j['jar']:j for j in after['jars']}
          assert len(old) == len(new) == 24
          assert old.keys() == new.keys()
          total_new = 0
          for name in sorted(old):
              original, current = old[name], new[name]
              for k in ('sha256','size','classes','method_references'):
                  assert original[k] == current[k], (name, k)
              for category in original['categories']:
                  if category != 'STORED_FILE_WRITE':
                      assert original['categories'][category] == current['categories'][category], name
              gain = current['categories']['STORED_FILE_WRITE'] - original['categories']['STORED_FILE_WRITE']
              assert gain >= 0, name
              total_new += gain
              if gain:
                  print('A01_NEW_STATIC_FILE_WRITER_API_CALLREF',name,'delta=',gain)
          print('A01_PINNED_24_JAR_STORED_FILE_WRITE_BEFORE',
                sum(j['categories']['STORED_FILE_WRITE'] for j in old.values()))
          print('A01_PINNED_24_JAR_STORED_FILE_WRITE_AFTER',
                sum(j['categories']['STORED_FILE_WRITE'] for j in new.values()))
          print('A01_PINNED_24_JAR_NEW_WRITER_API_CALLREFS',total_new)
          print('A01_STATIC_INVOCATION_REFERENCE_ONLY_NOT_ALL_WRITER_CLOSURE')
          PY
      - name: Save exact per-JAR SHA256 writer reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a01-static-packaged-writer-entrypoints
          path: |
            writer-surface-report.json
            writer-surface-baseline.json
          retention-days: 14
          if-no-files-found: ignore
