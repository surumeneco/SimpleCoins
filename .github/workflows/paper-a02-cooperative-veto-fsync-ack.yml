name: A02 cooperative InvSee++ veto with fsync, ACK and cold-restart
on:
  pull_request:
    branches: [develop]
    paths:
      - 'tests/paper-invsee-writer-probe/**'
      - 'Lifecycle/Works/simplecoins.a02.cooperative-veto-fsync-ack.md'
      - '.github/workflows/paper-a02-cooperative-veto-fsync-ack.yml'
permissions:
  contents: read
jobs:
  sync-and-abrupt-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate issue-only Work structure without normative CAT approval
        shell: bash
        run: |
          set -euo pipefail
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.cooperative-veto-fsync-ack.md
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/MineCraftXPlayServer
          ref: 90aa2d0e0a5ea80c705fd67d717f463decaf2a32
          path: pinned-server
          sparse-checkout: |
            plugins/InvSee++.jar
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Confirm the actual pinned InvSee++ test API JAR
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-server rev-parse HEAD)" = "90aa2d0e0a5ea80c705fd67d717f463decaf2a32"
          echo '01f3e053a814f76d46513ebf65a38747df11df81c577d12bed108b353d7775f9  pinned-server/plugins/InvSee++.jar' | sha256sum -c -
      - name: Build isolated Paper observer and hardened product+independent guard
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :test :admission-guard:test jar :admission-guard:jar
          gradle --no-daemon -p tests/paper-invsee-writer-probe jar
          python3 tools/simplecoins_preflight.py admission-guard/build/libs/admission-guard-1.0.0.jar build/libs/SimpleCoins-1.0.0.jar
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fq 'InvseeWriterProbe.class'; then
            echo 'test-only probe class leaked into product JAR' >&2
            exit 1
          fi
      - name: Download SHA256-verified official Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-cooperative-ack/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-A02-Cooperative-ACK-Probe/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' -o smoke-cooperative-ack/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke-cooperative-ack/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke-cooperative-ack/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke-cooperative-ack/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke-cooperative-ack/paper.jar
          printf '%s  %s\n' "$sha" smoke-cooperative-ack/paper.jar | sha256sum -c -
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke-cooperative-ack/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke-cooperative-ack/plugins/SimpleCoins.jar
          cp pinned-server/plugins/InvSee++.jar smoke-cooperative-ack/plugins/InvSeePlusPlus.jar
          cp tests/paper-invsee-writer-probe/build/libs/SimpleCoinsInvseeWriterProbe.jar smoke-cooperative-ack/plugins/InvseeWriterProbe.jar
          printf 'eula=true\n' > smoke-cooperative-ack/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25593\n' > smoke-cooperative-ack/server.properties
      - name: Real Paper vetoes one destructive InvSee++ save before durable ACK and abnormal halt
        shell: bash
        run: |
          set -euo pipefail
          cd smoke-cooperative-ack
          set +e
          timeout --signal=TERM --kill-after=10s 190s \
            java -Da02.invsee.vetoFsyncAck=true -Xms256M -Xmx1024M -jar paper.jar nogui \
              </dev/null > paper-a02-cooperative-ack.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 139 ]; then
            echo "Unexpected first Paper JVM exit: $code (expected Runtime.halt(139))" >&2
            tail -200 paper-a02-cooperative-ack.log
            exit 1
          fi
          if grep -Fq 'PAPER_A02_INVSEE_PROBE_FAILED' paper-a02-cooperative-ack.log; then
            tail -200 paper-a02-cooperative-ack.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-cooperative-ack.log
          grep -F 'PAPER_A02_INVSEE_REAL_SAVED_COIN_RECEIPT_PROOF_PASSED' paper-a02-cooperative-ack.log
          grep -F 'PAPER_A02_INVSEE_REAL_OFFLINE_INVENTORY_CAPTURE_PASSED' paper-a02-cooperative-ack.log
          grep -F 'PAPER_A02_INVSEE_SAVE_EVENT_CANCELLED_BEFORE_FILE_WRITE' paper-a02-cooperative-ack.log
          grep -F 'PAPER_A02_INVSEE_CANCELLED_SAVE_PRESERVES_VALID_COIN_RECEIPT_PROOF' paper-a02-cooperative-ack.log
          grep -F 'PAPER_A02_COOPERATIVE_VETO_FILE_DIR_FSYNC_AND_FRESH_PROOF' paper-a02-cooperative-ack.log
          grep -F 'PAPER_A02_COOPERATIVE_VETO_ONE_DURABLE_ACK_NO_ITEM_CHANGE' paper-a02-cooperative-ack.log
          grep -F 'PAPER_A02_COOPERATIVE_VETO_GUARD_REMAINS_CLOSED' paper-a02-cooperative-ack.log
          grep -F 'PAPER_A02_COOPERATIVE_VETO_ABRUPT_HALT_AFTER_DURABLE_ACK' paper-a02-cooperative-ack.log
          if grep -Fq 'PAPER_A02_INVSEE_ACTUAL_PLUGIN_POST_PROOF_FALSE_ACK_REPRODUCED' paper-a02-cooperative-ack.log; then
            echo 'Unexpected unprotected false ACK path' >&2
            exit 1
          fi
      - name: Second independent Paper JVM confirms durable coin, receipt and exactly one ACK
        shell: bash
        run: |
          set -euo pipefail
          cd smoke-cooperative-ack
          set +e
          timeout --signal=TERM --kill-after=10s 190s \
            java -Da02.invsee.checkAfterHalt=true -Xms256M -Xmx1024M -jar paper.jar nogui \
              </dev/null > paper-a02-cooperative-restart.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "Unexpected second Paper JVM exit: $code" >&2
            tail -200 paper-a02-cooperative-restart.log
            exit 1
          fi
          if grep -Fq 'PAPER_A02_INVSEE_PROBE_FAILED' paper-a02-cooperative-restart.log; then
            tail -200 paper-a02-cooperative-restart.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-cooperative-restart.log
          grep -F 'PAPER_A02_FORCED_SYNC_ABRUPT_RESTART_PRESERVED_5000C_RECEIPT_ACK' paper-a02-cooperative-restart.log
          grep -F 'PAPER_A02_FORCED_SYNC_GUARD_REMAINS_CLOSED' paper-a02-cooperative-restart.log
          echo 'PAPER_A02_COOPERATIVE_VETO_FSYNC_ACK_COLD_REPLAY_PROVED_FOR_INVSEE_ONLY'
      - name: Upload real Paper protected writer/ACK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a02-cooperative-invsee-veto-fsync-ack
          path: |
            smoke-cooperative-ack/paper-a02-cooperative-ack.log
            smoke-cooperative-ack/paper-a02-cooperative-restart.log
          retention-days: 14
          if-no-files-found: ignore
