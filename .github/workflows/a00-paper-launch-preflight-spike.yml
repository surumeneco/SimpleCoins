name: A00 Paper launch preflight isolated spike
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.a00.paper-launch-preflight-spike.md'
      - 'tools/paper_start_guard.sh'
      - 'tests/test_paper_start_guard.py'
      - '.github/workflows/a00-paper-launch-preflight-spike.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Verify actual pinned issue-work contract, not formal CAT Gates
        run: |
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a00.paper-launch-preflight-spike.md
      - name: Exercise 21 isolated launch-denial and allow fixtures
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_paper_start_guard.py' -v
          echo A00_START_GUARD_21_ISOLATED_FIXTURES_GREEN
      - name: Build current actual product and independent admission JARs
        run: |
          gradle --no-daemon :jar :admission-guard:jar
          python tools/simplecoins_preflight.py \
            admission-guard/build/libs/admission-guard-1.0.0.jar \
            build/libs/SimpleCoins-1.0.0.jar
      - name: Actual built-JAR positive and damaged-JAR negative control (no Paper launch)
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/plugins"
          cp build/libs/SimpleCoins-1.0.0.jar "$tmp/plugins/SimpleCoins.jar"
          cp admission-guard/build/libs/admission-guard-1.0.0.jar "$tmp/plugins/SimpleCoinsGuard.jar"
          printf 'white-list=true\nenforce-whitelist=true\n' > "$tmp/server.properties"
          printf '[]\n' > "$tmp/whitelist.json"
          printf '[]\n' > "$tmp/ops.json"
          coinsha=$(sha256sum "$tmp/plugins/SimpleCoins.jar" | cut -d ' ' -f1)
          guardsha=$(sha256sum "$tmp/plugins/SimpleCoinsGuard.jar" | cut -d ' ' -f1)
          bash tools/paper_start_guard.sh "$tmp" "$coinsha" "$guardsha" -- \
            sh -c 'printf launched > "test-launch-marker"'
          test "$(cat "$tmp/test-launch-marker")" = launched
          rm -f "$tmp/test-launch-marker"
          printf x >> "$tmp/plugins/SimpleCoins.jar"
          set +e
          bash tools/paper_start_guard.sh "$tmp" "$coinsha" "$guardsha" -- \
            sh -c 'printf BAD > "test-launch-marker"' 2> "$tmp/denial.log"
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'START_GUARD_DENIED' "$tmp/denial.log"
          test ! -e "$tmp/test-launch-marker"
          echo A00_REAL_BUILT_JARS_LAUNCH_PREFLIGHT_POSITIVE_AND_SHA_DENIAL
