name: CI
on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop, main]
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Compile, test, and package
        run: gradle --no-daemon clean build
      - name: Check plugin descriptor in artifact
        run: |
          unzip -p build/libs/SimpleCoins-1.0.0.jar plugin.yml | grep 'version:'
          unzip -p build/libs/SimpleCoins-1.0.0.jar plugin.yml | grep 'api-version:'
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleCoins-1.0.0-unreleased
          path: build/libs/SimpleCoins-1.0.0.jar
          if-no-files-found: error
