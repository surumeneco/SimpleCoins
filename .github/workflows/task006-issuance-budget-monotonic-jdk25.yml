name: Phase7 issuance budget candidate JDK25
on:
  push:
    branches:
      - test/task006-issuance-budget-monotonic-queue-a-20261107
  workflow_dispatch:
jobs:
  issuance-budget-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run candidate tests
        run: gradle --no-daemon clean test --tests co.surumene.simplecoins.domain.IssuanceBudgetMonotonicCandidateTest
      - name: Verify JUnit XML is not vacuously green
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('build/test-results/test/TEST-*IssuanceBudgetMonotonicCandidateTest.xml')
          assert len(files) == 1, files
          root = ET.parse(files[0]).getroot()
          assert int(root.attrib['tests']) == 3, root.attrib
          for key in ('failures', 'errors', 'skipped'):
              assert int(root.attrib.get(key, '0')) == 0, root.attrib
          PY
