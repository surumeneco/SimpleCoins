name: Phase 5 companion provider parity (scoped verification)
on:
  pull_request:
    branches:
      - feature/owner-evidence-20261101
    paths:
      - 'src/test/java/co/surumene/simplecoins/PaperWonderfulChickenEvidenceParityTest.java'
      - 'src/test/java/co/surumene/simplecoins/PaperWonderfulWolfReflectionBoundaryTest.java'
      - 'docs/cat/phase5-companion-provider-contract-parity.md'
      - '.github/workflows/phase5-companion-provider-parity.yml'
  push:
    branches:
      - feature/phase5-companion-provider-parity-20261102-queue-c
    paths:
      - 'src/test/java/co/surumene/simplecoins/PaperWonderfulChickenEvidenceParityTest.java'
      - 'src/test/java/co/surumene/simplecoins/PaperWonderfulWolfReflectionBoundaryTest.java'
      - 'docs/cat/phase5-companion-provider-contract-parity.md'
      - '.github/workflows/phase5-companion-provider-parity.yml'
permissions:
  contents: read
jobs:
  junit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Execute full JUnit and domain checks on exact branch HEAD
        run: gradle --no-daemon clean check
      - name: State CAT evidence boundary
        run: echo 'JUnit/Gradle verification only. CAT normative semantic Gates and Paper live acceptance remain not-run.' >> "$GITHUB_STEP_SUMMARY"
