name: Chat isolated read-only source snapshot
on:
  push:
    branches:
      - infra/chat-readonly-snapshot-20261120
    paths:
      - .github/workflows/chat-readonly-snapshot.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: c6ae4744b187826805a5817bce5f3ad5f279c186
          persist-credentials: false
          fetch-depth: 1
      - name: Archive exact immutable source
        run: |
          mkdir -p /tmp/chat-source
          test "$(git rev-parse HEAD)" = "c6ae4744b187826805a5817bce5f3ad5f279c186"
          test "$(git rev-parse HEAD^{tree})" = "954793f79e142f8efbd04865fb0012b337ad3224"
          git archive --format=tar HEAD | gzip -n > /tmp/chat-source/source.tar.gz
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('/tmp/chat-source/source.tar.gz')
          data={'repository':'surumeneco/SimpleCoins','commit':'c6ae4744b187826805a5817bce5f3ad5f279c186','tree':'954793f79e142f8efbd04865fb0012b337ad3224','archive_sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          pathlib.Path('/tmp/chat-source/manifest.json').write_text(json.dumps(data,sort_keys=True),encoding='utf-8')
          print(data)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chat-readonly-simplecoins-c6ae4744
          path: /tmp/chat-source/
          retention-days: 1
          if-no-files-found: error
