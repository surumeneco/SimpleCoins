name: Chat read-only immutable SimpleCoins source snapshot
on:
  push:
    branches:
      - infra/chat-source-20261121
    paths:
      - .github/workflows/chat-readonly-snapshot.yml
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed application source revision without write credentials
        uses: actions/checkout@v4
        with:
          ref: 006279c8e30e4241909fe396c4122a3a609a68cc
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact commit and tree, archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "006279c8e30e4241909fe396c4122a3a609a68cc"
          test "$(git rev-parse HEAD^{tree})" = "3bae22774c7082c320416d4724ddab3b517d4b63"
          git archive --format=tar.gz --prefix=source/ -o source.tar.gz HEAD
          printf '%s\n' 'repository=surumeneco/SimpleCoins' 'commit=006279c8e30e4241909fe396c4122a3a609a68cc' 'tree=3bae22774c7082c320416d4724ddab3b517d4b63' > provenance.txt
          sha256sum source.tar.gz >> provenance.txt
      - name: Upload immutable read-only source archive
        uses: actions/upload-artifact@v4
        with:
          name: chat-simplecoins-source-006279c8
          path: |
            source.tar.gz
            provenance.txt
          if-no-files-found: error
          retention-days: 1
