name: A16 CAT JUnit generated regression evidence
on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/main/java/co/surumene/simplecoins/domain/JavaCurrencyPack.java'
      - 'src/test/java/co/surumene/simplecoins/domain/A16ImageSelectionDriver.java'
      - 'src/test/java/co/surumene/simplecoins/domain/generated/GeneratedA16ImageSelection*.java'
      - 'Lifecycle/Works/simplecoins.a16.image-fallback.md'
      - '.github/workflows/a16-cat-junit-proof.yml'
permissions:
  contents: read
jobs:
  generated-junit-real-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Require real JUnit Red for changed A16 behavior on base source
        shell: bash
        run: |
          set -euo pipefail
          source='src/main/java/co/surumene/simplecoins/domain/JavaCurrencyPack.java'
          if git diff --quiet '${{ github.event.pull_request.base.sha }}' HEAD -- "$source"; then
            echo "A16 source unchanged; run existing Green regression only"
            exit 0
          fi
          cp "$source" "$RUNNER_TEMP/a16-green.java"
          git show '${{ github.event.pull_request.base.sha }}:'"$source" > "$source"
          set +e
          gradle --no-daemon :test --tests 'co.surumene.simplecoins.domain.GeneratedA16ImageSelectionCase123a32c34595Test' > "$RUNNER_TEMP/a16-red.log" 2>&1
          result=$?
          set -e
          cp "$RUNNER_TEMP/a16-green.java" "$source"
          cat "$RUNNER_TEMP/a16-red.log"
          if [ "$result" -eq 0 ]; then
            echo 'Expected genuine JUnit Red was not observed' >&2
            exit 1
          fi
          python3 - <<'PYRED'
          import pathlib,xml.etree.ElementTree as ET
          target=pathlib.Path('build/test-results/test/TEST-co.surumene.simplecoins.domain.GeneratedA16ImageSelectionCase123a32c34595Test.xml')
          if not target.is_file():
              raise SystemExit('Missing JUnit XML: Gradle failure might be unrelated')
          root=ET.parse(target).getroot()
          failures=[x for x in root.iter('failure')]
          if len(failures)!=1 or 'CAT allowed outcome set: case.s3' not in '\n'.join(x.attrib.get('message','')+'\n'+(x.text or '') for x in failures):
              raise SystemExit('JUnit failure not the expected CAT case.s3 oracle')
          print('A16_CATALOG_JUNIT_EXPECTED_RED case.s3 failure verified')
          PYRED
      - name: Require generated JUnit Green for all four approved cases
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean test
          python3 - <<'PYGREEN'
          import pathlib,xml.etree.ElementTree as ET
          folder=pathlib.Path('build/test-results/test')
          expected={
              'GeneratedA16ImageSelectionCase123a32c34595Test',
              'GeneratedA16ImageSelectionCase270ea3584cb1Test',
              'GeneratedA16ImageSelectionCase34c89fbe779cTest',
              'GeneratedA16ImageSelectionCasee292a6c220f2Test',
          }
          for cls in sorted(expected):
              path=folder/f'TEST-co.surumene.simplecoins.domain.{cls}.xml'
              if not path.exists(): raise SystemExit(f'Expected JUnit XML absent: {cls}')
              tree=ET.parse(path).getroot()
              tests=list(tree.iter('testcase'))
              if len(tests)!=1 or any(x.tag in ('failure','error','skipped') for x in tree.iter()):
                  raise SystemExit(f'Generated JUnit test did not Green: {cls}')
          print('A16_CAT_JUNIT_FOUR_GREEN_REAL_JUNIT_XML_PASSED')
          PYGREEN
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: fd3f5c7e0646627780250dcc3fa5684d35a5f9cd
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Canonical CAT JUnit Green receipts and Queue-state
        shell: bash
        run: |
          set -euo pipefail
          FLOW=cat-tdd-fixed/.cat-system/scripts/cat_flow.py
          WORK=Lifecycle/Works/simplecoins.a16.image-fallback.md
          python "$FLOW" validate --work "$WORK"
          python "$FLOW" conformance --work "$WORK" --kind process-closure
          python "$FLOW" compile --work "$WORK" --kind model
          python "$FLOW" conformance --work "$WORK" --kind model-conformance
          python "$FLOW" compile --work "$WORK" --kind vectors
          python "$FLOW" compile --work "$WORK" --kind queue
          for rule in s0 s1 s2 s3; do
            python "$FLOW" run --work "$WORK" --id "green-$rule" --execute
            python "$FLOW" queue-state --work "$WORK" \
              --evidence "Lifecycle/Works/.cat-flow/evidence/green-$rule.json"
          done
          python - <<'PYQUEUE'
          import json,pathlib
          root=pathlib.Path('Lifecycle/Works/.cat-flow/cache')
          queue=json.loads((root/'a16-image-fallback-queue.json').read_text())
          assert len(queue['items'])==4
          assert {x['model_ref'] for x in queue['items']}=={'s0','s1','s2','s3'}
          assert all(x['status']=='done' and x['evidence_ref'] for x in queue['items'])
          for x in queue['items']:
              evidence=json.loads(pathlib.Path(x['evidence_ref']).read_text())
              assert evidence['verdict']=='passed' and evidence['stage']=='green'
              assert evidence['queue_context']['current_item_id']==x['id']
          print('A16_CANONICAL_QUEUE_GREEN_RECEIPTS_FOUR_CASES_PASSED')
          PYQUEUE
      - name: Evaluate bounded implementation obligations without inventing pass
        shell: bash
        run: |
          set -euo pipefail
          FLOW=cat-tdd-fixed/.cat-system/scripts/cat_flow.py
          WORK=Lifecycle/Works/simplecoins.a16.image-fallback.md
          python "$FLOW" obligations --work "$WORK"
          python "$FLOW" conformance --work "$WORK" --kind implementation-conformance
          python - <<'PYOB'
          import json,pathlib
          base=pathlib.Path('Lifecycle/Works/.cat-flow')
          gate=json.loads((base/'conformance/implementation-conformance.json').read_text())
          assert gate['verdict'] in ('passed','inconclusive'),gate
          items=json.loads((base/'cache/implementation-obligations-evaluated.json').read_text())['items']
          matching=[x for x in items if x['method'] in ('generated-test','generated-test-allowed-set')]
          assert matching and all(x['status']=='passed' for x in matching),matching
          print('A16_CAT_IMPLEMENTATION_VERDICT',gate['verdict'])
          print('A16_CAT_OBLIGATIONS_OUTSTANDING',[(x['id'],x['status']) for x in items if x['status']!='passed'])
          PYOB

      - name: Preserve script-owned CAT evidence and JUnit XML
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: a16-cat-evidence-receipts
          path: |
            Lifecycle/Works/.cat-flow/cache/a16-image-fallback-model.json
            Lifecycle/Works/.cat-flow/cache/a16-image-fallback-vectors.json
            Lifecycle/Works/.cat-flow/cache/a16-image-fallback-queue.json
            Lifecycle/Works/.cat-flow/cache/a16-image-fallback-obligations.json
            Lifecycle/Works/.cat-flow/cache/implementation-obligations-evaluated.json
            Lifecycle/Works/.cat-flow/conformance/*.json
            Lifecycle/Works/.cat-flow/evidence/green-*.json
            Lifecycle/Works/.cat-flow/reports/green-*.xml
          if-no-files-found: error
          retention-days: 14
