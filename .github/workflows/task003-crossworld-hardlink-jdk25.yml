name: Phase5 crossworld hardlink Draft regression

on:
  push:
    branches:
      - test/phase5-crossworld-hardlink-jdk25-20261104-queue-c
    paths:
      - 'src/test/java/co/surumene/simplecoins/domain/WorldStorageCrossworldPhysicalAliasTest.java'
      - '.github/workflows/task003-crossworld-hardlink-jdk25.yml'

permissions:
  contents: read

jobs:
  draft-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run exact-HEAD JUnit crossworld alias regressions
        run: gradle --no-daemon test --tests co.surumene.simplecoins.domain.WorldStorageCrossworldPhysicalAliasTest
