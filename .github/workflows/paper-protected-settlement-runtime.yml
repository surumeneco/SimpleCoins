name: A01 real Paper scheduled protected settlement handoff
on:
  pull_request:
    branches: [develop]
    paths:
      - 'tests/paper-protected-settlement-runtime/**'
      - 'src/main/java/co/surumene/simplecoins/domain/SettlementRuntime.java'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperProtectedSettlementService.java'
      - 'src/main/java/co/surumene/simplecoins/SimpleCoinsPlugin.java'
      - '.github/workflows/paper-protected-settlement-runtime.yml'
permissions:
  contents: read
jobs:
  real-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/MineCraftXPlayServer
          ref: 06eb7bc874b8d2851f40ed4a290e27532e01ccdf
          path: pinned-server
          sparse-checkout: |
            plugins/InvSee++.jar
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify distributed InvSee++ blob
        run: |
          test "$(git hash-object 'pinned-server/plugins/InvSee++.jar')" = "04a115169778896076fba497c9c37e2d58bcf1f1"
          unzip -p 'pinned-server/plugins/InvSee++.jar' plugin.yml | grep -F 'name: InvSeePlusPlus'
      - name: Build actual product and isolated scheduler probe
        run: |
          gradle --no-daemon test :admission-guard:test jar :admission-guard:jar
          gradle --no-daemon -p tests/paper-protected-settlement-runtime jar
          python3 tools/simplecoins_preflight.py admission-guard/build/libs/admission-guard-1.0.0.jar build/libs/SimpleCoins-1.0.0.jar
      - name: Download and hash-verify official Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-A02-Probe/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' -o smoke/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) echo "Unexpected Paper URL" >&2; exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke/paper.jar
          printf '%s  %s\n' "$sha" smoke/paper.jar | sha256sum -c -
      - name: Install only disposable Paper plugins
        id: install-fixture
        shell: bash
        run: |
          set -euo pipefail
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke/plugins/SimpleCoins.jar
          cp tests/paper-protected-settlement-runtime/build/libs/SimpleCoinsProtectedSettlementProbe.jar smoke/plugins/RuntimeProbe.jar
          cp 'pinned-server/plugins/InvSee++.jar' smoke/plugins/InvSeePlusPlus.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25598\n' > smoke/server.properties
      - name: Run actual Paper scheduler and saved source handoff
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          timeout 180 java -Xms256M -Xmx1024M -jar paper.jar nogui </dev/null > paper.log 2>&1 || { tail -150 paper.log; exit 1; }
          grep -F 'PAPER_A01_RUNTIME_SETTLEMENT_HANDOFF_PASSED' paper.log
          grep -F 'PAPER_DYNAMIC_OWNER_BAN_DELETE_RESTORE_PASSED total=5000' paper.log
          grep -F 'PAPER_DYNAMIC_IP_BAN_OVERRIDE_PASSED total=5000' paper.log
          grep -F 'PAPER_DEAD_PLAYER_LOCATION_MOVEMENT_PASSED' paper.log
          grep -F 'PAPER_A02_MINIMAL_PLAYER_GRANT_PARTIAL_PASSED total=5064 remaining=1' paper.log
          grep -F 'PAPER_NORMAL_INVSEE_SAVE_PRESERVES_RECEIPT total=5000' paper.log
          grep -F 'PAPER_NORMAL_TRADER_SPAWN_PASSED' paper.log || { tail -150 paper.log; exit 1; }
          if grep -Fq 'PAPER_A01_RUNTIME_SETTLEMENT_FAILED' paper.log; then tail -150 paper.log; exit 1; fi
          timeout 180 java -Da02.liveGrantReload=true -Xms256M -Xmx1024M -jar paper.jar nogui </dev/null > paper-reload.log 2>&1 || { tail -150 paper-reload.log; exit 1; }
          grep -F 'PAPER_NORMAL_INVSEE_SAVE_PRESERVES_RECEIPT total=5064' paper-reload.log || { tail -150 paper-reload.log; exit 1; }
          grep -F 'PAPER_A02_MINIMAL_PLAYER_GRANT_RESTART_PASSED total=5065 pending=0' paper-reload.log
          if grep -Fq 'PAPER_A01_RUNTIME_SETTLEMENT_FAILED' paper-reload.log; then tail -150 paper-reload.log; exit 1; fi
      - name: Recover actual grant after abrupt JVM exit before ACK
        if: ${{ !cancelled() && steps.install-fixture.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-crash/plugins
          cp smoke/paper.jar smoke-crash/paper.jar
          cp smoke/plugins/*.jar smoke-crash/plugins/
          cp smoke/eula.txt smoke/server.properties smoke-crash/
          cd smoke-crash
          set +e
          timeout 180 java -Da02.liveGrantCrash=true -Xms256M -Xmx1024M -jar paper.jar nogui </dev/null > paper-crash.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 73 ]; then tail -150 paper-crash.log; exit 1; fi
          grep -F 'PAPER_A02_ACTUAL_GRANT_SAVED_BEFORE_ACK_HALT total=5064 ledgerFloor=0' paper-crash.log
          timeout 180 java -Da02.liveGrantReload=true -Da02.liveGrantCrashReload=true -Xms256M -Xmx1024M -jar paper.jar nogui </dev/null > paper-crash-reload.log 2>&1 || { tail -150 paper-crash-reload.log; exit 1; }
          grep -F 'PAPER_NORMAL_INVSEE_SAVE_PRESERVES_RECEIPT total=5064' paper-crash-reload.log || { tail -150 paper-crash-reload.log; exit 1; }
          grep -F 'PAPER_A02_MINIMAL_PLAYER_GRANT_RESTART_PASSED total=5065 pending=0' paper-crash-reload.log
          if grep -Fq 'PAPER_A01_RUNTIME_SETTLEMENT_FAILED' paper-crash-reload.log; then tail -150 paper-crash-reload.log; exit 1; fi
      - name: Build pinned Java 26.2 protocol fixture client
        if: ${{ !cancelled() && steps.install-fixture.outcome == 'success' }}
        id: build-client
        run: gradle --no-daemon -p tests/paper-protected-settlement-runtime/client installDist
      - name: Actual loopback JE join, IP capture and retained InvSee grant save
        if: ${{ !cancelled() && steps.build-client.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-network/plugins
          cp smoke/paper.jar smoke-network/paper.jar
          cp smoke/plugins/*.jar smoke-network/plugins/
          cp smoke/eula.txt smoke/server.properties smoke-network/
          printf 'enforce-secure-profile=false\n' >> smoke-network/server.properties
          python3 - <<'PYTHON'
          import hashlib,json,uuid,pathlib
          raw=bytearray(hashlib.md5(b"OfflinePlayer:ProbeSettlement").digest());raw[6]=(raw[6]&15)|48;raw[8]=(raw[8]&63)|128
          pathlib.Path("smoke-network/whitelist.json").write_text(json.dumps([{"uuid":str(uuid.UUID(bytes=bytes(raw))),"name":"ProbeSettlement"}]))
          PYTHON
          client="$PWD/tests/paper-protected-settlement-runtime/client/build/install/simplecoins-network-fixture/bin/simplecoins-network-fixture"
          cd smoke-network
          mkdir -p plugins/SimpleCoins
          unzip -p plugins/SimpleCoins.jar config.yml > plugins/SimpleCoins/config.yml
          sed -i "s@public-url: ''@public-url: 'http://127.0.0.1:25599/SimpleCoins-java.zip'@" plugins/SimpleCoins/config.yml
          python3 -m http.server 25599 --bind 127.0.0.1 --directory plugins/SimpleCoins > pack-http.log 2>&1 &
          http=$!
          timeout 160 java -Da02.livePackProbe=true -Da02.liveClientProbe=true -Xms256M -Xmx1024M -jar paper.jar nogui </dev/null > paper-network.log 2>&1 &
          server=$!
          trap 'kill "$server" "$http" 2>/dev/null || true' EXIT
          for i in $(seq 1 70); do
            grep -Fq 'PAPER_NETWORK_GRANT_FIXTURE_READY' paper-network.log && break
            kill -0 "$server" 2>/dev/null || { tail -150 paper-network.log; exit 1; }
            sleep 1
          done
          grep -F 'PAPER_NETWORK_GRANT_FIXTURE_READY' paper-network.log || { tail -150 paper-network.log; exit 1; }
          timeout 75 "$client" --require-pack > client.log 2>&1 || { cat client.log; tail -150 paper-network.log; exit 1; }
          wait "$server" || { tail -150 paper-network.log; exit 1; }
          grep -F 'NETWORK_CLIENT_PLAY_LOGIN' client.log
          grep -Fx 'NETWORK_JAVA_PACK_HTTP_HASH_AND_NINE_MODELS_PASSED' client.log
          grep -F 'GET /SimpleCoins-java.zip HTTP/1.1" 200' pack-http.log
          test "$(grep -Fc 'SIMPLECOINS_JAVA_PACK_REQUESTED player=' paper-network.log)" = 1
          grep -F 'SIMPLECOINS_JAVA_PACK_STATUS player=' paper-network.log | grep -F 'status=DOWNLOADED'
          grep -F 'PAPER_INVSEE_OFFLINE_MONEY_JOURNAL_PASSED 5000->5100->5000' paper-network.log
          grep -F 'PAPER_NETWORK_GRANT_JOIN_AND_IP_PASSED total=5064 pending=1' paper-network.log
          grep -F 'PAPER_NETWORK_RETAINED_INVSEE_SAVE_PASSED total=5064' paper-network.log
          if grep -Fq 'PAPER_A01_RUNTIME_SETTLEMENT_FAILED' paper-network.log; then tail -150 paper-network.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-paper-protected-settlement-runtime
          path: |
            smoke/paper*.log
            smoke-crash/paper*.log
            smoke-network/paper*.log
            smoke-network/client.log
            smoke-network/pack-http.log
