name: A01 shared writer epoch fence bounded product primitive
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.a01.shared-writer-epoch-fence.md'
      - 'src/main/java/co/surumene/simplecoins/domain/WriterEpochFence.java'
      - 'src/test/java/co/surumene/simplecoins/domain/WriterEpochFenceTest.java'
      - '.github/workflows/a01-shared-writer-epoch-fence.yml'
permissions:
  contents: read
jobs:
  writer-fence-bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-runtime
          persist-credentials: false
      - name: Verify confirmed A01 source model and bounded Work structure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C cat-runtime rev-parse HEAD)" = 896cae8313a533a3c74073a8c3150daad314ff90
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work Lifecycle/Works/simplecoins.a01.shared-writer-epoch-fence.md
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work Lifecycle/Works/simplecoins.a01.shared-writer-epoch-fence.md
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind model --work Lifecycle/Works/simplecoins.a01.shared-writer-epoch-fence.md
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work Lifecycle/Works/simplecoins.a01.shared-writer-epoch-fence.md
      - name: Execute real JUnit 5 and verify production jar contains the primitive
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon test --tests co.surumene.simplecoins.domain.WriterEpochFenceTest jar
          unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fx 'co/surumene/simplecoins/domain/WriterEpochFence.class'
