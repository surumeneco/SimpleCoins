name: Chat verified project-source transport
on:
  push:
    branches: [infra/chat-task002-snapshot-20261109]
permissions:
  contents: read
jobs:
  fixed-source:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only checkout at fixed SHA
        uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: e7a7675a9d428ff3bd575074611f726ce0b46e01
          path: snapshot
          fetch-depth: 1
          persist-credentials: false
      - name: Verify revision and archive without running project code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C snapshot rev-parse HEAD)" = "e7a7675a9d428ff3bd575074611f726ce0b46e01"
          printf 'repository=surumeneco/SimpleCoins\nsha=e7a7675a9d428ff3bd575074611f726ce0b46e01\n' > snapshot-manifest.txt
          git -C snapshot archive --format=tar HEAD | gzip -n > project-snapshot.tar.gz
          sha256sum project-snapshot.tar.gz
      - name: Upload for Chat connector retrieval
        uses: actions/upload-artifact@v4
        with:
          name: project-snapshot-e7a7675a
          path: |
            project-snapshot.tar.gz
            snapshot-manifest.txt
          if-no-files-found: error
          retention-days: 1
