name: Phase 5 BAN null CAT Draft syntax verification
on:
  push:
    branches:
      - feature/phase5-ban-null-declaration-boundary-20261103-queue-b
    paths:
      - docs/cat/phase5-ban-null-declaration-observation.md
      - .github/workflows/verify-phase5-ban-null-draft.yml
permissions:
  contents: read
jobs:
  cat-draft-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: surumeneco/CAT-TDD
          ref: ee929dfa655d0dd738692990bebe7f5de77e4f31
          path: cat-tdd
          persist-credentials: false
      - name: Canonical CAT Draft syntax lint
        run: |
          python3 cat-tdd/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py --files docs/cat/phase5-ban-null-declaration-observation.md
      - name: Evidence boundary
        run: echo "Draft syntax only; no semantic confirmation or process/model/implementation Gate." >> "$GITHUB_STEP_SUMMARY"
