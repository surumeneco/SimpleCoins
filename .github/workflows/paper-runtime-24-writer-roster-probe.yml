name: A01 official Paper full 24-JAR runtime plugin roster observation
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.a01.actual-loaded-writer-roster.md'
      - 'tests/paper-runtime-writer-roster-probe/**'
      - '.github/workflows/paper-runtime-24-writer-roster-probe.yml'
permissions:
  contents: read
jobs:
  observe-distributed-plugin-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate existing scoped Work structure (not formal CAT Gate)
        shell: bash
        run: |
          set -euo pipefail
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a01.actual-loaded-writer-roster.md
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/MineCraftXPlayServer
          ref: 90aa2d0e0a5ea80c705fd67d717f463decaf2a32
          path: pinned-server
          sparse-checkout: |
            plugins
          persist-credentials: false
      - name: Derive every descriptor ID and expected bytes from pinned 24 distributable JARs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-server rev-parse HEAD)" = \
            '90aa2d0e0a5ea80c705fd67d717f463decaf2a32'
          python - <<'PY'
          import hashlib
          import re
          import zipfile
          from pathlib import Path
          root = Path('pinned-server/plugins')
          jars = sorted(root.glob('*.jar'), key=lambda p: p.name)
          assert len(jars) == 24, f'Expected 24 package members; got {len(jars)}'
          observed = set()
          rows = []
          for jar in jars:
              with zipfile.ZipFile(jar) as archive:
                  ymls = [n for n in ('plugin.yml','paper-plugin.yml')
                          if n in archive.namelist()]
                  assert ymls, f'Missing Paper descriptor in {jar.name}'
                  sources = [archive.read(name).decode('utf-8')
                             for name in ymls]
              matchsets = []
              for source in sources:
                  matches = re.findall(
                      r'''(?m)^\s*name:\s*['"]?([A-Za-z][A-Za-z0-9_+.-]*)['"]?\s*(?:#.*)?$''',
                      source)
                  matchsets.extend(matches)
              ids = set(matchsets)
              assert len(ids) == 1, f'Ambiguous plugin ID in {jar.name}: {ids}'
              name = next(iter(ids))
              assert name not in observed, f'Duplicate plugin ID {name}'
              observed.add(name)
              raw = jar.read_bytes()
              rows.append((jar.name, name, hashlib.sha256(raw).hexdigest(), len(raw)))
              print('A01_DISTRIBUTION_PLUGIN_DESCRIPTOR',jar.name,name)
          Path('expected-24-plugin-roster.tsv').write_text(
              ''.join('\t'.join(map(str, row))+'\n' for row in rows),
              encoding='utf-8')
          print('A01_EXACT_24_PINNED_PLUGIN_DESCRIPTORS_OBSERVED')
          PY
      - name: Build actual product, independent default-deny guard and disposable roster observer
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon test :admission-guard:test jar :admission-guard:jar
          gradle --no-daemon -p tests/paper-runtime-writer-roster-probe jar
          python tools/simplecoins_preflight.py \
            admission-guard/build/libs/admission-guard-1.0.0.jar \
            build/libs/SimpleCoins-1.0.0.jar
          test -s tests/paper-runtime-writer-roster-probe/build/libs/SimpleCoinsRuntimeRosterProbe.jar
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fq RuntimeWriterRosterProbe.class; then
            echo 'Test observer was inadvertently packaged in the product' >&2
            exit 1
          fi
      - name: Download SHA256 verified official Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-A01-FullRuntimeRoster/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' \
            -o smoke/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke/paper.jar
          printf '%s  %s\n' "$sha" smoke/paper.jar | sha256sum -c -
      - name: Start all 24 pinned plugins and record actual enabled-disabled-missing results
        shell: bash
        run: |
          set -euo pipefail
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke/plugins/SimpleCoins.jar
          cp tests/paper-runtime-writer-roster-probe/build/libs/SimpleCoinsRuntimeRosterProbe.jar smoke/plugins/RuntimeRosterProbe.jar
          cp pinned-server/plugins/*.jar smoke/plugins/
          test "$(find smoke/plugins -maxdepth 1 -name '*.jar' | wc -l)" -eq 27
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25596\n' > smoke/server.properties
          required=$(cut -f2 expected-24-plugin-roster.tsv | paste -sd, -)
          cd smoke
          set +e
          timeout --signal=TERM --kill-after=10s 240s \
            java -Da01.runtimeRoster.distributionObservation=true \
              -Da01.requiredPluginIds="$required" -Xms256M -Xmx2048M \
              -jar paper.jar nogui </dev/null > paper-a01-full-roster.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "Official Paper full-plugin observation exit $code" >&2
            tail -180 paper-a01-full-roster.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a01-full-roster.log
          grep -F 'A01_FULL_DISTRIBUTION_PLUGIN_OBSERVATION expected=24' paper-a01-full-roster.log
          grep -F 'A01_RUNTIME_ROSTER_POINT_IN_TIME_OBSERVED' paper-a01-full-roster.log
          if grep -Eq 'A01_RUNTIME_ROSTER_PROBE_FAILED|A01_RUNTIME_ROSTER_INVALID_ISOLATION' paper-a01-full-roster.log; then
            tail -180 paper-a01-full-roster.log
            exit 1
          fi
      - name: Verify every pinned descriptor has exactly one runtime status and source identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          raw = Path('smoke/paper-a01-full-roster.log').read_text(encoding='utf-8')
          rows = []
          for line in Path('expected-24-plugin-roster.tsv').read_text(encoding='utf-8').splitlines():
              name, plugin_id, sha, size = line.split('\t')
              rows.append((name,plugin_id,sha,int(size)))
          assert len(rows) == 24
          statuses = []
          for name, plugin_id, expected_sha, expected_size in rows:
              expr = (r'A01_RUNTIME_WRITER_PLUGIN_ENABLED name=' + re.escape(plugin_id)
                      + r' version=\S+ source=(\S+) sha256=([0-9a-f]{64}) bytes=(\d+)')
              enabled = re.findall(expr, raw)
              missing = re.findall(r'A01_RUNTIME_PACKAGED_PLUGIN_MISSING name='
                                   + re.escape(plugin_id) + r'(?![A-Za-z0-9_+.-])',raw)
              disabled = re.findall(r'A01_RUNTIME_PACKAGED_PLUGIN_DISABLED name='
                                    + re.escape(plugin_id) + r' version=\S+',raw)
              assert len(enabled)+len(missing)+len(disabled) == 1, plugin_id
              if enabled:
                  source, real_sha, real_bytes = enabled[0]
                  if source == name:
                      assert real_sha == expected_sha and int(real_bytes) == expected_size, plugin_id
                      identity = 'identical'
                  else:
                      identity = 'transformed_or_moved'
                  state = 'enabled'
              elif disabled:
                  identity = 'not_measured'
                  state = 'disabled'
              else:
                  identity = 'not_measured'
                  state = 'missing'
              statuses.append({'jar':name,'id':plugin_id,'state':state,
                               'codeSourceEquality':identity})
              print('A01_PINNED_RUNTIME_STATUS',plugin_id,state,identity)
          counts = {key: sum(entry['state'] == key for entry in statuses)
                    for key in ('enabled','missing','disabled')}
          print('A01_PINNED_24_RUNTIME_STATUS_TOTALS',json.dumps(counts,sort_keys=True))
          assert sum(counts.values()) == 24
          Path('runtime-24-plugin-roster.json').write_text(
              json.dumps({'kind':'ISOLATED_PAPER_24_PLUGIN_OBSERVATION_NOT_WRITER_CLOSURE',
                          'expected':24,'counts':counts,'plugins':statuses,
                          'admissionAllowed':False},indent=2,sort_keys=True)+'\n')
          print('A01_FULL_DISTRIBUTION_EACH_PLUGIN_STATUS_ACCOUNTED_NOT_ALL_WRITERS')
          PY
      - name: Save actual Paper 24-plugin observation and SHA roster evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-a01-runtime-24-plugin-roster
          path: |
            smoke/paper-a01-full-roster.log
            expected-24-plugin-roster.tsv
            runtime-24-plugin-roster.json
          retention-days: 14
          if-no-files-found: ignore
