name: Phase 7 GrantLedger replay overflow candidate verification
on:
  push:
    branches:
      - feature/phase7-grant-ledger-overflow-replay-red-20261103-queue-b
    paths:
      - src/test/java/co/surumene/simplecoins/domain/GrantLedgerOverflowReplayTest.java
      - docs/cat/phase7-grant-ledger-overflow-replay-candidate.md
      - .github/workflows/verify-phase7-overflow-candidate.yml
permissions:
  contents: read
jobs:
  expected-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run source-exact overflow candidate JUnit
        run: gradle --no-daemon test --tests co.surumene.simplecoins.domain.GrantLedgerOverflowReplayTest
  cat-draft-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: surumeneco/CAT-TDD
          ref: ee929dfa655d0dd738692990bebe7f5de77e4f31
          path: cat-tdd
          persist-credentials: false
      - name: Canonical CAT Draft syntax lint
        run: python3 cat-tdd/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py --files docs/cat/phase7-grant-ledger-overflow-replay-candidate.md
