name: Phase5 region coordinate boundary Draft regression

on:
  push:
    branches:
      - test/phase5-region-coordinate-bounds-20261104-queue-d
    paths:
      - 'docs/cat/SC-REGION-COORDINATE-BOUNDS-DRAFT.md'
      - 'src/test/java/co/surumene/simplecoins/domain/WorldStorageRegionCoordinateBoundaryTest.java'
      - '.github/workflows/task003-region-coordinate-bounds.yml'

permissions:
  contents: read

jobs:
  draft-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run exact-HEAD JUnit coordinate bounds
        run: gradle --no-daemon test --tests co.surumene.simplecoins.domain.WorldStorageRegionCoordinateBoundaryTest
