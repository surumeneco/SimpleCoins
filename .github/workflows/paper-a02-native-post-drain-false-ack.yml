name: A02 actual Paper native save after known InvSee drain causes stale-proof false ACK
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.a02.invsee-event-checkpoint-writer-drain.md'
      - 'tests/paper-invsee-writer-probe/**'
      - '.github/workflows/paper-a02-native-post-drain-false-ack.yml'
permissions:
  contents: read
jobs:
  actual-native-paper-writer-bypass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate existing issue Work structure, not a CAT Gate
        shell: bash
        run: |
          set -euo pipefail
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.invsee-event-checkpoint-writer-drain.md
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/MineCraftXPlayServer
          ref: 90aa2d0e0a5ea80c705fd67d717f463decaf2a32
          path: pinned-server
          sparse-checkout: |
            plugins/InvSee++.jar
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate actual pinned InvSee++ distribution SHA256
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-server rev-parse HEAD)" = '90aa2d0e0a5ea80c705fd67d717f463decaf2a32'
          printf '%s  %s\n' \
            '01f3e053a814f76d46513ebf65a38747df11df81c577d12bed108b353d7775f9' \
            'pinned-server/plugins/InvSee++.jar' | sha256sum -c -
      - name: Build actual SimpleCoins, independent deny guard and disposable Paper probe
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :test :admission-guard:test jar :admission-guard:jar
          gradle --no-daemon -p tests/paper-invsee-writer-probe jar
          python3 tools/simplecoins_preflight.py \
            admission-guard/build/libs/admission-guard-1.0.0.jar \
            build/libs/SimpleCoins-1.0.0.jar
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fq InvseeWriterProbe.class; then
            echo 'Test-only probe leaked into the production JAR' >&2
            exit 1
          fi
      - name: Obtain exact SHA256-verified official Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-false-ack/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-A02-NativePostDrainFalseACK/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' \
            -o smoke-false-ack/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke-false-ack/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke-false-ack/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke-false-ack/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke-false-ack/paper.jar
          printf '%s  %s\n' "$sha" smoke-false-ack/paper.jar | sha256sum -c -
          cp build/libs/SimpleCoins-1.0.0.jar smoke-false-ack/plugins/SimpleCoins.jar
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke-false-ack/plugins/SimpleCoinsGuard.jar
          cp pinned-server/plugins/InvSee++.jar smoke-false-ack/plugins/InvSeePlusPlus.jar
          cp tests/paper-invsee-writer-probe/build/libs/SimpleCoinsInvseeWriterProbe.jar smoke-false-ack/plugins/InvseeProbe.jar
          printf 'eula=true\n' > smoke-false-ack/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25598\n' \
            > smoke-false-ack/server.properties
      - name: Drain known admitted real InvSee Future then prove native save causes low-level false ACK
        shell: bash
        run: |
          set -euo pipefail
          cd smoke-false-ack
          set +e
          timeout --signal=TERM --kill-after=10s 190s \
            java -Da02.invsee.nativePostDrainFalseAck=true -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-post-drain-false-ack.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 142 ]; then
            echo "Unexpected first official Paper exit $code (expected Runtime.halt(142))" >&2
            tail -200 paper-a02-post-drain-false-ack.log
            exit 1
          fi
          if grep -Fq 'PAPER_A02_INVSEE_PROBE_FAILED' paper-a02-post-drain-false-ack.log; then
            tail -200 paper-a02-post-drain-false-ack.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-post-drain-false-ack.log
          grep -F 'PAPER_A02_INVSEE_REAL_SAVED_COIN_RECEIPT_PROOF_PASSED' paper-a02-post-drain-false-ack.log
          grep -F 'PAPER_A02_INVSEE_LATE_VETO_CLOSED_AFTER_FIRST_EVENT_ADMITTED' paper-a02-post-drain-false-ack.log
          grep -F 'PAPER_A02_INVSEE_ADMITTED_PRESERVING_WRITER_DRAINED_BEFORE_ACK' paper-a02-post-drain-false-ack.log
          grep -F 'PAPER_A02_INVSEE_SECOND_SAVE_VETOED_BEFORE_ACK' paper-a02-post-drain-false-ack.log
          grep -F 'PAPER_A02_INVSEE_DRAIN_FILE_DIR_FSYNC_FRESH_PROOF' paper-a02-post-drain-false-ack.log
          grep -F 'PAPER_A02_NATIVE_POST_DRAIN_OLD_SAVED_PROOF_WAS_VALID' paper-a02-post-drain-false-ack.log
          grep -F 'PAPER_A02_NATIVE_POST_DRAIN_WRITER_BYPASSED_INVSEE_EVENT' paper-a02-post-drain-false-ack.log
          grep -F 'PAPER_A02_NATIVE_POST_DRAIN_FRESH_PROOF_REJECTED_STALE_COIN' paper-a02-post-drain-false-ack.log
          grep -F 'PAPER_A02_NATIVE_POST_DRAIN_STALE_PROOF_FALSE_ACK_DURABLE' paper-a02-post-drain-false-ack.log
          grep -F 'PAPER_A02_NATIVE_POST_DRAIN_GUARD_STILL_DEFAULT_DENY' paper-a02-post-drain-false-ack.log
          grep -F 'PAPER_A02_NATIVE_POST_DRAIN_ABRUPT_HALT_AFTER_FALSE_ACK' paper-a02-post-drain-false-ack.log
          if grep -Fq 'PAPER_A02_INVSEE_ONE_DURABLE_ACK_AFTER_KNOWN_WRITER_DRAIN' paper-a02-post-drain-false-ack.log; then
            echo 'Expected negative case took positive control ACK branch' >&2
            exit 1
          fi
      - name: Cold official Paper JVM recovers original coinless playerdata with false durable ACK
        shell: bash
        run: |
          set -euo pipefail
          cd smoke-false-ack
          set +e
          timeout --signal=TERM --kill-after=10s 190s \
            java -Da02.invsee.checkNativePostDrainFalseAck=true -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-post-drain-false-ack-restart.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "Unexpected cold Paper exit $code" >&2
            tail -200 paper-a02-post-drain-false-ack-restart.log
            exit 1
          fi
          if grep -Fq 'PAPER_A02_INVSEE_PROBE_FAILED' paper-a02-post-drain-false-ack-restart.log; then
            tail -200 paper-a02-post-drain-false-ack-restart.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-post-drain-false-ack-restart.log
          grep -F 'PAPER_A02_NATIVE_POST_DRAIN_FALSE_ACK_COLD_RESTART_COINLESS_DELIVERED_ONE' paper-a02-post-drain-false-ack-restart.log
          grep -F 'PAPER_A02_NATIVE_POST_DRAIN_RESTART_GUARD_STILL_DEFAULT_DENY' paper-a02-post-drain-false-ack-restart.log
          echo 'A02_INVSEE_KNOWN_WRITER_DRAIN_CANNOT_PREVENT_NATIVE_PAPER_POST_PROOF_WRITE_FALSE_ACK'
      - name: Preserve both real Paper technical logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a02-real-paper-native-post-drain-false-ack
          path: smoke-false-ack/*.log
          retention-days: 14
          if-no-files-found: ignore
