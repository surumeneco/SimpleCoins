name: Chat isolated CAT Work verification
on:
  push:
    branches:
      - infra/chat-validate-a02-20261115
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: 928d31ee81443bd7a8c9b5729c5011fac6824495
          path: simplecoins
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: e368e9b5e00bb757e3c2e46e2b506cf51110f7ca
          path: cat
          persist-credentials: false
      - name: Run canonical latest CAT Work validation, no writes
        run: |
          python cat/.cat-system/scripts/cat_flow.py validate --work simplecoins/Lifecycle/Works/simplecoins.a02.paper-save-commit-verification.md
