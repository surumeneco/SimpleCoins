name: A01 atomic writer-sealed publication
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.a01.atomic-sealed-publication.md'
      - 'Lifecycle/Works/simplecoins.a01.normal-journal-handoff.md'
      - 'Lifecycle/Works/simplecoins.a01.runtime-settlement-handoff.md'
      - 'src/main/java/co/surumene/simplecoins/domain/SettlementRuntime.java'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperProtectedSettlementService.java'
      - 'src/test/java/co/surumene/simplecoins/domain/SettlementRuntime*.java'
      - 'src/main/java/co/surumene/simplecoins/domain/NormalSettlementSession.java'
      - 'src/main/java/co/surumene/simplecoins/domain/NormalMutationJournal.java'
      - 'src/main/java/co/surumene/simplecoins/domain/SettlementSnapshotPublisher.java'
      - 'src/main/java/co/surumene/simplecoins/domain/WriterEpochFence.java'
      - 'src/main/java/co/surumene/simplecoins/domain/SettlementProtectedPublisher.java'
      - 'src/test/java/co/surumene/simplecoins/domain/SettlementProtectedPublisherTest.java'
      - '.github/workflows/a01-atomic-sealed-publication.yml'
permissions:
  contents: read
jobs:
  atomic-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: d42557a7b8318925f172b401d4e2bf55c4d230c7
          path: cat-runtime
          persist-credentials: false
      - name: Verify approved A01 Process/model from exact CAT runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C cat-runtime rev-parse HEAD)" = 'd42557a7b8318925f172b401d4e2bf55c4d230c7'
          work=Lifecycle/Works/simplecoins.a01.atomic-sealed-publication.md
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind vectors --work "$work"
          work=Lifecycle/Works/simplecoins.a01.normal-journal-handoff.md
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind vectors --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind queue --work "$work"
          python cat-runtime/.cat-system/scripts/cat_compile_v2.py tests \
            Lifecycle/Works/.cat-flow/cache/a01-handoff-model.json \
            Lifecycle/Works/.cat-flow/cache/a01-handoff-vectors.json \
            tests/cat/a01-writer-epoch-junit-binding.json \
            --queue Lifecycle/Works/.cat-flow/cache/a01-handoff-queue.json \
            --framework junit --process docs/cat/confirmed/a01-writer-epoch-publication-process.md \
            --pi docs/cat/confirmed/a01-writer-epoch-publication-pi.md \
            --tce docs/cat/confirmed/a01-writer-epoch-publication-tce.md \
            -o Lifecycle/Works/.cat-flow/generated/A01HandoffGeneratedTest.java
          python - <<'PY'
          from pathlib import Path
          src = Path('Lifecycle/Works/.cat-flow/generated/A01HandoffGeneratedTest.java').read_bytes()
          assert src.count(b'@Test') == 1
          lines = src.decode().splitlines()
          pkg = next(x[8:-1] for x in lines if x.startswith('package '))
          klass = next(x[len('final class '):].split()[0] for x in lines if x.startswith('final class '))
          target = Path('src/test/java') / pkg.replace('.', '/') / (klass + '.java')
          if target.exists():
              assert target.read_bytes() == src
          else:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(src)
          PY
      - name: Atomic publication with real accumulator and concurrent resumption
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :test --tests co.surumene.simplecoins.domain.SettlementProtectedPublisherTest --tests co.surumene.simplecoins.domain.SettlementRuntimeTest --tests '*GeneratedA01WriterEpochCase*'
          grep -F '<testsuite' build/test-results/test/TEST-co.surumene.simplecoins.domain.SettlementProtectedPublisherTest.xml
      - name: Full root domain and Paper adapter JUnit regression
        shell: bash
        run: gradle --no-daemon :test
      - name: Preserve CAT checks and Java test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a01-atomic-seal-publication-evidence
          path: |
            build/test-results/test/
            Lifecycle/Works/.cat-flow/
          retention-days: 14
          if-no-files-found: ignore
