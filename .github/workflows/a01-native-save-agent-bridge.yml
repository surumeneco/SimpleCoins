            echo 'PAPER_A01_REAL_CHEST_CLEAR_ALREADY_DENIED_WITHOUT_PHYSICAL_CHANGE'
          else
            echo 'Real Paper clear did not yield a verified classified result' >&2
            tail -160 agent-actual-clear.log
            exit 1
