            echo 'PAPER_A01_REAL_CHEST_CLEAR_PARTIAL_MONETARY_WRITER_OBSERVED'
          elif grep -Fq 'PAPER_A01_REAL_CHEST_CLEAR_SEALED_SEVEN_FAMILY_BYPASS_OBSERVED' agent-actual-clear.log; then
            echo 'PAPER_A01_REAL_CHEST_CLEAR_UNCOVERED_MONETARY_WRITER_OBSERVED'
