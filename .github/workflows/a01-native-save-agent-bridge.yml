name: A01 product writer bridge with Java 25 Agent native hook
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.a01.native-save-agent-bridge.md'
      - 'Lifecycle/Works/simplecoins.a01.wwc-www-owner-agent-writers.md'
      - 'Lifecycle/Works/simplecoins.a01.mainhand-equipment-agent-writer.md'
      - 'Lifecycle/Works/simplecoins.a01.writer-exception-failclosed.md'
      - 'Lifecycle/Works/simplecoins.a01.paper-additem-limited-fence-gap.md'
      - 'Lifecycle/Works/simplecoins.a01.paper-removeitem-limited-fence-gap.md'
      - 'Lifecycle/Works/simplecoins.a01.craftinventory-additem-prebody.md'
      - 'Lifecycle/Works/simplecoins.a01.craftinventory-removeitem-prebody.md'
      - 'Lifecycle/Works/simplecoins.a01.paper-clear-limited-fence-gap.md'
      - 'Lifecycle/Works/simplecoins.a01.paper-clear-slot-limited-fence-gap.md'
      - 'Lifecycle/Works/simplecoins.a01.real-hopper-native-writer-boundary.md'
      - 'tests/paper-wcl-services-probe/src/main/java/co/surumene/simplecoins/a05probe/**'
      - 'Lifecycle/Works/simplecoins.a01.paper-pdc-inventory-agent-writers.md'
      - 'src/main/java/co/surumene/simplecoins/domain/PaperNativeSaveFenceAdapter.java'
      - 'src/main/java/co/surumene/simplecoins/SimpleCoinsPlugin.java'
      - 'src/test/java/co/surumene/simplecoins/domain/PaperNativeSaveFenceAdapterTest.java'
      - 'writer-fence-agent/**'
      - '.github/workflows/a01-native-save-agent-bridge.yml'
permissions:
  contents: read
jobs:
  product-bootstrap-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-runtime
          persist-credentials: false
      - name: Verify Confirmed A01 Process and Model on this Work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C cat-runtime rev-parse HEAD)" = '896cae8313a533a3c74073a8c3150daad314ff90'
          work=Lifecycle/Works/simplecoins.a01.native-save-agent-bridge.md
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          work=Lifecycle/Works/simplecoins.a01.paper-pdc-inventory-agent-writers.md
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          work=Lifecycle/Works/simplecoins.a01.wwc-www-owner-agent-writers.md
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          work=Lifecycle/Works/simplecoins.a01.mainhand-equipment-agent-writer.md
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          work=Lifecycle/Works/simplecoins.a01.writer-exception-failclosed.md
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work Lifecycle/Works/simplecoins.a01.paper-additem-limited-fence-gap.md
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work Lifecycle/Works/simplecoins.a01.paper-removeitem-limited-fence-gap.md
          work=Lifecycle/Works/simplecoins.a01.craftinventory-additem-prebody.md
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          work=Lifecycle/Works/simplecoins.a01.craftinventory-removeitem-prebody.md
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work Lifecycle/Works/simplecoins.a01.paper-clear-limited-fence-gap.md
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work Lifecycle/Works/simplecoins.a01.paper-clear-slot-limited-fence-gap.md
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work Lifecycle/Works/simplecoins.a01.real-hopper-native-writer-boundary.md
      - name: Execute product JUnit, build product and separate actual Java Agent jars
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :test --tests co.surumene.simplecoins.domain.PaperNativeSaveFenceAdapterTest jar
          gradle --no-daemon -p writer-fence-agent classes testClasses jar bootstrapHookJar
          jar tf build/libs/SimpleCoins-1.0.0.jar | grep -Fx 'co/surumene/simplecoins/domain/PaperNativeSaveFenceAdapter.class'
          if jar tf build/libs/SimpleCoins-1.0.0.jar | grep -Fq 'co/surumene/simplecoins/writeragent/'; then
            echo 'Bootstrap hook or Agent leaked into Paper plugin JAR' >&2
            exit 1
          fi
          agent=writer-fence-agent/build/libs/SimpleCoinsWriterFenceAgent.jar
          hook=writer-fence-agent/build/libs/SimpleCoinsWriterFenceBootstrap.jar
          jar tf "$agent" | grep -Fx 'co/surumene/simplecoins/writeragent/PaperNativeWriterAgent.class'
          if jar tf "$agent" | grep -Fq '/WriterEpochHook.class'; then
            echo 'Bootstrap hook accidentally packaged in system-loader Agent' >&2
            exit 1
          fi
          jar tf "$hook" | grep -Fx 'co/surumene/simplecoins/writeragent/WriterEpochHook.class'
          python -c 'import sys, zipfile; raw=zipfile.ZipFile(sys.argv[1]).read("META-INF/MANIFEST.MF").decode("utf-8"); unfolded=raw.replace("\r\n ", "").replace("\n ", ""); assert "Premain-Class: co.surumene.simplecoins.writeragent.PaperNativeWriterAgent" in unfolded' "$agent"
          if grep -Fq 'nativeWriterFence.arm(' src/main/java/co/surumene/simplecoins/SimpleCoinsPlugin.java; then
            echo 'Product bootstrap must not arm incomplete writer universe' >&2
            exit 1
          fi
      - name: Run real transformed bytecode and child-classloader product callbacks
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          java -Dsimplecoins.writerAgent.bootstrapJar="$root/writer-fence-agent/build/libs/SimpleCoinsWriterFenceBootstrap.jar" \
            -javaagent:"$root/writer-fence-agent/build/libs/SimpleCoinsWriterFenceAgent.jar" \
            -cp "$root/writer-fence-agent/build/classes/java/test" \
            co.surumene.simplecoins.writeragent.AgentBridgeIsolationMain \
            "$root/build/libs/SimpleCoins-1.0.0.jar" \
            | tee writer-agent-bridge-result.log
          grep -F 'SIMPLECOINS_WRITER_AGENT_CRAFT_EXACT_ENTRY_INSTRUMENTED' writer-agent-bridge-result.log
          grep -F 'SIMPLECOINS_WRITER_AGENT_NMS_EXACT_ENTRY_INSTRUMENTED' writer-agent-bridge-result.log
          grep -F 'SIMPLECOINS_WRITER_AGENT_PDC_EXACT_ENTRY_INSTRUMENTED' writer-agent-bridge-result.log
          grep -F 'SIMPLECOINS_WRITER_AGENT_INVENTORY_EXACT_ENTRY_INSTRUMENTED' writer-agent-bridge-result.log
          grep -F 'SIMPLECOINS_WRITER_AGENT_WWC_EXACT_ENTRY_INSTRUMENTED' writer-agent-bridge-result.log
          grep -F 'SIMPLECOINS_WRITER_AGENT_WWW_EXACT_ENTRY_INSTRUMENTED' writer-agent-bridge-result.log
          grep -F 'SIMPLECOINS_WRITER_AGENT_EQUIPMENT_EXACT_ENTRY_INSTRUMENTED' writer-agent-bridge-result.log
          grep -F 'SIMPLECOINS_A01_CROSS_LOADER_NATIVE_AGENT_RED_GREEN_PASS' writer-agent-bridge-result.log
      - name: Require caught escaping native writer error to revoke bootstrap and product epoch
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          java -Dsimplecoins.writerAgent.bootstrapJar="$root/writer-fence-agent/build/libs/SimpleCoinsWriterFenceBootstrap.jar" \
            -javaagent:"$root/writer-fence-agent/build/libs/SimpleCoinsWriterFenceAgent.jar" \
            -cp "$root/writer-fence-agent/build/classes/java/test" \
            co.surumene.simplecoins.writeragent.AgentExceptionalExitMain \
            "$root/build/libs/SimpleCoins-1.0.0.jar" | tee writer-agent-exception-result.log
          grep -F 'SIMPLECOINS_A01_ESCAPING_NATIVE_WRITER_INVALIDATES_PRODUCT_PASS' writer-agent-exception-result.log
      - name: Boot actual official Paper 26.2 with passive product-bound Agent
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :admission-guard:jar
          mkdir -p smoke-native-agent/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-PassiveAgentSmoke/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' \
            -o smoke-native-agent/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke-native-agent/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke-native-agent/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke-native-agent/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke-native-agent/paper.jar
          printf '%s  %s\n' "$sha" smoke-native-agent/paper.jar | sha256sum -c -
          cp build/libs/SimpleCoins-1.0.0.jar smoke-native-agent/plugins/SimpleCoins.jar
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke-native-agent/plugins/SimpleCoinsGuard.jar
          printf 'eula=true\n' > smoke-native-agent/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25585\n' \
            > smoke-native-agent/server.properties
          cd smoke-native-agent
          mkfifo console.in
          java -Dsimplecoins.writerAgent.bootstrapJar="$GITHUB_WORKSPACE/writer-fence-agent/build/libs/SimpleCoinsWriterFenceBootstrap.jar" \
            -javaagent:"$GITHUB_WORKSPACE/writer-fence-agent/build/libs/SimpleCoinsWriterFenceAgent.jar" \
            -Xms256M -Xmx1024M -jar paper.jar nogui < console.in > agent-paper.log 2>&1 &
          server_pid=$!
          exec 3> console.in
          cleanup() {
            printf 'stop\n' >&3 2>/dev/null || true
            exec 3>&- || true
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 180); do
            if grep -Fq 'Done (' agent-paper.log; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Actual Paper terminated before startup' >&2
              tail -180 agent-paper.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Actual Paper startup exceeded bounded readiness interval' >&2
            tail -180 agent-paper.log
            exit 1
          fi
          grep -F 'SIMPLECOINS_WRITER_AGENT_BOOTSTRAP_INSTALLED_PASSIVE' agent-paper.log
          grep -F 'SIMPLECOINS_NATIVE_WRITER_BRIDGE_PASSIVE bound=true' agent-paper.log
          # Class loading is lazy. A missing startup marker means not yet observed,
          # never that the unexercised method family has been proved.
          grep -F 'SIMPLECOINS_WRITER_AGENT_PDC_EXACT_ENTRY_INSTRUMENTED' agent-paper.log || echo 'PDC not loaded in 0-player smoke'
          grep -F 'SIMPLECOINS_WRITER_AGENT_INVENTORY_EXACT_ENTRY_INSTRUMENTED' agent-paper.log || echo 'Inventory not loaded in 0-player smoke'
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' agent-paper.log
          grep -F 'Settlement engine not connected; player admission remains disabled.' agent-paper.log
          if grep -E 'SIMPLECOINS_WRITER_AGENT_.*TRANSFORM_FAILED' agent-paper.log; then
            echo 'Real Paper agent transformation failed' >&2
            exit 1
          fi
          printf 'stop\n' >&3
          exec 3>&-
          wait "$server_pid"
          trap - EXIT
          grep -F 'Saving worlds' agent-paper.log
          echo 'SIMPLECOINS_A01_REAL_PAPER_AGENT_BOOT_PASSIVE_PASS'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/MineCraftXPlayServer
          ref: 79e4afdbc530c9f8151c44bb390d06f7ff8fcf6e
          path: server-snapshot
          sparse-checkout: |
            plugins/WonderfulGenomeLib-1.0.1.jar
            plugins/WonderfulCoreLibrary-0.1.0.jar
            plugins/WhatAWonderfulChicken-2.1.1.jar
            plugins/WhatAWonderfulWolf-1.1.2.jar
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify actual distributed owner writer JARs and build independent Paper observer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C server-snapshot rev-parse HEAD)" = '79e4afdbc530c9f8151c44bb390d06f7ff8fcf6e'
          declare -A blobs=(
            [WonderfulGenomeLib-1.0.1.jar]='09acaf08b42cad7343de92de262518da2edec3f1'
            [WonderfulCoreLibrary-0.1.0.jar]='64ab60fc7f8b2ef07c4712d410c3f4d10f022698'
            [WhatAWonderfulChicken-2.1.1.jar]='77831eafab4d0fa55ae76d03e4249f69f472d1cf'
            [WhatAWonderfulWolf-1.1.2.jar]='27c137123ef99c2c11867e957671a65ac6170db8'
          )
          for jar in "${!blobs[@]}"; do
            f="server-snapshot/plugins/$jar"
            test "$(git hash-object "$f")" = "${blobs[$jar]}"
            unzip -tqq "$f"
          done
          gradle --no-daemon -p tests/paper-wcl-services-probe jar
          unzip -p tests/paper-wcl-services-probe/build/libs/SimpleCoinsWclServicesProbe.jar plugin.yml |
            grep -F 'name: SimpleCoinsWclServicesProbe'
      - name: Verify real WWC and WWW plugin-owned monetary writer execution under passive product Agent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-actual-owners/plugins
          cp smoke-native-agent/paper.jar smoke-actual-owners/paper.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke-actual-owners/plugins/SimpleCoins.jar
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke-actual-owners/plugins/SimpleCoinsGuard.jar
          cp server-snapshot/plugins/WonderfulGenomeLib-1.0.1.jar smoke-actual-owners/plugins/WonderfulGenomeLib.jar
          cp server-snapshot/plugins/WonderfulCoreLibrary-0.1.0.jar smoke-actual-owners/plugins/WonderfulCoreLibrary.jar
          cp server-snapshot/plugins/WhatAWonderfulChicken-2.1.1.jar smoke-actual-owners/plugins/WhatAWonderfulChicken.jar
          cp server-snapshot/plugins/WhatAWonderfulWolf-1.1.2.jar smoke-actual-owners/plugins/WhatAWonderfulWolf.jar
          cp tests/paper-wcl-services-probe/build/libs/SimpleCoinsWclServicesProbe.jar smoke-actual-owners/plugins/StorageProbe.jar
          printf 'eula=true\n' > smoke-actual-owners/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25586\n' > smoke-actual-owners/server.properties
          cd smoke-actual-owners
          set +e
          timeout --signal=TERM --kill-after=10s 210s \
            java -Dsimplecoins.writerAgent.bootstrapJar="$GITHUB_WORKSPACE/writer-fence-agent/build/libs/SimpleCoinsWriterFenceBootstrap.jar" \
              -javaagent:"$GITHUB_WORKSPACE/writer-fence-agent/build/libs/SimpleCoinsWriterFenceAgent.jar" \
              -Da01.moneyOwnerWriterProbe=true -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > agent-actual-owner.log 2>&1
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ]; then
            echo "Real Paper distributed owner writer smoke failed code=$exit_code" >&2
            tail -180 agent-actual-owner.log
            exit 1
          fi
          if grep -Fq 'PAPER_A05_SERVICES_PROBE_FAILED' agent-actual-owner.log; then
            tail -180 agent-actual-owner.log
            exit 1
          fi
          grep -F 'SIMPLECOINS_WRITER_AGENT_WWC_EXACT_ENTRY_INSTRUMENTED' agent-actual-owner.log
          grep -F 'SIMPLECOINS_WRITER_AGENT_WWW_EXACT_ENTRY_INSTRUMENTED' agent-actual-owner.log
          grep -F 'SIMPLECOINS_WRITER_AGENT_EQUIPMENT_EXACT_ENTRY_INSTRUMENTED' agent-actual-owner.log
          grep -F 'PAPER_A01_REAL_WWC_MONETARY_OWNER_WRITER_VALUE_INVARIANT_PASSED' agent-actual-owner.log
          grep -F 'PAPER_A01_REAL_WWW_MONETARY_COMMANDER_WRITER_VALUE_INVARIANT_PASSED' agent-actual-owner.log
          grep -F 'SIMPLECOINS_NATIVE_WRITER_BRIDGE_PASSIVE bound=true' agent-actual-owner.log
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' agent-actual-owner.log
          grep -F 'Settlement engine not connected; player admission remains disabled.' agent-actual-owner.log
          echo 'SIMPLECOINS_A01_REAL_WWC_WWW_AGENT_PASSIVE_OBSERVED_PASS'
      - name: Classify actual Paper Chest addItem behavior under sealed known seven-writer epoch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-actual-additem/plugins
          cp smoke-native-agent/paper.jar smoke-actual-additem/paper.jar
          cp smoke-actual-owners/plugins/*.jar smoke-actual-additem/plugins/
          printf 'eula=true\n' > smoke-actual-additem/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25587\n' \
            > smoke-actual-additem/server.properties
          cd smoke-actual-additem
          set +e
          timeout --signal=TERM --kill-after=10s 190s \
            java -Dsimplecoins.writerAgent.bootstrapJar="$GITHUB_WORKSPACE/writer-fence-agent/build/libs/SimpleCoinsWriterFenceBootstrap.jar" \
              -javaagent:"$GITHUB_WORKSPACE/writer-fence-agent/build/libs/SimpleCoinsWriterFenceAgent.jar" \
              -Da01.inventoryAddItemClosureProbe=true -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > agent-actual-additem.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] || grep -Fq 'PAPER_A01_REAL_CHEST_ADDITEM_CLOSURE_PROBE_FAILED' agent-actual-additem.log; then
            echo "Real Paper addItem classification failed code=$status" >&2
            tail -220 agent-actual-additem.log
            exit 1
          fi
          grep -F 'SIMPLECOINS_WRITER_AGENT_BOOTSTRAP_INSTALLED_PASSIVE' agent-actual-additem.log
          grep -F 'SIMPLECOINS_NATIVE_WRITER_BRIDGE_PASSIVE bound=true' agent-actual-additem.log
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' agent-actual-additem.log
          for target in CRAFT NMS PDC INVENTORY EQUIPMENT WWC WWW; do
            grep -F "SIMPLECOINS_WRITER_AGENT_${target}_EXACT_ENTRY_INSTRUMENTED" agent-actual-additem.log
          done
          if grep -Fq 'PAPER_A01_REAL_CHEST_ADDITEM_SEALED_SEVEN_FAMILY_BYPASS_OBSERVED' agent-actual-additem.log \
              || grep -Fq 'PAPER_A01_REAL_CHEST_ADDITEM_PARTIAL_MUTATION_BEFORE_COVERED_HOOK_REFUSAL' agent-actual-additem.log; then
            echo 'Real Paper addItem still mutates currency with sealed product epoch' >&2
            tail -160 agent-actual-additem.log
            exit 1
          fi
          grep -F 'PAPER_A01_REAL_CHEST_ADDITEM_INTERCEPTED count=1' agent-actual-additem.log
          echo 'PAPER_A01_REAL_CHEST_ADDITEM_PREBODY_ENTRY_DENY_5000C_UNCHANGED_PASS'
      - name: Classify real Paper Chest removeItem under sealed known writer epoch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-actual-removeitem/plugins
          cp smoke-native-agent/paper.jar smoke-actual-removeitem/paper.jar
          cp smoke-actual-owners/plugins/*.jar smoke-actual-removeitem/plugins/
          printf 'eula=true\n' > smoke-actual-removeitem/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25588\n' \
            > smoke-actual-removeitem/server.properties
          cd smoke-actual-removeitem
          set +e
          timeout --signal=TERM --kill-after=10s 190s \
            java -Dsimplecoins.writerAgent.bootstrapJar="$GITHUB_WORKSPACE/writer-fence-agent/build/libs/SimpleCoinsWriterFenceBootstrap.jar" \
              -javaagent:"$GITHUB_WORKSPACE/writer-fence-agent/build/libs/SimpleCoinsWriterFenceAgent.jar" \
              -Da01.inventoryRemoveItemClosureProbe=true -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > agent-actual-removeitem.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] || grep -Fq 'PAPER_A01_REAL_CHEST_REMOVEITEM_CLOSURE_PROBE_FAILED' agent-actual-removeitem.log; then
            echo "Real Paper removeItem classification failed code=$status" >&2
            tail -200 agent-actual-removeitem.log
            exit 1
          fi
          grep -F 'SIMPLECOINS_WRITER_AGENT_BOOTSTRAP_INSTALLED_PASSIVE' agent-actual-removeitem.log
          grep -F 'SIMPLECOINS_NATIVE_WRITER_BRIDGE_PASSIVE bound=true' agent-actual-removeitem.log
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' agent-actual-removeitem.log
          grep -F 'PAPER_A01_REAL_REMOVEITEM_METHOD' agent-actual-removeitem.log
          for target in CRAFT NMS PDC INVENTORY EQUIPMENT WWC WWW; do
            grep -F "SIMPLECOINS_WRITER_AGENT_${target}_EXACT_ENTRY_INSTRUMENTED" agent-actual-removeitem.log
          done
          if grep -Fq 'PAPER_A01_REAL_CHEST_REMOVEITEM_PARTIAL_MUTATION_BEFORE_COVERED_HOOK_REFUSAL' agent-actual-removeitem.log \
              || grep -Fq 'PAPER_A01_REAL_CHEST_REMOVEITEM_SEALED_SEVEN_FAMILY_BYPASS_OBSERVED' agent-actual-removeitem.log; then
            echo 'Real Paper removeItem still mutates currency with sealed product epoch' >&2
            tail -160 agent-actual-removeitem.log
            exit 1
          fi
          grep -F 'PAPER_A01_REAL_CHEST_REMOVEITEM_INTERCEPTED count=2' agent-actual-removeitem.log
          echo 'PAPER_A01_REAL_CHEST_REMOVEITEM_PREBODY_ENTRY_DENY_5000C_UNCHANGED_PASS'
      - name: Classify real Paper Chest clear() under sealed known writer epoch
        shell: bash
        run: |
