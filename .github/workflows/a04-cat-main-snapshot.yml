name: A04 released CAT-TDD main read-only runtime snapshot
on:
  push:
    branches: [infra/a04-cat-main-runtime-20261120]
    paths: ['.github/workflows/a04-cat-main-snapshot.yml']
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: c56b1e1f46867dfe2e5ac655907a62ebbe86b74c
          persist-credentials: false
      - name: Archive exact released CAT runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'c56b1e1f46867dfe2e5ac655907a62ebbe86b74c'
          test "$(git rev-parse HEAD^{tree})" = '79ff90489fa85f654aae387261e47640eb3fbcdb'
          mkdir -p /tmp/cat-runtime
          git archive --format=tar HEAD | gzip -n > /tmp/cat-runtime/source.tar.gz
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('/tmp/cat-runtime/source.tar.gz')
          data={'repository':'surumeneco/CAT-TDD','commit':'c56b1e1f46867dfe2e5ac655907a62ebbe86b74c','tree':'79ff90489fa85f654aae387261e47640eb3fbcdb','archive_sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          pathlib.Path('/tmp/cat-runtime/manifest.json').write_text(json.dumps(data,sort_keys=True))
          print(data)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a04-cat-main-c56b1e
          path: /tmp/cat-runtime/
          if-no-files-found: error
          retention-days: 1
