name: Phase 5 source-container Draft regression
on:
  push:
    branches:
      - feature/phase5-source-container-shape-red-20261102-queue-d
    paths:
      - 'docs/cat/phase5-source-container-shape.md'
      - 'src/test/java/co/surumene/simplecoins/domain/WorldStorageSourceContainerShapeTest.java'
      - 'src/test/java/co/surumene/simplecoins/domain/WorldStorageNestedSourceShapeTest.java'
      - 'docs/cat/phase5-nested-source-shape.md'
      - '.github/workflows/phase5-source-container-shape.yml'
permissions:
  contents: read
jobs:
  draft-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: ee929dfa655d0dd738692990bebe7f5de77e4f31
          path: cat-tdd
          persist-credentials: false
      - name: CAT Draft syntax only, not normative Gate
        run: python3 cat-tdd/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py --files docs/cat/phase5-source-container-shape.md docs/cat/phase5-nested-source-shape.md
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Full Gradle JUnit regression
        run: gradle --no-daemon clean test jar
