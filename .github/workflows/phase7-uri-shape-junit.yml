name: Phase7 URI shape characterization JUnit
on:
  push:
    branches:
      - feature/phase7-resource-pack-uri-shape-characterization-20261105-queue-a
  workflow_dispatch:
jobs:
  targeted-junit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run exact URI shape JUnit
        run: gradle test --tests 'co.surumene.simplecoins.domain.ResourcePackUrlUriShapeCharacterizationTest' --no-daemon
