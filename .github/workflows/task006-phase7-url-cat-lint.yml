name: Task006 Phase7 CAT candidate syntax
on:
  push:
    branches:
      - test/phase7-pack-url-authority-20261104-chat-boost
  pull_request:
    paths:
      - docs/cat/phase7-resource-pack-url-authority-characterization.md
      - .github/workflows/task006-phase7-url-cat-lint.yml
  workflow_dispatch:
jobs:
  cat-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 9dec8c01feb86a4cb4c7f897875de9cffcb34817
          path: cat-contract
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate exact pinned CAT markdown contract (syntax only)
        run: >-
          python cat-contract/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py
          --files docs/cat/phase7-resource-pack-url-authority-characterization.md
