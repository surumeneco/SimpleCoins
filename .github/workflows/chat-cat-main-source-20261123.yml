name: Isolated Chat CAT released main source transfer 20261123
on:
  push:
    branches: ['infra/chat-a05-cat-check-20261123']
    paths: ['.github/workflows/chat-cat-main-source-20261123.yml']
permissions:
  contents: read
jobs:
  immutable-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: a6ff19bd0cfdb7a8b007f4df62e25f154acbe643
          path: upstream
          persist-credentials: false
      - name: Export exact release-version CAT subtree, no source edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = a6ff19bd0cfdb7a8b007f4df62e25f154acbe643
          test "$(git -C upstream rev-parse HEAD:.cat-system)" = eeb6cdbd008dedc261f1df380b92f8052be0c045
          mkdir -p transfer
          git -C upstream archive --format=tar HEAD .cat-system | gzip -n > transfer/cat-main-subtree.tar.gz
          printf '%s\n' 'surumeneco/CAT-TDD' 'a6ff19bd0cfdb7a8b007f4df62e25f154acbe643' 'eeb6cdbd008dedc261f1df380b92f8052be0c045' > transfer/identity.txt
          sha256sum transfer/cat-main-subtree.tar.gz transfer/identity.txt > transfer/hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cat-main-a6ff19-exact-runtime-20261123
          path: transfer/
          retention-days: 1
