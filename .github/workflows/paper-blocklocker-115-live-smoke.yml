name: Paper 26.2 BlockLocker 1.15 loaded ownership probe
on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/main/java/co/surumene/simplecoins/paper/BlockLockerLiveEvidence.java'
      - 'src/test/java/co/surumene/simplecoins/paper/BlockLockerLiveEvidenceTest.java'
      - 'src/test/java/co/surumene/simplecoins/paper/BlockLockerLiveProbe.java'
      - 'tests/paper-blocklocker-smoke/**'
      - 'Lifecycle/Works/simplecoins.a04.blocklocker-saved-sign-paper-source.md'
      - 'Lifecycle/Works/simplecoins.a04.blocklocker-saved-restart-evidence.md'
      - 'Lifecycle/Works/simplecoins.a04.live-blocklocker-owner-stage.md'
      - 'src/main/java/co/surumene/simplecoins/domain/LiveContainerPhysicalSlot.java'
      - 'src/test/java/co/surumene/simplecoins/domain/LiveContainerPhysicalSlotTest.java'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperBlockLockerLiveClassifier.java'
      - 'src/main/java/co/surumene/simplecoins/domain/BlockLockerSavedProfileResolution.java'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperSavedBlockLockerSignText.java'
      - 'src/test/java/co/surumene/simplecoins/domain/BlockLockerSavedProfileResolutionTest.java'
      - 'src/test/java/co/surumene/simplecoins/paper/PaperSavedBlockLockerSignTextTest.java'
      - 'src/test/java/co/surumene/simplecoins/paper/PaperSavedProfileAnvilFixtureTest.java'
      - 'Lifecycle/Works/simplecoins.a04.saved-effective-profile-readback.md'
      - 'src/test/java/co/surumene/simplecoins/paper/PaperBlockLockerLiveClassifierTest.java'
      - 'build.gradle.kts'
      - '.github/workflows/paper-blocklocker-115-live-smoke.yml'
jobs:
  read-only-v115:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate independent saved-sign verification Work structure
        run: |
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a04.blocklocker-saved-sign-paper-source.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a04.blocklocker-saved-restart-evidence.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a04.live-blocklocker-owner-stage.md
      - name: Test JUnit and build three disjoint plugin JARs
        run: |
          gradle --no-daemon clean test :admission-guard:test jar :admission-guard:jar paperBlockLockerLiveProbeJar
          python3 tools/simplecoins_preflight.py admission-guard/build/libs/admission-guard-1.0.0.jar build/libs/SimpleCoins-1.0.0.jar
          unzip -p build/libs/SimpleCoinsBlockLockerLiveProbe-1.0.0.jar plugin.yml | grep -F 'name: SimpleCoinsBlockLockerLiveProbe'
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -E 'nl/rutgerkok/blocklocker/|BlockLockerLiveProbe.class'; then
            echo 'BlockLocker API or test classes accidentally shipped' >&2
            exit 1
          fi
      - name: Download official pinned Paper and BlockLocker release JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-Paper-CI/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' -o smoke/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke/paper.jar
          printf '%s  %s\n' "$sha" smoke/paper.jar | sha256sum -c -
          curl -fLsS --retry 3 'https://github.com/rutgerkok/BlockLocker/releases/download/v1.15/blocklocker-1.15.jar' \
            -o smoke/plugins/blocklocker-1.15.jar
          echo '8e21655ce029c2fe17b62568b2fefbe24e90b98543dfe54990777529edc0b962  smoke/plugins/blocklocker-1.15.jar' \
            | sha256sum -c -
      - name: Observe real Paper loaded BlockLocker protected containers
        shell: bash
        run: |
          set -euo pipefail
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke/plugins/SimpleCoins.jar
          cp build/libs/SimpleCoinsBlockLockerLiveProbe-1.0.0.jar smoke/plugins/SimpleCoinsBlockLockerLiveProbe.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25572\n' > smoke/server.properties
          cd smoke
          mkfifo console.in
          java -Xms256M -Xmx1024M -jar paper.jar nogui < console.in > paper.log 2>&1 &
          pid=$!
          exec 3> console.in
          cleanup() {
            printf 'stop\n' >&3 2>/dev/null || true
            exec 3>&- || true
            kill "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 150); do
            if grep -Fq 'PAPER_BLOCKLOCKER_115_OWNER_FAILED' paper.log; then
              echo 'BlockLocker evidence probe failed' >&2
              tail -130 paper.log
              exit 1
            fi
            if grep -Fq 'PAPER_BLOCKLOCKER_115_OWNER_PASSED' paper.log && grep -Fq 'Done (' paper.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Server terminated before BlockLocker probe proof' >&2
              tail -130 paper.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then tail -130 paper.log; exit 1; fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper.log
          grep -F 'Settlement engine not connected; player admission remains disabled.' paper.log
          grep -F 'PAPER_BLOCKLOCKER_115_OWNER_PASSED' paper.log
          grep -F 'PAPER_A04_LIVE_BLOCKLOCKER_NATIVE_CURRENCY_CLASSIFIED phase=create privateDead=10000 everyoneFree=5000 unprotectedFree=1000 unknownHold=true originalValueUnchanged=true' paper.log
          printf 'stop\n' >&3
          exec 3>&-
          wait "$pid"
          trap - EXIT
          echo 'PAPER_BLOCKLOCKER_115_READ_ONLY_SUCCESS (saved ownership not yet proved)'
      - name: Inspect saved Paper BlockLocker sign NBT without a Bukkit server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/offline-classes
          javac -cp build/libs/SimpleCoins-1.0.0.jar -d smoke/offline-classes \
            tests/paper-blocklocker-smoke/OfflineBlockLockerSignProbe.java
          cd smoke
          test -s world/dimensions/minecraft/overworld/region/r.0.0.mca
          java -cp offline-classes:../build/libs/SimpleCoins-1.0.0.jar \
            co.surumene.simplecoins.a04probe.OfflineBlockLockerSignProbe \
            world/dimensions/minecraft/overworld/region/r.0.0.mca \
            | tee paper-blocklocker-115-saved-signs.log
          grep -F 'PAPER_A04_FIVE_REAL_SAVED_BLOCKLOCKER_SIGNS_ACROSS_CHUNKS_PASSED' \
            paper-blocklocker-115-saved-signs.log
          grep -F 'PAPER_A04_REAL_SAVED_SIGN_CHEST_TOPOLOGY_PASSED' \
            paper-blocklocker-115-saved-signs.log
          test "$(grep -c '^PAPER_A04_SAVED_SIGN_RAW_SOURCE_VALIDATED' \
            paper-blocklocker-115-saved-signs.log)" -eq 5
      - name: Verify SAVED sign profile resolution against real stopped-Paper Anvil
        shell: bash
        run: |
          set -euo pipefail
          saved="$PWD/smoke/world/dimensions/minecraft/overworld/region/r.0.0.mca"
          test -s "$saved"
          JAVA_TOOL_OPTIONS="-Da04.saved.fixture=$saved" \
            gradle --no-daemon test --tests \
            'co.surumene.simplecoins.paper.PaperSavedProfileAnvilFixtureTest'
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('build/test-results/test/TEST-co.surumene.simplecoins.paper.PaperSavedProfileAnvilFixtureTest.xml')
          root=ET.parse(p).getroot()
          assert (root.get('tests'),root.get('failures'),root.get('errors'),root.get('skipped'))==('1','0','0','0'), ET.tostring(root,encoding='unicode')[:2000]
          assert 'PAPER_A04_SAVED_EFFECTIVE_PROFILES_PASSED' in ET.tostring(root,encoding='unicode'), 'actual fixture proof log missing'
          print('PAPER_A04_REAL_SAVED_BLOCKLOCKER_EFFECTIVE_PROFILES_JUNIT_PASSED')
          PY
      - name: Restart actual Paper world and verify BlockLocker recovers the same protections
        shell: bash
        run: |
          set -euo pipefail
          cd smoke
          test -s plugins/SimpleCoinsBlockLockerLiveProbe/a04-probe-world-and-y.txt
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            java -Da04.probe.phase=reload -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a04-reloaded.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Paper saved protection reload failed with $status" >&2
            tail -160 paper-a04-reloaded.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a04-reloaded.log
          grep -F 'PAPER_BLOCKLOCKER_115_SAVED_OWNER_AND_EVERYONE_UUID_PASSED' paper-a04-reloaded.log
          grep -F 'PAPER_BLOCKLOCKER_115_RELOADED_PROTECTION_PASSED' paper-a04-reloaded.log
          grep -F 'PAPER_A04_LIVE_BLOCKLOCKER_NATIVE_CURRENCY_CLASSIFIED phase=reload privateDead=10000 everyoneFree=5000 unprotectedFree=1000 unknownHold=true originalValueUnchanged=true' paper-a04-reloaded.log
          if grep -Fq 'PAPER_BLOCKLOCKER_115_RELOAD_FAILED' paper-a04-reloaded.log; then
            tail -140 paper-a04-reloaded.log
            exit 1
          fi
          echo 'PAPER_A04_BLOCKLOCKER_SAVED_ANVIL_AND_RESTART_PROTECTION_PASSED'
      - name: Upload isolated provider diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-blocklocker-115-log
          path: |
            smoke/*.log
            smoke/world/dimensions/minecraft/overworld/region/r.0.0.mca
            build/test-results/test/TEST-co.surumene.simplecoins.paper.PaperSavedProfileAnvilFixtureTest.xml
          if-no-files-found: ignore
          retention-days: 1
