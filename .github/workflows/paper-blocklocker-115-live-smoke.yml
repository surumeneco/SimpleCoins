name: Paper 26.2 BlockLocker 1.15 loaded ownership probe
on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/main/java/co/surumene/simplecoins/paper/BlockLockerLiveEvidence.java'
      - 'src/test/java/co/surumene/simplecoins/paper/BlockLockerLiveEvidenceTest.java'
      - 'src/test/java/co/surumene/simplecoins/paper/BlockLockerLiveProbe.java'
      - 'tests/paper-blocklocker-smoke/**'
      - 'build.gradle.kts'
      - '.github/workflows/paper-blocklocker-115-live-smoke.yml'
jobs:
  read-only-v115:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Test JUnit and build three disjoint plugin JARs
        run: |
          gradle --no-daemon clean test :admission-guard:test jar :admission-guard:jar paperBlockLockerLiveProbeJar
          python3 tools/simplecoins_preflight.py admission-guard/build/libs/admission-guard-1.0.0.jar build/libs/SimpleCoins-1.0.0.jar
          unzip -p build/libs/SimpleCoinsBlockLockerLiveProbe-1.0.0.jar plugin.yml | grep -F 'name: SimpleCoinsBlockLockerLiveProbe'
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -E 'nl/rutgerkok/blocklocker/|BlockLockerLiveProbe.class'; then
            echo 'BlockLocker API or test classes accidentally shipped' >&2
            exit 1
          fi
      - name: Download official pinned Paper and BlockLocker release JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-Paper-CI/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' -o smoke/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke/paper.jar
          printf '%s  %s\n' "$sha" smoke/paper.jar | sha256sum -c -
          curl -fLsS --retry 3 'https://github.com/rutgerkok/BlockLocker/releases/download/v1.15/blocklocker-1.15.jar' \
            -o smoke/plugins/blocklocker-1.15.jar
          echo '8e21655ce029c2fe17b62568b2fefbe24e90b98543dfe54990777529edc0b962  smoke/plugins/blocklocker-1.15.jar' \
            | sha256sum -c -
      - name: Observe real Paper loaded BlockLocker protected containers
        shell: bash
        run: |
          set -euo pipefail
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke/plugins/SimpleCoins.jar
          cp build/libs/SimpleCoinsBlockLockerLiveProbe-1.0.0.jar smoke/plugins/SimpleCoinsBlockLockerLiveProbe.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25572\n' > smoke/server.properties
          cd smoke
          mkfifo console.in
          java -Xms256M -Xmx1024M -jar paper.jar nogui < console.in > paper.log 2>&1 &
          pid=$!
          exec 3> console.in
          cleanup() {
            printf 'stop\n' >&3 2>/dev/null || true
            exec 3>&- || true
            kill "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 150); do
            if grep -Fq 'PAPER_BLOCKLOCKER_115_OWNER_FAILED' paper.log; then
              echo 'BlockLocker evidence probe failed' >&2
              tail -130 paper.log
              exit 1
            fi
            if grep -Fq 'PAPER_BLOCKLOCKER_115_OWNER_PASSED' paper.log && grep -Fq 'Done (' paper.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Server terminated before BlockLocker probe proof' >&2
              tail -130 paper.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then tail -130 paper.log; exit 1; fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper.log
          grep -F 'Settlement engine not connected; player admission remains disabled.' paper.log
          grep -F 'PAPER_BLOCKLOCKER_115_OWNER_PASSED' paper.log
          printf 'stop\n' >&3
          exec 3>&-
          wait "$pid"
          trap - EXIT
          echo 'PAPER_BLOCKLOCKER_115_READ_ONLY_SUCCESS (saved ownership not yet proved)'
      - name: Upload isolated provider diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-blocklocker-115-log
          path: smoke/*.log
          if-no-files-found: ignore
          retention-days: 7
