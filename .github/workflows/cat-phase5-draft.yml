name: CAT Draft contract validation (Phase 5 asset scan)

on:
  push:
    branches:
      - feature/asset-scan-source-types-20261101-queue-b
    paths:
      - 'docs/cat/phase5-legacy-terrain-block-entities-*.md'
      - 'docs/cat/phase5-authoritative-source-coverage.md'
      - 'docs/cat/phase5-source-set-closure.md'
      - 'docs/cat/phase5-legacy-terrain-entities-fail-closed.md'
      - 'docs/cat/phase5-authoritative-source-file-types.md'
      - 'docs/cat/phase5-late-source-mutation-revalidation.md'
      - '.github/workflows/cat-phase5-draft.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SimpleCoins
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout pinned CAT-TDD runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: surumeneco/CAT-TDD
          ref: ee929dfa655d0dd738692990bebe7f5de77e4f31
          path: cat-tdd
          persist-credentials: false
      - name: Validate Draft artifact structure and explicit references
        run: |
          python3 cat-tdd/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py --files \
            docs/cat/phase5-legacy-terrain-block-entities-process.md \
            docs/cat/phase5-legacy-terrain-block-entities-pi.md \
            docs/cat/phase5-legacy-terrain-block-entities-fail-closed.md
      - name: Validate saved-source Draft coverage and referenced IDs
        run: |
          python3 cat-tdd/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py --files \
            docs/cat/phase5-source-set-closure.md \
            docs/cat/phase5-authoritative-source-coverage.md \
            docs/cat/phase5-legacy-terrain-entities-fail-closed.md \
            docs/cat/phase5-authoritative-source-file-types.md \
            docs/cat/phase5-late-source-mutation-revalidation.md
      - name: Probe Draft model without normative promotion
        id: model_probe
        run: |
          set +e
          python3 cat-tdd/.cat-system/scripts/cat_compile_v2.py model \
            docs/cat/phase5-legacy-terrain-block-entities-process.md \
            docs/cat/phase5-legacy-terrain-block-entities-pi.md \
            docs/cat/phase5-legacy-terrain-block-entities-fail-closed.md \
            --allow-draft -o /tmp/simplecoins-legacy-terrain-draft-model.json \
            > /tmp/cat-model-probe.log 2>&1
          result=$?
          set -e
          cat /tmp/cat-model-probe.log
          if [ "$result" -eq 0 ]; then
            echo 'model_ready=true' >> "$GITHUB_OUTPUT"
          elif [ "$result" -eq 2 ] && grep -Fq 'BLOCKED: Process must declare explicit closed-world contract' /tmp/cat-model-probe.log; then
            echo 'model_ready=false' >> "$GITHUB_OUTPUT"
            echo 'Draft model blocked by unconfirmed closed-world semantics; normative CAT Gate not run.' >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$result"
          fi
      - name: Independently validate Draft model conformance
        if: steps.model_probe.outputs.model_ready == 'true'
        run: |
          python3 cat-tdd/.cat-system/scripts/cat_model_conformance.py \
            docs/cat/phase5-legacy-terrain-block-entities-process.md \
            docs/cat/phase5-legacy-terrain-block-entities-pi.md \
            /tmp/simplecoins-legacy-terrain-draft-model.json \
            --tce docs/cat/phase5-legacy-terrain-block-entities-fail-closed.md
