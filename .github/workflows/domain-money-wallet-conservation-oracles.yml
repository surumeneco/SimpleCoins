name: Domain money and wallet independent value-conservation oracles
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.domain.money-wallet-conservation-verification.md'
      - 'src/test/java/co/surumene/simplecoins/domain/CoinMoneyExhaustiveConservationCharacterizationTest.java'
      - 'src/test/java/co/surumene/simplecoins/domain/WalletBalanceStatefulConservationCandidateTest.java'
      - '.github/workflows/domain-money-wallet-conservation-oracles.yml'
permissions:
  contents: read
jobs:
  verify-coins-and-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate scoped verification Work only, not a formal CAT Gate
        shell: bash
        run: |
          set -euo pipefail
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.domain.money-wallet-conservation-verification.md
      - name: Run pure-domain JUnit algorithms and stateful immutable wallet transitions
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :test \
            --tests co.surumene.simplecoins.domain.CoinMoneyExhaustiveConservationCharacterizationTest \
            --tests co.surumene.simplecoins.domain.WalletBalanceStatefulConservationCandidateTest
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path('build/test-results/test')
          names = [
              'CoinMoneyExhaustiveConservationCharacterizationTest',
              'WalletBalanceStatefulConservationCandidateTest',
          ]
          count = 0
          for name in names:
              found = list(root.glob('TEST-*'+name+'.xml'))
              assert len(found) == 1, (name, found)
              suite = ET.parse(found[0]).getroot()
              tests = int(suite.get('tests',-1))
              assert tests >= 2 and suite.get('failures') == '0', (name, suite.attrib)
              assert suite.get('errors') == '0' and suite.get('skipped') == '0', (name, suite.attrib)
              count += tests
              print('MONETARY_ORACLE_JUNIT', name, 'tests=', tests)
          assert count >= 4, count
          print('MONETARY_DOMAIN_COIN_MINIMALITY_AND_WALLET_HISTORY_TESTS_PASSED_NOT_G0_G3')
          PY
      - name: Upload exact JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-money-wallet-oracles-junit
          path: build/test-results/test/*.xml
          retention-days: 14
          if-no-files-found: ignore
