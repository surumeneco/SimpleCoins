name: Paper 26.2 guarded bootstrap smoke
on:
  pull_request:
    branches: [develop]
    paths:
      - 'admission-guard/**'
      - 'src/main/java/co/surumene/simplecoins/SimpleCoinsPlugin.java'
      - 'src/main/resources/plugin.yml'
      - '.github/workflows/paper-guarded-bootstrap-smoke.yml'

jobs:
  two-jar-paper-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build and verify both plugin JARs
        run: |
          gradle --no-daemon clean test :admission-guard:test jar :admission-guard:jar
          python3 tools/simplecoins_preflight.py admission-guard/build/libs/admission-guard-1.0.0.jar build/libs/SimpleCoins-1.0.0.jar
      - name: Download pinned Paper 26.2 build 134 with checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-Paper-CI/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' -o smoke/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) echo "Unexpected Paper download URL" >&2; exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke/paper.jar
          printf '%s  %s\n' "$sha" smoke/paper.jar | sha256sum -c -
      - name: Boot guarded Paper, verify fail-closed load, then stop cleanly
        shell: bash
        run: |
          set -euo pipefail
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke/plugins/SimpleCoins.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25568\n' > smoke/server.properties
          cd smoke
          mkfifo console.in
          java -Xms256M -Xmx1024M -jar paper.jar nogui < console.in > paper.log 2>&1 &
          server_pid=$!
          exec 3> console.in
          cleanup() {
            printf 'stop\n' >&3 2>/dev/null || true
            exec 3>&- || true
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 180); do
            if grep -Fq 'Done (' paper.log; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Paper exited before loading both plugins'; cat paper.log; exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo 'Paper startup timed out'; cat paper.log; exit 1; fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper.log
          grep -F 'Settlement engine not connected; player admission remains disabled.' paper.log
          test -f plugins/SimpleCoins/normal-mutations/head || { echo 'RED_JOURNAL_HEAD_NOT_CREATED'; exit 1; }
          test -f plugins/SimpleCoins/normal-mutations/.writer.lock || { echo 'RED_JOURNAL_LOCK_NOT_CREATED'; exit 1; }
          echo 'PAPER_NORMAL_JOURNAL_OPEN_VERIFIED'
          printf 'stop\n' >&3
          exec 3>&-
          wait "$server_pid"
          trap - EXIT
          grep -F 'Saving worlds' paper.log
          echo 'PAPER_GUARDED_BOOT_STOP_PASSED'
      - name: Upload Paper diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-guarded-bootstrap-log
          path: smoke/paper.log
          if-no-files-found: ignore
          retention-days: 7
