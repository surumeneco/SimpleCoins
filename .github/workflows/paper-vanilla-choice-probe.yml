name: Paper 26.2 vanilla PAPER ingredient and craft-guard probe
on:
  pull_request:
    branches: [develop]
    paths:
      - 'tests/paper-vanilla-choice-probe/**'
      - '.github/workflows/paper-vanilla-choice-probe.yml'
      - 'Lifecycle/Works/simplecoins.a12.vanilla-paper-choice-boundary.md'
      - 'Lifecycle/Works/simplecoins.a12.exchange-recipe-result-integrity.md'
      - 'Lifecycle/Works/simplecoins.a12.paper-prepare-result-collision.md'
      - 'Lifecycle/Works/simplecoins.a12.paper-crafter-result-collision.md'

jobs:
  currency-crafting-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate verification-only CAT Work
        run: |
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a12.vanilla-paper-choice-boundary.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a12.exchange-recipe-result-integrity.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a12.paper-prepare-result-collision.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a12.paper-crafter-result-collision.md
      - name: Build separate observer plugin with no production code changes
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon test :admission-guard:test jar :admission-guard:jar
          gradle --no-daemon -p tests/paper-vanilla-choice-probe jar
          python3 tools/simplecoins_preflight.py admission-guard/build/libs/admission-guard-1.0.0.jar build/libs/SimpleCoins-1.0.0.jar
          unzip -p tests/paper-vanilla-choice-probe/build/libs/SimpleCoinsVanillaChoiceProbe.jar plugin.yml |
            grep -F 'name: SimpleCoinsVanillaChoiceProbe'
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fq 'VanillaChoiceProbe.class'; then
            echo 'Disposable observer leaked into product JAR' >&2
            exit 1
          fi
      - name: Download official verified Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-A12-Probe/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' -o smoke/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke/paper.jar
          printf '%s  %s\n' "$sha" smoke/paper.jar | sha256sum -c -
      - name: Observe matching vanilla ingredient without crafting any item
        shell: bash
        run: |
          set -euo pipefail
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke/plugins/SimpleCoins.jar
          cp tests/paper-vanilla-choice-probe/build/libs/SimpleCoinsVanillaChoiceProbe.jar smoke/plugins/ChoiceProbe.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25596\n' > smoke/server.properties
          cd smoke
          set +e
          timeout --signal=TERM --kill-after=5s 160s \
            java -Xms256M -Xmx1024M -jar paper.jar nogui </dev/null > paper-a12.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Paper probe exit code $status" >&2
            tail -160 paper-a12.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a12.log
          grep -F 'PAPER_A12_VANILLA_MATERIAL_CHOICE_MATCHES_CURRENCY_PASSED' paper-a12.log
          grep -F 'PAPER_A12_THREE_EXISTING_CRAFT_GUARDS_REGISTERED_PASSED' paper-a12.log
          grep -F 'PAPER_A12_ALL_TWENTY_REAL_EXCHANGE_INPUT_OUTPUT_APPROVALS_PASSED' paper-a12.log
          grep -F 'PAPER_A12_DISPOSABLE_RECIPE_RESTORED_PASSED' paper-a12.log
          grep -F 'PAPER_A12_RECIPE_REGISTRY_OUTPUT_INTEGRITY_OBSERVED' paper-a12.log
          grep -F 'PAPER_A12_ACTUAL_PREPARE_RESULT_OBSERVED' paper-a12.log
          grep -F 'PAPER_A12_ACTUAL_CRAFTER_EVENT_RESULT_OBSERVED' paper-a12.log
          if grep -Fq 'PAPER_A12_PROBE_FAILED' paper-a12.log; then exit 1; fi
          echo 'PAPER_A12_BOUNDED_CRAFT_REGISTRY_OBSERVATION_PASSED'
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-a12-vanilla-choice-log
          path: smoke/*.log
          if-no-files-found: ignore
          retention-days: 7
