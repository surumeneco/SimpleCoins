name: A04 BlockLocker saved PDC profile slot regressions
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.a04.blocklocker-saved-profile-slots.md'
      - 'src/test/java/co/surumene/simplecoins/domain/BlockLockerSavedHintsProfileSlotCandidateTest.java'
      - '.github/workflows/a04-blocklocker-profile-slot-regression.yml'
permissions:
  contents: read
jobs:
  saved-profile-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate only the CAT issue-work structure
        run: |
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a04.blocklocker-saved-profile-slots.md
      - name: Execute actual four JUnit tests on Java25
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :test --tests \
            'co.surumene.simplecoins.domain.BlockLockerSavedHintsProfileSlotCandidateTest'
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path("build/test-results/test/TEST-co.surumene.simplecoins.domain.BlockLockerSavedHintsProfileSlotCandidateTest.xml")
          assert root.is_file(),root
          suite=ET.parse(root).getroot()
          assert suite.get("tests")=="4",suite.attrib
          assert suite.get("errors")=="0" and suite.get("failures")=="0" and suite.get("skipped")=="0",suite.attrib
          names={n.attrib["name"].removesuffix("()") for n in suite.findall("testcase")}
          expected={
            "eachOfTheSixSupportedSlotsPreservesPresenceOfEveryoneMarker",
            "unsupportedOrNoncanonicalProfileSlotSuffixesFailClosed",
            "unrelatedPdcExtensionDoesNotCreateAProfileSlot",
            "validSlotWithoutHeaderRemainsOrphanEvidenceNotAnOwner",
          }
          assert names==expected,(names,expected)
          print("A04_BLOCKLOCKER_SAVED_PROFILE_SLOTS_JUNIT_4_4_GREEN")
          PY
