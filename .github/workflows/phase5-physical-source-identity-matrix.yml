name: Phase 5 physical-source identity Draft regression

on:
  push:
    branches:
      - feature/phase5-physical-source-identity-matrix-20261102-queue-c
    paths:
      - 'docs/cat/phase5-physical-source-identity-matrix.md'
      - 'src/test/java/co/surumene/simplecoins/domain/WorldStoragePhysicalIdentityMatrixTest.java'
      - '.github/workflows/phase5-physical-source-identity-matrix.yml'

permissions:
  contents: read

jobs:
  draft-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned CAT-TDD syntax validator
        uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: ee929dfa655d0dd738692990bebe7f5de77e4f31
          path: cat-tdd
          persist-credentials: false
      - name: Validate CAT Draft syntax (not normative Gate)
        run: |
          python3 cat-tdd/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py --files \
            docs/cat/phase5-physical-source-identity-matrix.md
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run full Gradle JUnit suite on exact branch HEAD
        run: gradle --no-daemon clean test jar
