name: Phase5 WCL provider record boundaries (candidate)
on:
  push:
    branches:
      - test/queue-c-phase5-provider-record-boundaries-20261104
  workflow_dispatch:
jobs:
  python-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run WCL provider record candidate and baseline
        run: |
          python -m unittest discover -s tests -p 'test_audit_wcl_provider_record_boundaries_draft.py' -v
          python -m unittest discover -s tests -p 'test_audit_wcl_service_capture.py' -v
