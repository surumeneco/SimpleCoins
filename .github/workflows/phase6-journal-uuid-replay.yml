name: Phase 6 journal UUID replay verification (Candidate)
on:
  pull_request:
    branches:
      - feature/settlement-world-identity-20261101-queue-b
    paths:
      - 'docs/cat/phase6-journal-canonical-uuid-replay.md'
      - 'src/test/java/co/surumene/simplecoins/domain/GrantLedgerCanonicalUuidReplayTest.java'
      - '.github/workflows/phase6-journal-uuid-replay.yml'
  push:
    branches:
      - feature/phase6-journal-uuid-replay-20261102-queue-c
    paths:
      - 'docs/cat/phase6-journal-canonical-uuid-replay.md'
      - 'src/test/java/co/surumene/simplecoins/domain/GrantLedgerCanonicalUuidReplayTest.java'
      - '.github/workflows/phase6-journal-uuid-replay.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned CAT-TDD Candidate syntax validator
        uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: ee929dfa655d0dd738692990bebe7f5de77e4f31
          path: cat-tdd
          persist-credentials: false
      - name: Validate Candidate syntax only (not normative Gate)
        run: python3 cat-tdd/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py --files docs/cat/phase6-journal-canonical-uuid-replay.md
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run exact-head Gradle JUnit
        run: gradle --no-daemon clean test jar
