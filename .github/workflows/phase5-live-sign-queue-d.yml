name: Phase5 live Paper sign Candidate verification
on:
  push:
    branches:
      - feature/phase5-paper-live-sign-boundary-20261103-queue-d
  pull_request:
    branches:
      - feature/owner-evidence-20261101
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Compile and execute full JUnit suite
        run: gradle --no-daemon clean test
      - name: Checkout pinned CAT-TDD lint runtime
        uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: ee929dfa655d0dd738692990bebe7f5de77e4f31
          path: cat-tdd
          persist-credentials: false
      - name: Canonical CAT Candidate syntax lint
        run: python3 cat-tdd/.cat-system/skills/cat-specification-gate/scripts/cat_artifact_lint.py --files docs/cat/phase5-paper-live-sign-adapter-observation.md
      - name: Explicit semantic Gate boundary
        run: echo 'Draft syntax lint and JUnit only; normative CAT process/model/implementation Gates and Paper live acceptance not-run.' >> "$GITHUB_STEP_SUMMARY"
