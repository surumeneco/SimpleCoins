name: Phase 5 discovery visit budget characterization
on:
  push:
    branches:
      - test/phase5-world-visit-budget-20261105-queue-b
  workflow_dispatch:
jobs:
  isolated-junit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify exactly three passing budget boundary cases
        shell: bash
        run: |
          gradle --no-daemon clean test --tests 'co.surumene.simplecoins.domain.WorldStorageDiscoveryVisitBudgetTest'
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          target = "co.surumene.simplecoins.domain.WorldStorageDiscoveryVisitBudgetTest"
          found = []
          for report in Path("build/test-results/test").glob("TEST-*.xml"):
              suite = ET.parse(report).getroot()
              if suite.attrib.get("name") == target or report.stem == "TEST-" + target:
                  found.append(suite)
          if len(found) != 1:
              raise SystemExit(f"Expected exactly one JUnit report for {target}; found {len(found)}")
          root = found[0]
          cases = root.findall(".//testcase")
          if len(cases) != 3 or any(case.find(tag) is not None
              for case in cases for tag in ("failure", "error", "skipped")):
              raise SystemExit(f"Expected three complete Green cases: attrs={root.attrib}, cases={len(cases)}")
          print("Verified WorldStorageDiscovery budget JUnit 3/3 Green; CAT Gate and Paper live NOT-RUN")
          PY
