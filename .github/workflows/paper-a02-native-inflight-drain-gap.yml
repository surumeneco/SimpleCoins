name: A02 real Paper already-admitted save after entry closure (in-flight drain counterexample)
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.a02.native-save-agent-interception-spike.md'
      - 'tests/paper-invsee-writer-probe/**'
      - '.github/workflows/paper-a02-native-inflight-drain-gap.yml'
permissions:
  contents: read
jobs:
  native-paper-inflight-drain-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate existing issue Work structure, not a CAT Gate
        shell: bash
        run: |
          set -euo pipefail
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a02.native-save-agent-interception-spike.md
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/MineCraftXPlayServer
          ref: 90aa2d0e0a5ea80c705fd67d717f463decaf2a32
          path: pinned-server
          sparse-checkout: |
            plugins/InvSee++.jar
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate actual pinned InvSee++ distribution SHA256
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-server rev-parse HEAD)" = '90aa2d0e0a5ea80c705fd67d717f463decaf2a32'
          printf '%s  %s\n' \
            '01f3e053a814f76d46513ebf65a38747df11df81c577d12bed108b353d7775f9' \
            'pinned-server/plugins/InvSee++.jar' | sha256sum -c -
      - name: Build actual SimpleCoins, independent deny guard and disposable Paper probe
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :test :admission-guard:test jar :admission-guard:jar
          gradle --no-daemon -p tests/paper-invsee-writer-probe jar
          python3 tools/simplecoins_preflight.py \
            admission-guard/build/libs/admission-guard-1.0.0.jar \
            build/libs/SimpleCoins-1.0.0.jar
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fq InvseeWriterProbe.class; then
            echo 'Test-only probe leaked into the production JAR' >&2
            exit 1
          fi
      - name: Build disposable native save entrypoint instrumentation Agent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-agent-classes
          javac --release 25 \
            -d native-agent-classes \
            tests/paper-invsee-writer-probe/agent-src/co/surumene/simplecoins/a02agent/PaperNativeSaveAgent.java \
            tests/paper-invsee-writer-probe/agent-src/co/surumene/simplecoins/a02agent/NativeSaveHook.java
          jar cf native-hook.jar -C native-agent-classes \
            co/surumene/simplecoins/a02agent/NativeSaveHook.class
          unzip -Z1 native-hook.jar | grep -F 'NativeSaveHook.class'
          printf 'Manifest-Version: 1.0\nPremain-Class: co.surumene.simplecoins.a02agent.PaperNativeSaveAgent\n\n' > native-agent.mf
          jar cfm native-agent.jar native-agent.mf -C native-agent-classes .
          unzip -p native-agent.jar META-INF/MANIFEST.MF | grep -F 'Premain-Class: co.surumene.simplecoins.a02agent.PaperNativeSaveAgent'
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -F 'PaperNativeSaveAgent'; then
            echo 'Test-only Agent was accidentally shipped in SimpleCoins production JAR' >&2
            exit 1
          fi
      - name: Obtain exact SHA256-verified official Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-agent/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-A02-PaperNativeAgentProof/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' \
            -o smoke-agent/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke-agent/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke-agent/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke-agent/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke-agent/paper.jar
          printf '%s  %s\n' "$sha" smoke-agent/paper.jar | sha256sum -c -
          cp build/libs/SimpleCoins-1.0.0.jar smoke-agent/plugins/SimpleCoins.jar
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke-agent/plugins/SimpleCoinsGuard.jar
          cp pinned-server/plugins/InvSee++.jar smoke-agent/plugins/InvSeePlusPlus.jar
          cp tests/paper-invsee-writer-probe/build/libs/SimpleCoinsInvseeWriterProbe.jar smoke-agent/plugins/InvseeProbe.jar
          printf 'eula=true\n' > smoke-agent/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25599\n' \
            > smoke-agent/server.properties
      - name: JVM Agent blocks the actual Paper Player.saveData entry after signed readback
        shell: bash
        run: |
          set -euo pipefail
          cd smoke-agent
          set +e
          timeout --signal=TERM --kill-after=10s 190s \
            java -javaagent:../native-agent.jar \
              -Da02.nativeAgent.hookJar=../native-hook.jar \
              -Da02.invsee.paperSaveBypassesVeto=true \
              -Da02.invsee.nativeInFlightAfterClose=true -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-native-agent.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 149 ]; then
            echo "Unexpected first real Paper exit $code (expected Runtime.halt(149))" >&2
            tail -200 paper-a02-native-agent.log
            exit 1
          fi
          if grep -Fq 'PAPER_A02_INVSEE_PROBE_FAILED' paper-a02-native-agent.log; then
            tail -200 paper-a02-native-agent.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-native-agent.log
          grep -F 'PAPER_A02_SOURCE_DISCOVERY_OBSERVED_BEFORE_WRITER' paper-a02-native-agent.log
          grep -F 'PAPER_A02_INVSEE_REAL_SAVED_COIN_RECEIPT_PROOF_PASSED' paper-a02-native-agent.log
          grep -F 'PAPER_A02_INVSEE_VETO_FIRST_REAL_SAVE_CANCELLED_5000C_VALID' paper-a02-native-agent.log
          grep -F 'PAPER_A02_NATIVE_AGENT_TEST_ONLY_INSTALLED' paper-a02-native-agent.log
          grep -F 'PAPER_A02_NATIVE_AGENT_CRAFTPLAYER_ENTRY_INSTRUMENTED' paper-a02-native-agent.log
          grep -F 'PAPER_A02_NATIVE_ALREADY_ADMITTED_CRAFT_SAVE_HELD_OPEN' paper-a02-native-agent.log
          grep -F 'PAPER_A02_NATIVE_INFLIGHT_ORIGINAL_FILE_UNCHANGED_BEFORE_CLOSE' paper-a02-native-agent.log
          grep -F 'PAPER_A02_NATIVE_NEW_ADMISSION_CLOSED_WITH_WRITER_INFLIGHT' paper-a02-native-agent.log
          grep -F 'PAPER_A02_NATIVE_ALREADY_ADMITTED_CRAFT_SAVE_RELEASED_CLOSED' paper-a02-native-agent.log
          grep -F 'PAPER_A02_NATIVE_ALREADY_ADMITTED_SAVE_ERASED_5000C_AFTER_CLOSE' paper-a02-native-agent.log
          grep -F 'PAPER_A02_NATIVE_INFLIGHT_FRESH_PROOF_REJECTED_PENDING_NO_ACK' paper-a02-native-agent.log
          grep -F 'PAPER_A02_NATIVE_INFLIGHT_FSYNC_BEFORE_ABRUPT_HALT' paper-a02-native-agent.log
      - name: Cold official Paper JVM proves rejected native save preserved original 5000C and pending reservation
        shell: bash
        run: |
          set -euo pipefail
          cd smoke-agent
          set +e
          timeout --signal=TERM --kill-after=10s 190s \
            java -Da02.invsee.checkPaperDirectAfterHalt=true -Xms256M -Xmx1024M \
              -jar paper.jar nogui </dev/null > paper-a02-native-agent-restart.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "Unexpected second real Paper exit $code" >&2
            tail -200 paper-a02-native-agent-restart.log
            exit 1
          fi
          if grep -Fq 'PAPER_A02_INVSEE_PROBE_FAILED' paper-a02-native-agent-restart.log; then
            tail -200 paper-a02-native-agent-restart.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a02-native-agent-restart.log
          grep -F 'PAPER_A02_NATIVE_SAVE_BYPASS_COLD_RESTART_COINLESS_RECEIPT_PENDING' paper-a02-native-agent-restart.log
          grep -F 'PAPER_A02_NATIVE_SAVE_BYPASS_GUARD_STILL_DEFAULT_DENY' paper-a02-native-agent-restart.log
          echo 'A02_NATIVE_ALREADY_ADMITTED_SAVE_AFTER_ENTRY_CLOSURE_REQUIRES_DRAIN'
      - name: Preserve both real Paper technical logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a02-test-only-native-inflight-after-close-evidence
          path: smoke-agent/*.log
          retention-days: 14
          if-no-files-found: ignore
