name: Verify issuance journal offline
on:
  push:
    paths:
      - 'docs/verification/verify-issuance-journal.py'
      - 'docs/verification/test-verify-issuance-journal.py'
      - 'docs/verification/IssuanceJournalVerifierFixture.java'
      - 'src/main/java/co/surumene/simplecoins/domain/GrantLedger.java'
      - 'src/main/java/co/surumene/simplecoins/domain/DurableFile.java'
      - 'src/main/java/co/surumene/simplecoins/domain/CoinDenomination.java'
      - '.github/workflows/verify-issuance-journal.yml'
  pull_request:
    paths:
      - 'docs/verification/verify-issuance-journal.py'
      - 'docs/verification/test-verify-issuance-journal.py'
      - 'docs/verification/IssuanceJournalVerifierFixture.java'
      - 'src/main/java/co/surumene/simplecoins/domain/GrantLedger.java'
      - 'src/main/java/co/surumene/simplecoins/domain/DurableFile.java'
      - 'src/main/java/co/surumene/simplecoins/domain/CoinDenomination.java'
      - '.github/workflows/verify-issuance-journal.yml'
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify journal and actual Java writer compatibility
        run: python3 docs/verification/test-verify-issuance-journal.py -v
