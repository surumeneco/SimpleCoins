name: Phase6 untracked next grant Candidate JUnit (JDK25)
on:
  push:
    branches:
      - test/task005-untracked-next-grant-queue-a-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  untracked-next-grant-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run fail-closed candidate regression
        run: gradle --no-daemon clean test --tests co.surumene.simplecoins.domain.GrantLedgerUntrackedNextRecordCandidateTest
      - name: Verify exact JUnit XML outcome
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = list(Path('build/test-results/test').glob('TEST-*.GrantLedgerUntrackedNextRecordCandidateTest.xml'))
          if len(paths) != 1:
              raise SystemExit(f'Expected one JUnit XML, found {len(paths)}')
          root = ET.parse(paths[0]).getroot()
          values = {k: int(root.attrib.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped')}
          print(values)
          if values != {'tests': 1, 'failures': 0, 'errors': 0, 'skipped': 0}:
              raise SystemExit('Candidate test count or outcome mismatch')
          PY
