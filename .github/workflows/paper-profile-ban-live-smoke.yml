name: Paper 26.2 standard profile BAN live probe
on:
  pull_request:
    branches: [develop]
    paths:
      - 'build.gradle.kts'
      - 'src/main/java/co/surumene/simplecoins/paper/PaperProfileBanSource.java'
      - 'src/test/java/co/surumene/simplecoins/paper/ProfileBanLiveProbe.java'
      - 'tests/paper-profile-ban-smoke/**'
      - '.github/workflows/paper-profile-ban-live-smoke.yml'

jobs:
  standard-profile-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build main, guard and isolated probe JARs
        run: |
          gradle --no-daemon clean test :admission-guard:test jar :admission-guard:jar paperProfileBanProbeJar
          python3 tools/simplecoins_preflight.py admission-guard/build/libs/admission-guard-1.0.0.jar build/libs/SimpleCoins-1.0.0.jar
          unzip -p build/libs/SimpleCoinsProfileBanProbe-1.0.0.jar plugin.yml | grep -F 'name: SimpleCoinsProfileBanProbe'
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fq 'ProfileBanLiveProbe.class'; then
            echo 'Probe was incorrectly packaged in production JAR' >&2
            exit 1
          fi
      - name: Download pinned Paper build 134 and verify upstream digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-Paper-CI/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' -o smoke/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke/paper.jar
          printf '%s  %s\n' "$sha" smoke/paper.jar | sha256sum -c -
      - name: Observe actual banned and unbanned UUIDs in default-deny Paper
        shell: bash
        run: |
          set -euo pipefail
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke/plugins/SimpleCoins.jar
          cp build/libs/SimpleCoinsProfileBanProbe-1.0.0.jar smoke/plugins/SimpleCoinsProfileBanProbe.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25569\n' > smoke/server.properties
          cat > smoke/banned-players.json <<'BANNED'
          [
            {
              "uuid": "7bf1ac01-4b51-4d68-8c6e-982fae4c0001",
              "name": "ProfileBanProbe",
              "created": "2026-11-14 00:00:00 +0000",
              "source": "SimpleCoins integration test",
              "expires": "forever",
              "reason": "Isolated Paper standard profile observation"
            }
          ]
          BANNED
          cd smoke
          mkfifo console.in
          java -Xms256M -Xmx1024M -jar paper.jar nogui < console.in > paper.log 2>&1 &
          server_pid=$!
          exec 3> console.in
          cleanup() {
            printf 'stop\n' >&3 2>/dev/null || true
            exec 3>&- || true
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 140); do
            if grep -Fq 'PAPER_PROFILE_BAN_LIVE_FAILED' paper.log; then
              echo 'Paper profile BAN probe reported failure' >&2
              tail -120 paper.log
              exit 1
            fi
            if grep -Fq 'PAPER_PROFILE_BAN_LIVE_PASSED' paper.log && grep -Fq 'Done (' paper.log; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Paper process exited before valid probe observation' >&2
              tail -120 paper.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then tail -120 paper.log; exit 1; fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper.log
          grep -F 'Settlement engine not connected; player admission remains disabled.' paper.log
          grep -F 'PAPER_PROFILE_BAN_LIVE_PASSED' paper.log
          printf 'stop\n' >&3
          exec 3>&-
          wait "$server_pid"
          trap - EXIT
          echo 'PAPER_PROFILE_BAN_ISOLATED_SUCCESS (no IP/external claims)'
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-profile-ban-live-log
          path: smoke/*.log
          if-no-files-found: ignore
          retention-days: 7
