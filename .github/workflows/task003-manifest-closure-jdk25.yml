name: Phase5 manifest closure snapshot JDK25 characterization
on:
  push:
    branches:
      - test/task003-manifest-normalized-id-snapshot-20261105-queue-c
    paths:
      - '.github/workflows/task003-manifest-closure-jdk25.yml'
      - 'src/test/java/co/surumene/simplecoins/domain/WorldStorageManifestClosureSnapshotCandidateTest.java'
      - 'docs/cat/phase5-manifest-normalized-closure-snapshot.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Execute four scoped manifest characterization tests
        run: gradle --no-daemon test --tests co.surumene.simplecoins.domain.WorldStorageManifestClosureSnapshotCandidateTest
      - name: Verify four executed cases without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          matches = list(Path('build/test-results/test').glob('*WorldStorageManifestClosureSnapshotCandidateTest.xml'))
          if len(matches) != 1:
              raise SystemExit(f'Expected one XML test suite, observed {len(matches)}')
          root = ET.parse(matches[0]).getroot()
          observed = {key: int(root.attrib.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
          assert observed == {'tests': 4, 'failures': 0, 'errors': 0, 'skipped': 0}, observed
          print('Four exact-head manifest closure/snapshot JUnit cases passed:', observed)
          PY
