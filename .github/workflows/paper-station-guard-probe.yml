name: A12 official Paper station consumption event boundary
on:
  pull_request:
    branches: [develop]
    paths:
      - 'tests/paper-station-guard-probe/**'
      - 'Lifecycle/Works/simplecoins.a12.paper-station-consumption-boundary.md'
      - 'Lifecycle/Works/simplecoins.a12.nms-merchant-itemcost-match.md'
      - 'Lifecycle/Works/simplecoins.a12.native-cartography-coin-input.md'
      - '.github/workflows/paper-station-guard-probe.yml'
permissions:
  contents: read
jobs:
  station-event-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate actual issue-work structure (no normative CAT Gate)
        run: |
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a12.paper-station-consumption-boundary.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a12.nms-merchant-itemcost-match.md
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a12.native-cartography-coin-input.md
      - name: Build product and disposable observer independently
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon test :admission-guard:test jar :admission-guard:jar
          gradle --no-daemon -p tests/paper-station-guard-probe jar
          python3 tools/simplecoins_preflight.py \
            admission-guard/build/libs/admission-guard-1.0.0.jar \
            build/libs/SimpleCoins-1.0.0.jar
          unzip -p tests/paper-station-guard-probe/build/libs/SimpleCoinsStationGuardProbe.jar plugin.yml | \
            grep -F 'name: SimpleCoinsStationGuardProbe'
          if unzip -Z1 build/libs/SimpleCoins-1.0.0.jar | grep -Fq StationGuardProbe; then
            echo 'Disposable observer leaked into production JAR' >&2
            exit 1
          fi
      - name: Download official SHA256-verified Paper 26.2 build 134
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          curl -fLsS --retry 3 -H 'User-Agent: SimpleCoins-A12-StationProbe/1.0 (GitHub Actions)' \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/134' \
            -o smoke/paper-build.json
          jq -e '.id == 134 and .channel == "STABLE"' smoke/paper-build.json
          url=$(jq -r '.downloads["server:default"].url // empty' smoke/paper-build.json)
          sha=$(jq -r '.downloads["server:default"].checksums.sha256 // empty' smoke/paper-build.json)
          case "$url" in https://fill-data.papermc.io/*) ;; *) exit 1 ;; esac
          [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          curl -fLsS --retry 3 "$url" -o smoke/paper.jar
          printf '%s  %s\n' "$sha" smoke/paper.jar | sha256sum -c -
      - name: Run station probe with blocked admission and zero players
        shell: bash
        run: |
          set -euo pipefail
          cp admission-guard/build/libs/admission-guard-1.0.0.jar smoke/plugins/SimpleCoinsGuard.jar
          cp build/libs/SimpleCoins-1.0.0.jar smoke/plugins/SimpleCoins.jar
          cp tests/paper-station-guard-probe/build/libs/SimpleCoinsStationGuardProbe.jar smoke/plugins/A12Probe.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nwhite-list=true\nenforce-whitelist=true\nserver-ip=127.0.0.1\nserver-port=25595\n' > smoke/server.properties
          cd smoke
          set +e
          timeout --signal=TERM --kill-after=5s 160s \
            java -Xms256M -Xmx1024M -jar paper.jar nogui </dev/null > paper-a12-station.log 2>&1
          result=$?
          set -e
          # JVM-owned runtime class bytes, dumped by the disposable probe:
          # disassemble with the SAME Java25 SDK before any failing grep exits.
          dump=$(find plugins -type f -path '*/diagnostic-classes/net/minecraft/server/network/ServerGamePacketListenerImpl.class' -print -quit)
          if [ -n "$dump" ]; then
            cp_root="${dump%/net/minecraft/server/network/ServerGamePacketListenerImpl.class}"
            if javap -c -p -classpath "$cp_root" \
              net.minecraft.server.network.ServerGamePacketListenerImpl \
              > packet-handler.javap.txt 2> packet-handler.javap-error.txt; then
              echo A12_REAL_PAPER_PACKET_HANDLER_DISASSEMBLED
            else
              echo A12_REAL_PAPER_PACKET_HANDLER_DISASSEMBLY_UNAVAILABLE
            fi
          else
            echo A12_REAL_PAPER_PACKET_HANDLER_CLASS_NOT_DUMPED
          fi
          player_dump=$(find plugins -type f -path '*/diagnostic-classes/net/minecraft/server/level/ServerPlayer.class' -print -quit)
          if [ -n "$player_dump" ]; then
            player_root="${player_dump%/net/minecraft/server/level/ServerPlayer.class}"
            if javap -c -p -classpath "$player_root" \
              net.minecraft.server.level.ServerPlayer \
              > server-player.javap.txt 2> server-player.javap-error.txt; then
              echo A12_REAL_PAPER_SERVER_PLAYER_DISASSEMBLED
            else
              echo A12_REAL_PAPER_SERVER_PLAYER_DISASSEMBLY_UNAVAILABLE
            fi
          else
            echo A12_REAL_PAPER_SERVER_PLAYER_CLASS_NOT_DUMPED
          fi
          base_player_dump=$(find plugins -type f -path '*/diagnostic-classes/net/minecraft/world/entity/player/Player.class' -print -quit)
          if [ -n "$base_player_dump" ]; then
            base_player_root="${base_player_dump%/net/minecraft/world/entity/player/Player.class}"
            if javap -c -p -classpath "$base_player_root" \
              net.minecraft.world.entity.player.Player \
              > base-player.javap.txt 2> base-player.javap-error.txt; then
              echo A12_REAL_PAPER_BASE_PLAYER_DISASSEMBLED
            else
              echo A12_REAL_PAPER_BASE_PLAYER_DISASSEMBLY_UNAVAILABLE
            fi
          fi
          if [ "$result" -ne 0 ]; then
            echo "Paper station probe exit status $result" >&2
            tail -160 paper-a12-station.log
            exit 1
          fi
          grep -F 'Admission guard active (default-deny until verified SimpleCoins service)' paper-a12-station.log
          grep -F 'A12_CARTOGRAPHY_SYNTHETIC_RESULT_CLICK_UNCANCELLED inputSlot=0' paper-a12-station.log
          grep -F 'A12_CARTOGRAPHY_SYNTHETIC_RESULT_CLICK_UNCANCELLED inputSlot=1' paper-a12-station.log
          grep -F 'A12_MERCHANT_PAPER_INGREDIENT_REGISTERED tradePerformed=false taggedCoinAccepted=unverified' paper-a12-station.log
          grep -F 'A12_NMS_MERCHANT_PAPER_TAKE_CONTROL_ACCEPTED' paper-a12-station.log
          grep -F 'A12_NMS_MERCHANT_PAPER_COST_MATCH plain=true stone=false taggedCoin=' paper-a12-station.log
          grep -F 'A12_NMS_MERCHANT_TAGGED_COIN_TAKE accepted=' paper-a12-station.log
          grep -F 'A12_NMS_CARTOGRAPHY_NATIVE_RESULT_CONTROLS plain=FILLED_MAP coinFirst=AIR noMap=AIR' paper-a12-station.log
          grep -F 'A12_NMS_CARTOGRAPHY_NATIVE_RESULT_COIN_SECOND output=' paper-a12-station.log
          grep -F 'A12_NMS_CARTOGRAPHY_RESULT_SLOT_CALLBACK input=ordinaryPAPER before=1 after=0' paper-a12-station.log
          grep -F 'A12_NMS_CARTOGRAPHY_RESULT_SLOT_CALLBACK input=genuine5000C before=1 after=' paper-a12-station.log
          grep -F 'A12_NMS_CARTOGRAPHY_NATIVE_ON_TAKE plainBefore=1 plainAfter=0 coinBefore=1 coinAfter=' paper-a12-station.log
          grep -F 'A12_NMS_CARTOGRAPHY_DIRECT_CLICK input=ordinaryPAPER before=1 after=0' paper-a12-station.log
          grep -F 'A12_NMS_CARTOGRAPHY_DIRECT_CLICK input=genuine5000C before=1 after=' paper-a12-station.log
          grep -F 'A12_NMS_CARTOGRAPHY_DIRECT_CLICK_EVENT_BOUNDARY totalInventoryClicks=' paper-a12-station.log
          grep -F 'A12_PACKET_PATH_HANDLER ' paper-a12-station.log
          grep -F 'A12_PACKET_PATH_HANDLER_CONSTRUCTOR ' paper-a12-station.log
          grep -F 'A12_PACKET_PATH_PACKET_CONSTRUCTOR ' paper-a12-station.log
          grep -F 'A12_PACKET_PATH_CONNECTION_CONSTRUCTOR ' paper-a12-station.log
          grep -F 'A12_PACKET_HANDLER_DETACHED_ENTITY_VALIDITY initiallyValid=false syntheticValid=true playerOnline=false' paper-a12-station.log
          grep -F 'A12_PACKET_HANDLER_MENU_VALIDITY valid=true' paper-a12-station.log
          grep -F 'A12_PACKET_HANDLER_TRANSIENT_JOIN_STATE initiallyJoining=true joining=true immobile=false channelConnected=false actualClient=false' paper-a12-station.log
          grep -F 'A12_PACKET_HANDLER_DIRECT_INVOKE_RESULT input=ordinaryPAPER before=1 after=0 inventoryEvents=1 cartographyEvents=1 blocked=0' paper-a12-station.log
          grep -F 'A12_PACKET_HANDLER_DIRECT_INVOKE_RESULT input=genuine5000C before=1 after=1 inventoryEvents=1 cartographyEvents=1 blocked=1' paper-a12-station.log
          grep -F 'A12_PACKET_HANDLER_TEST_ONLY_COIN_CANCELLATION_PASSED socket=false onlinePlayers=0' paper-a12-station.log
          grep -F 'A12_PACKET_PATH_ABI_INSPECTED entrypoints=1 eventDispatch=unverified networkPacketSent=false' paper-a12-station.log
          grep -F 'A12_STATION_DISPOSABLE_PROBE_COMPLETE' paper-a12-station.log
          if grep -Eq 'A12_STATION_PROBE_FAILED|A12_STATION_INVALID_ISOLATION' paper-a12-station.log; then exit 1; fi
          echo 'A12_PAPER_STATION_EVENT_BOUNDARY_OBSERVED_NOT_CONSUMPTION_PROOF'
          echo 'A12_NATIVE_MERCHANT_OFFER_PDC_MONEY_ACCEPTANCE_MEASURED_NO_PLAYER_TRADE'
          echo 'A12_NATIVE_CARTOGRAPHY_RESULT_CALCULATED_NOT_AN_ACTUAL_ITEM_TAKE'
          echo 'A12_NATIVE_CARTOGRAPHY_RESULT_SLOT_ON_TAKE_OBSERVED_NOT_NETWORK_CLICK'
          echo 'A12_NATIVE_CARTOGRAPHY_CLICK_VS_PAPER_EVENT_DISPATCH_OBSERVED'
      - name: Upload log for precise result interpretation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-a12-station-probe
          path: |
            smoke/*.log
            smoke/packet-handler.javap.txt
            smoke/packet-handler.javap-error.txt
            smoke/server-player.javap.txt
            smoke/server-player.javap-error.txt
            smoke/base-player.javap.txt
            smoke/base-player.javap-error.txt
          retention-days: 7
          if-no-files-found: ignore
