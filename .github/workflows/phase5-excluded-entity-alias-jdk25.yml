name: Phase5 excluded entity/playerdata alias JDK25
on:
  push:
    paths:
      - 'src/test/java/co/surumene/simplecoins/domain/WorldStorageExcludedWorldEntityAliasTest.java'
      - '.github/workflows/phase5-excluded-entity-alias-jdk25.yml'
  workflow_dispatch:
jobs:
  excluded-entity-alias:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Execute targeted JUnit regression
        run: gradle --no-daemon clean test --tests 'co.surumene.simplecoins.domain.WorldStorageExcludedWorldEntityAliasTest'
      - name: Verify all four JUnit cases actually executed without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path('build/test-results/test').glob('TEST-*WorldStorageExcludedWorldEntityAliasTest.xml'))
          if len(reports) != 1:
              raise SystemExit(f'Expected exactly one JUnit XML report, got {len(reports)}')
          root = ET.parse(reports[0]).getroot()
          cases = root.findall('.//testcase')
          skipped = sum(case.find('skipped') is not None for case in cases)
          failures = sum(case.find('failure') is not None or case.find('error') is not None for case in cases)
          if len(cases) != 4 or skipped or failures:
              raise SystemExit(f'Expected 4 passing non-skipped tests; actual={len(cases)}, skipped={skipped}, failures={failures}')
          print('Verified 4 executed, non-skipped JUnit cases')
          PY
