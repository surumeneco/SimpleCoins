name: Phase5 excluded entity/playerdata alias JDK25
on:
  push:
    paths:
      - 'src/test/java/co/surumene/simplecoins/domain/WorldStorageExcludedWorldEntityAliasTest.java'
      - '.github/workflows/phase5-excluded-entity-alias-jdk25.yml'
  workflow_dispatch:
jobs:
  excluded-entity-alias:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Execute targeted JUnit regression
        run: ./gradlew test --tests 'co.surumene.simplecoins.domain.WorldStorageExcludedWorldEntityAliasTest' --no-daemon
