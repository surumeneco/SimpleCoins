name: Chat isolated immutable source transfer
on:
  push:
    branches:
      - infra/chat-source-snapshot-20261123-a01a02
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07dda8edabcc2a9a4a5cf74242c3bcd1b031375a
          fetch-depth: 1
          persist-credentials: false
      - name: Produce pinned source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "07dda8edabcc2a9a4a5cf74242c3bcd1b031375a"
          test "$(git rev-parse HEAD^{tree})" = "c68cd04e292b0431c3340bbc286750690cae3d02"
          mkdir -p snapshot
          git archive --format=tar HEAD > snapshot/simplecoins.tar
          (cd snapshot && sha256sum simplecoins.tar > SHA256SUMS)
          printf '{"repository":"surumeneco/SimpleCoins","commit":"07dda8edabcc2a9a4a5cf74242c3bcd1b031375a","tree":"c68cd04e292b0431c3340bbc286750690cae3d02"}\n' > snapshot/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: simplecoins-snapshot-07dda8ed-20261123
          path: snapshot/
          if-no-files-found: error
          retention-days: 1
