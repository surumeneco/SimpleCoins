name: TASK005 startup publication boundary JDK25
on:
  push:
    branches:
      - test/task005-publisher-coordinator-fault-injection-20261108-queue-c
  pull_request:
    paths:
      - src/test/java/co/surumene/simplecoins/domain/SettlementStartupPublicationBoundaryIntegrationTest.java
      - .github/workflows/task005-startup-publication-jdk25.yml
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run targeted JUnit integration fixture
        run: gradle --no-daemon test --tests 'co.surumene.simplecoins.domain.SettlementStartupPublicationBoundaryIntegrationTest'
      - name: Verify non-vacuous exact JUnit class and four test cases
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          path=pathlib.Path('build/test-results/test/TEST-co.surumene.simplecoins.domain.SettlementStartupPublicationBoundaryIntegrationTest.xml')
          assert path.is_file(), f'Missing JUnit XML: {path}'
          root=ET.parse(path).getroot()
          assert root.attrib.get('name')=='co.surumene.simplecoins.domain.SettlementStartupPublicationBoundaryIntegrationTest', root.attrib
          expected={
              'publicationIsInvisibleBetweenStagingAndMainThreadCommit',
              'latePlayerArrivalAfterStagingRevokesAlreadyPublishedResult',
              'publisherExceptionAfterStagingNeverLeaksPreviousResult',
              'failedBackgroundStageNeverSchedulesPublication',
          }
          cases=root.findall('.//testcase')
          assert {case.attrib['name'] for case in cases} == expected, [c.attrib for c in cases]
          assert len(cases)==4 and all(not c.findall('failure') and not c.findall('error') and not c.findall('skipped') for c in cases)
          assert int(root.attrib.get('tests','0'))==4 and int(root.attrib.get('failures','1'))==0 and int(root.attrib.get('errors','1'))==0 and int(root.attrib.get('skipped','1'))==0
          print('Verified TASK005 exact JUnit 4/4 passed; zero failures/errors/skipped')
          PY
