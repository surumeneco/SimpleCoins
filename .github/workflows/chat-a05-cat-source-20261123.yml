name: Isolated Chat A05 CAT pinned-source transfer 20261123
on:
  push:
    branches: ['infra/chat-a05-cat-check-20261123']
    paths: ['.github/workflows/chat-a05-cat-source-20261123.yml']
permissions:
  contents: read
jobs:
  readonly-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/SimpleCoins
          ref: e96402eef14316b7fc23f9985e0e8e1706e188f9
          path: pinned
          persist-credentials: false
      - name: Archive exact immutable source, no scripts or builds
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned rev-parse HEAD)" = 'e96402eef14316b7fc23f9985e0e8e1706e188f9'
          test "$(git -C pinned rev-parse HEAD^{tree})" = 'e1d81bc550f406e11082cee74fafee35500f0a89'
          mkdir -p transfer
          git -C pinned archive --format=tar HEAD | gzip -n > transfer/project.tar.gz
          printf '%s\n' 'surumeneco/SimpleCoins' 'e96402eef14316b7fc23f9985e0e8e1706e188f9' 'e1d81bc550f406e11082cee74fafee35500f0a89' > transfer/identity.txt
          sha256sum transfer/project.tar.gz transfer/identity.txt | tee transfer/hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: simplecoins-e96402-a05-cat-source-20261123
          path: transfer/
          retention-days: 1
