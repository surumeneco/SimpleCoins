name: Chat CAT current source read-only audit
on:
  push:
    branches:
      - infra/chat-cat-current-20261115
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: e368e9b5e00bb757e3c2e46e2b506cf51110f7ca
          fetch-depth: 1
          persist-credentials: false
      - name: Verify CAT-TDD source and archive without execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e368e9b5e00bb757e3c2e46e2b506cf51110f7ca"
          test "$(git rev-parse HEAD^{tree})" = "31f5a696a8069332c9a75477703373aa2608bf34"
          mkdir -p staging
          git archive --format=tar HEAD | gzip -n -9 > staging/project.tar.gz
          sha256sum staging/project.tar.gz > staging/project.sha256
          printf '%s\n' 'e368e9b5e00bb757e3c2e46e2b506cf51110f7ca' > staging/commit.txt
          printf '%s\n' '31f5a696a8069332c9a75477703373aa2608bf34' > staging/tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cat-current-e368-snapshot
          path: staging/
          retention-days: 1
