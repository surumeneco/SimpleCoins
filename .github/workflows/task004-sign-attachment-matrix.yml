name: BlockLocker attachment neighborhood Draft regression

on:
  push:
    branches:
      - test/task004-sign-attachment-matrix-20261104-queue-d
    paths:
      - 'src/test/java/co/surumene/simplecoins/domain/BlockLockerSignAttachmentNeighborhoodMatrixTest.java'
      - '.github/workflows/task004-sign-attachment-matrix.yml'

permissions:
  contents: read

jobs:
  draft-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run exact-HEAD JUnit geometry characterization
        run: gradle --no-daemon test --tests co.surumene.simplecoins.domain.BlockLockerSignAttachmentNeighborhoodMatrixTest
