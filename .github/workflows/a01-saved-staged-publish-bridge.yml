name: A01 genuine saved stage to sealed Snapshot publication
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.a01.saved-staged-publish-bridge.md'
      - 'src/main/java/co/surumene/simplecoins/domain/SettlementProtectedPublisher.java'
      - 'src/test/java/co/surumene/simplecoins/domain/SettlementProtectedPublisherTest.java'
      - '.github/workflows/a01-saved-staged-publish-bridge.yml'
permissions:
  contents: read
jobs:
  real-source-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-runtime
          persist-credentials: false
      - name: Canonical CAT A01 Process Closure and Model Conformance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C cat-runtime rev-parse HEAD)" = '896cae8313a533a3c74073a8c3150daad314ff90'
          work=Lifecycle/Works/simplecoins.a01.saved-staged-publish-bridge.md
          python cat-runtime/.cat-system/scripts/cat_flow.py validate --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind process-closure --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind model --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py conformance --kind model-conformance --work "$work"
          python cat-runtime/.cat-system/scripts/cat_flow.py compile --kind vectors --work "$work"
      - name: Genuine compressed saved 5000C stage to sealed publisher
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :test --tests co.surumene.simplecoins.domain.SettlementProtectedPublisherTest
          grep -F '<testsuite' build/test-results/test/TEST-co.surumene.simplecoins.domain.SettlementProtectedPublisherTest.xml
      - name: Full Java25 JUnit regression
        shell: bash
        run: gradle --no-daemon :test
      - name: Preserve test and CAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a01-real-staged-publish-bridge-evidence
          path: |
            build/test-results/test/
            Lifecycle/Works/.cat-flow/
          retention-days: 14
          if-no-files-found: ignore
