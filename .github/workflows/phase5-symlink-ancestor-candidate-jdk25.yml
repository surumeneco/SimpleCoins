name: Phase5 symlink ancestor candidate regression
on:
  push:
    branches:
      - test/task003-symlinked-ancestor-failclosed-queue-a-20261107
  workflow_dispatch:
jobs:
  candidate-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run exact candidate JUnit
        run: gradle --no-daemon clean test --tests co.surumene.simplecoins.domain.WorldStorageSymlinkAncestorTest
