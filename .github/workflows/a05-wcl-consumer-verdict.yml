name: A05 WCL consumer verdict formal CAT preflight
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.a05.wcl-consumer-verdict.md'
      - 'tests/cat/a05-wcl-consumer-junit-binding.json'
      - '.github/workflows/a05-wcl-consumer-verdict.yml'
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 381af68c91a1cb4c3a0b908d7edd660d87bbb49b
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate Confirmed A05 Process Closure and Model Conformance
        shell: bash
        run: |
          set -euo pipefail
          FLOW=cat-tdd-fixed/.cat-system/scripts/cat_flow.py
          WORK=Lifecycle/Works/simplecoins.a05.wcl-consumer-verdict.md
          python "$FLOW" validate --work "$WORK"
          python "$FLOW" conformance --work "$WORK" --kind process-closure
          python "$FLOW" compile --work "$WORK" --kind model
          python "$FLOW" conformance --work "$WORK" --kind model-conformance
          python "$FLOW" compile --work "$WORK" --kind vectors
          python "$FLOW" compile --work "$WORK" --kind queue
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('Lifecycle/Works/.cat-flow/cache')
          model=json.loads((root/'a05-wcl-consumer-verdict-model.json').read_text())
          vectors=json.loads((root/'a05-wcl-consumer-verdict-vectors.json').read_text())
          queue=json.loads((root/'a05-wcl-consumer-verdict-queue.json').read_text())
          expected={f's{i}' for i in range(8)}
          assert model['status']=='confirmed'
          assert {r['id'] for r in model['rules']}==expected
          assert {c['id'] for c in vectors['cases']}=={f'case.s{i}' for i in range(8)}
          assert len(queue['items'])==8
          assert [x['status'] for x in queue['items']]==['current']+['pending']*7
          print('A05_CONFIRMED_PROCESS_MODEL_AND_TDD_QUEUE_PRECONDITIONS_PASSED')
          PY
      - name: Generate exact current A05 PI-only JUnit test (capabilities unverified)
        shell: bash
        run: |
          set -euo pipefail
          ROOT=Lifecycle/Works/.cat-flow
          FLOW=cat-tdd-fixed/.cat-system/scripts/cat_compile_v2.py
          python "$FLOW" tests \
            "$ROOT/cache/a05-wcl-consumer-verdict-model.json" \
            "$ROOT/cache/a05-wcl-consumer-verdict-vectors.json" \
            tests/cat/a05-wcl-consumer-junit-binding.json \
            --framework junit \
            --queue "$ROOT/cache/a05-wcl-consumer-verdict-queue.json" \
            --process docs/cat/confirmed/a05-wcl-consumer-process.md \
            --pi docs/cat/confirmed/a05-wcl-consumer-pi.md \
            --tce docs/cat/confirmed/a05-wcl-consumer-tce.md \
            -o "$ROOT/generated/A05WclEvidenceGeneratedTest.java"
          python - <<'PY'
          from pathlib import Path
          source=Path('Lifecycle/Works/.cat-flow/generated/A05WclEvidenceGeneratedTest.java').read_text()
          assert 'CAPABILITIES NOT VERIFIED' in source
          assert '@DisplayName("case.s0")' in source
          assert '観測.同一世代の取込み' in source
          assert '作用.候補保留' in source
          assert source.count('@DisplayName(')==1
          print('A05_PI_ONLY_CAT_SOURCE_DERIVED_CURRENT_ITEM_GENERATED_CAPABILITIES_UNVERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: a05-pi-only-cat-current-item
          path: |
            Lifecycle/Works/.cat-flow/cache/a05-wcl-consumer-verdict-model.json
            Lifecycle/Works/.cat-flow/cache/a05-wcl-consumer-verdict-vectors.json
            Lifecycle/Works/.cat-flow/cache/a05-wcl-consumer-verdict-queue.json
            Lifecycle/Works/.cat-flow/generated/A05WclEvidenceGeneratedTest.java
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Complete all eight source-derived JUnit cases with script-owned Queue receipts
        shell: bash
        run: |
          set -euo pipefail
          WORK=Lifecycle/Works/simplecoins.a05.wcl-consumer-verdict.md
          ROOT=Lifecycle/Works/.cat-flow
          CAT=cat-tdd-fixed/.cat-system/scripts
          SOURCE="$ROOT/generated/A05WclEvidenceGeneratedTest.java"
          TARGET=src/test/java/co/surumene/simplecoins/domain/generated
          mkdir -p "$TARGET"
          for i in 0 1 2 3 4 5 6 7; do
            python "$CAT/cat_compile_v2.py" tests \
              "$ROOT/cache/a05-wcl-consumer-verdict-model.json" \
              "$ROOT/cache/a05-wcl-consumer-verdict-vectors.json" \
              tests/cat/a05-wcl-consumer-junit-binding.json \
              --framework junit \
              --queue "$ROOT/cache/a05-wcl-consumer-verdict-queue.json" \
              --process docs/cat/confirmed/a05-wcl-consumer-process.md \
              --pi docs/cat/confirmed/a05-wcl-consumer-pi.md \
              --tce docs/cat/confirmed/a05-wcl-consumer-tce.md \
              -o "$SOURCE"
            grep -F 'CAPABILITIES NOT VERIFIED' "$SOURCE" >/dev/null
            grep -F "@DisplayName(\"case.s$i\")" "$SOURCE" >/dev/null
            cp "$SOURCE" "$TARGET/A05WclEvidenceGeneratedTest.java"
            python "$CAT/cat_flow.py" run --work "$WORK" --id "a05-green-s$i" --execute > "$ROOT/run-s$i.json"
            python - "$ROOT/run-s$i.json" "$i" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          assert result['check_id']=='a05-green-s'+sys.argv[2],result
          assert result['verdict']=='passed',result
          assert result['observed_targets']=={'case.s'+sys.argv[2]:'passed'},result
          print('A05_CAT_SOURCED_JUNIT_GREEN_'+sys.argv[2])
          PY
            python "$CAT/cat_flow.py" queue-state --work "$WORK" \
              --evidence "$ROOT/evidence/a05-green-s$i.json"
          done
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('Lifecycle/Works/.cat-flow')
          queue=json.loads((root/'cache/a05-wcl-consumer-verdict-queue.json').read_text())
          assert [x['status'] for x in queue['items']]==['done']*8
          for i,entry in enumerate(queue['items']):
              assert entry['id']=='case.s'+str(i)
              receipt=json.loads((root/'evidence/a05-green-s'+str(i)+'.json').read_text())
              assert receipt['schema']=='cat-flow-evidence/v1'
              assert receipt['verdict']=='passed' and receipt['observed_targets']=={'case.s'+str(i):'passed'}
          print('A05_CONFIRMED_EIGHT_CASE_SCRIPT_OWNED_QUEUE_GREEN_PASSED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a05-confirmed-pi-only-eight-queue-evidence
          path: |
            Lifecycle/Works/.cat-flow/cache/a05-wcl-consumer-verdict-*.json
            Lifecycle/Works/.cat-flow/evidence/a05-green-*.json
            Lifecycle/Works/.cat-flow/reports/a05-green-*.xml
            Lifecycle/Works/.cat-flow/run-s*.json
          if-no-files-found: error
