name: Phase 5 excluded source shape characterization
on:
  push:
    branches:
      - test/phase5-excluded-source-shapes-20261105-queue-a
  workflow_dispatch:
jobs:
  isolated-junit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify exactly four executed source shape characterization cases
        shell: bash
        run: |
          gradle --no-daemon clean test --tests 'co.surumene.simplecoins.domain.WorldStorageExcludedSourceShapeTest'
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          target = "co.surumene.simplecoins.domain.WorldStorageExcludedSourceShapeTest"
          reports = []
          for report in Path("build/test-results/test").glob("TEST-*.xml"):
              suite = ET.parse(report).getroot()
              if suite.attrib.get("name") == target or report.stem == "TEST-" + target:
                  reports.append(suite)
          if len(reports) != 1:
              raise SystemExit(f"Expected exactly one JUnit report for {target}; found {len(reports)}")
          suite = reports[0]
          cases = suite.findall(".//testcase")
          if len(cases) != 4 or any(case.find(tag) is not None
              for case in cases for tag in ("failure", "error", "skipped")):
              raise SystemExit(f"Expected four complete Green cases: attrs={suite.attrib}, cases={len(cases)}")
          print("Verified excluded source-shape JUnit 4/4 Green; normative CAT and Paper live NOT-RUN")
          PY
