name: Queue D Phase7 audit tests (temporary)
on:
  push:
    branches:
      - feature/phase7-bedrock-artifact-audit-20261103-queue-d
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p test_audit_bedrock_pack.py -v
      - run: python3 -m py_compile tools/audit_bedrock_pack.py tests/test_audit_bedrock_pack.py
