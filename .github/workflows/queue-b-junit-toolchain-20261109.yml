name: Queue B isolated JUnit host dependency
on:
  push:
    branches:
      - infra/queue-b-junit-host-20261109
permissions:
  contents: read
jobs:
  junit-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve pinned standalone JUnit Platform 1.11.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p junit-runtime
          base=https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4
          curl --fail --location --retry 3 --silent --show-error "$base/junit-platform-console-standalone-1.11.4.jar" -o junit-runtime/junit-platform-console-standalone-1.11.4.jar
          curl --fail --location --retry 3 --silent --show-error "$base/junit-platform-console-standalone-1.11.4.jar.sha256" -o junit-runtime/junit.sha256
          expected="$(awk '{print $1}' junit-runtime/junit.sha256)"
          printf '%s  %s\n' "$expected" junit-runtime/junit-platform-console-standalone-1.11.4.jar | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: queue-b-junit-platform-1-11-4
          path: junit-runtime/junit-platform-console-standalone-1.11.4.jar
          retention-days: 1
