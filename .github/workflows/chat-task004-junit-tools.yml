name: Chat JUnit 5 standalone dependency transfer
on:
  push:
    branches: [infra/chat-task004-snapshot-20261109]
permissions:
  contents: read
jobs:
  junit:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve published JUnit Platform Console standalone jar
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output junit-platform-console-standalone-1.11.4.jar https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar
          test -s junit-platform-console-standalone-1.11.4.jar
          sha256sum junit-platform-console-standalone-1.11.4.jar
      - name: Upload test runner only
        uses: actions/upload-artifact@v4
        with:
          name: junit-console-1.11.4
          path: junit-platform-console-standalone-1.11.4.jar
          if-no-files-found: error
          retention-days: 1
