name: A04 Bedrock pack UTF8 and PNG-byte stability matrix
on:
  pull_request:
    branches: [develop]
    paths:
      - 'Lifecycle/Works/simplecoins.a04.bedrock-pack-byte-stability.md'
      - 'src/test/java/co/surumene/simplecoins/domain/BedrockPackDeterminismMatrixTest.java'
      - '.github/workflows/a04-bedrock-pack-determinism.yml'
permissions:
  contents: read
jobs:
  bedrock-16-variant-junit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/checkout@v4
        with:
          repository: surumeneco/CAT-TDD
          ref: 896cae8313a533a3c74073a8c3150daad314ff90
          path: cat-tdd-fixed
          persist-credentials: false
      - name: Validate bounded issue Work contract (NOT formal CAT Gate)
        shell: bash
        run: |
          set -euo pipefail
          python cat-tdd-fixed/.cat-system/scripts/cat_flow.py validate \
            --work Lifecycle/Works/simplecoins.a04.bedrock-pack-byte-stability.md
      - name: Run actual JDK25 JUnit matrix against current BedrockPack implementation
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon test --tests \
            'co.surumene.simplecoins.domain.BedrockPackDeterminismMatrixTest'
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path("build/test-results/test")
          files=list(root.glob("TEST-*BedrockPackDeterminismMatrixTest.xml"))
          assert len(files)==1,files
          suite=ET.parse(files[0]).getroot()
          assert suite.get("tests")=="1",suite.attrib
          assert suite.get("failures")=="0" and suite.get("errors")=="0",suite.attrib
          assert suite.get("skipped")=="0",suite.attrib
          print("A04_CURRENT_DEVELOP_BE_PACK_16_UTF8_PNG_VARIANTS_REPEATED_IDENTICAL_AND_CHANGED_DISTINCT")
          PY
      - name: Archive exact JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a04-bedrock-16-variant-current-head-junit
          path: build/test-results/test/*.xml
          retention-days: 14
          if-no-files-found: ignore
