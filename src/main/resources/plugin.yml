name: SimpleCoins
version: '1.0.0-dev'
main: co.surumene.simplecoins.SimpleCoinsPlugin
api-version: '26.2'
load: POSTWORLD
# The admission listener must already be available when accounting starts.
depend:
  - SimpleCoinsGuard
description: SimpleCoins Paper bootstrap - settlement integration is not yet available
softdepend:
  - Geyser-Spigot
  - Nexo
  - BlockLocker
  - WhatAWonderfulChicken
  - WhatAWonderfulWolf
  - WonderfulCoreLibrary
commands:
  simplecoins:
    aliases: [sc]
    description: SimpleCoins administrative asset queries
    usage: /<command> <stats|balance <player>|dead [page]>
    permission: simplecoins.admin
permissions:
  simplecoins.admin:
    description: View SimpleCoins accounting and dead assets
    default: op
