name: SimpleCoins
version: '1.0.0-dev'
main: co.surumene.simplecoins.SimpleCoinsPlugin
api-version: '26.2'
load: POSTWORLD
# The admission listener must already be available when accounting starts.
depend:
  - SimpleCoinsGuard
description: SimpleCoins Paper bootstrap - settlement integration is not yet available
softdepend:
  - Geyser-Spigot
  - floodgate
  - Nexo
  - BlockLocker
  - InvSeePlusPlus
  - WhatAWonderfulChicken
  - WhatAWonderfulWolf
  - WonderfulCoreLibrary
commands:
  simplecoins:
    aliases: [sc]
    description: SimpleCoins administration
    usage: /<command> <stats|balance <player>|dead [page]|give <target> <amount>|give <target> <item> <count>>
permissions:
  simplecoins.admin:
    description: View SimpleCoins accounting and dead assets
    default: op
  simplecoins.give:
    description: Issue SimpleCoins currency and empty wallets
    default: op
