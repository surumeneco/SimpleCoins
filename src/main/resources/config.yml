# SimpleCoins 1.0.0 development defaults; all monetary operations stay
# blocked until the complete physical settlement/journal is integrated.
currency:
  unit: C
coins:
  '1': {name: '1 Coin'}
  '5': {name: '5 Coin'}
  '10': {name: '10 Coin'}
  '50': {name: '50 Coin'}
  '100': {name: '100 Coin'}
  '500': {name: '500 Coin'}
  '1000': {name: '1000 Coin'}
  '5000': {name: '5000 Coin'}
  '10000': {name: '10000 Coin'}
wallet:
  max-balance: 640000
trader-drops:
  # Death-event issuance is NOT active until settlement + journal reconciliation.
  enabled: true
  # Latest user-approved default (2026-11-12): ten percent, not old 0.5.
  chance: 0.1
  minimum-count: 1
  maximum-count: 1
  # Weights are conditional on a successful probability roll.
  weights:
    '1': 256
    '5': 128
    '10': 64
    '50': 32
    '100': 16
    '500': 8
    '1000': 4
    '5000': 2
    '10000': 1
statistics:
  default-enabled: true
  enabled-worlds: []
  disabled-worlds: []
settlement:
  # Bounds the entire saved-source directory walk at each guarded startup.
  # An exhausted budget fails closed; increase only after monitoring the VPS.
  max-source-entries: 1000000
